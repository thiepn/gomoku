name: Private room debug
# request-response diagnostic

on:
  push:
    branches: [main]

jobs:
  debug:
    if: github.event.head_commit.message == 'Run private-room debug'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect room backend request and response path
        run: |
          curl -fsS -X POST https://hycegznamzjhwinegaai.supabase.co/functions/v1/gomoku-room-debug -H 'Content-Type: application/json' --data '{"name":"Smoke Host","rule":"renju-practice"}' | jq .
