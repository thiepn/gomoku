name: Install Chapter 14 Full-Game Mastery and Final Examination

on:
  push:
    paths: ['.github/workflows/install-ch14-course.yml']

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate Chapter 14 payload
        shell: python
        run: |
          from pathlib import Path
          import base64,bz2,hashlib,re,json
          parts=[Path(f'.ch14-payload.part{i}').read_text(encoding='utf-8').strip() for i in range(1,5)]
          enc=''.join(parts)
          data=bz2.decompress(base64.b64decode(enc))
          expected='b7f10fbc38330b6f7bfabbe4d98ce20b2de986bc1bb7cae90e2e895ee9a5b5ad'
          actual=hashlib.sha256(data).hexdigest()
          if actual!=expected: raise SystemExit(f'hash mismatch {actual}')
          text=data.decode('utf-8')
          required=['id="course-ch14-v1-script"','gomoku.course.chapter14.v1','function mountChapter14()','function renderMasteryBoard(task)','function settleCardPlacement(attempt=0)','window.GomokuCourseChapter14','Advanced · Chapter 14','Final Mastery Examination']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'missing markers {missing}')
          m=re.search(r'const LESSONS = (\[.*?\]);\nconst TOTAL_TASKS',text,re.S)
          if not m: raise SystemExit('LESSONS payload not found')
          lessons=json.loads(m.group(1)); tasks=[t for l in lessons for t in l['tasks']]
          if len(lessons)!=8 or len(tasks)!=48 or len({t['id'] for t in tasks})!=48: raise SystemExit('lesson/task count validation failed')
          if [len(l['tasks']) for l in lessons] != [5,5,6,6,5,5,4,12]: raise SystemExit('lesson split invalid')
          if sum(t['type']=='choice' for t in tasks)!=12 or sum(t['type']=='board' for t in tasks)!=36: raise SystemExit('task type counts invalid')
          for t in tasks:
            if t['type']=='board':
              occupied=set(t['black'])|set(t['white'])
              if t['answer'] not in t['candidates'] or t['answer'] in occupied: raise SystemExit(f'bad board answer {t["id"]}')
              if len(t['candidates'])!=len(set(t['candidates'])): raise SystemExit(f'duplicate candidates {t["id"]}')
              if set(t['black']) & set(t['white']): raise SystemExit(f'overlap {t["id"]}')
              for c in t['black']+t['white']+t['candidates']:
                if not re.fullmatch(r'[A-I][1-9]',c): raise SystemExit(f'bad coord {t["id"]} {c}')
          Path('/tmp/ch14-module.html').write_bytes(data)
      - name: Install Chapter 14 into app
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          module=Path('/tmp/ch14-module.html').read_text(encoding='utf-8')
          for n in range(1,14):
              marker=f'id="course-ch{n}-v1-script"'
              if s.count(marker)!=1: raise SystemExit(f'baseline marker count failed for Chapter {n}: {s.count(marker)}')
          if s.count('id="course-ch14-v1-script"')!=0: raise SystemExit('Chapter 14 already installed')
          idx=s.rfind('</body>')
          if idx<0: raise SystemExit('closing body tag not found')
          s=s[:idx]+'\n'+module+'\n'+s[idx:]
          p.write_text(s,encoding='utf-8')
          final=p.read_text(encoding='utf-8')
          for n in range(1,15):
              marker=f'id="course-ch{n}-v1-script"'
              if final.count(marker)!=1: raise SystemExit(f'final marker count failed for Chapter {n}: {final.count(marker)}')
      - name: Commit implementation and clean installer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .ch14-payload.part1 .ch14-payload.part2 .ch14-payload.part3 .ch14-payload.part4 .github/workflows/install-ch14-course.yml
          git commit -m 'Implement Chapter 14 Full-Game Mastery and Final Examination course'
          git push
