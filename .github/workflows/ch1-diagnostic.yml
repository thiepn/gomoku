name: Diagnose Chapter 1 launcher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose Chapter 1 launcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright core
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Diagnose live launcher
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            npm install --no-save --no-package-lock playwright@1.55.0
            npx playwright install chromium --with-deps
            CHROME=""
          fi
          export CHROME
          cat > .diag.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const opts={headless:true};if(process.env.CHROME)opts.executablePath=process.env.CHROME;
          const browser=await chromium.launch(opts);const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});const p=await ctx.newPage();
          const errs=[];p.on('pageerror',e=>errs.push('pageerror:'+e.message));p.on('console',m=>{if(m.type()==='error')errs.push('console:'+m.text())});
          await p.goto('https://thiepn.dev/gomoku/?diag='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000});await p.waitForTimeout(1200);
          const c=p.locator('button[aria-label*="Close" i]:visible');if(await c.count())await c.first().click();const learn=p.getByRole('button',{name:/^learn$/i});if(await learn.count())await learn.click();await p.waitForTimeout(500);
          console.log('PRE',JSON.stringify(await p.evaluate(()=>({cards:document.querySelectorAll('#ch1CourseCard').length,start:!!document.querySelector('#ch1Start'),api:typeof window.GomokuCourseChapter1?.open,boot:window.__GomokuCourseChapter1Booted,dialogs:document.querySelectorAll('#ch1CourseDialog').length,incidents:window.__GomokuEarly117?.incidents?.().slice(-5)}))));
          await p.locator('#ch1Start').click();await p.waitForTimeout(500);
          console.log('AFTER_CLICK',JSON.stringify(await p.evaluate(()=>({dialogs:document.querySelectorAll('#ch1CourseDialog').length,open:document.querySelector('#ch1CourseDialog')?.open??null,board:!!document.querySelector('#ch1Board'),main:document.querySelector('#ch1Main')?.innerText?.slice(0,500)||'',incidents:window.__GomokuEarly117?.incidents?.().slice(-5)}))));
          try{await p.evaluate(()=>window.GomokuCourseChapter1.open());}catch(e){console.log('DIRECT_THROW',String(e));}await p.waitForTimeout(500);
          console.log('AFTER_DIRECT',JSON.stringify(await p.evaluate(()=>({dialogs:document.querySelectorAll('#ch1CourseDialog').length,open:document.querySelector('#ch1CourseDialog')?.open??null,board:!!document.querySelector('#ch1Board'),main:document.querySelector('#ch1Main')?.innerText?.slice(0,700)||'',incidents:window.__GomokuEarly117?.incidents?.().slice(-5)}))));
          console.log('ERRORS',JSON.stringify(errs));await ctx.close();await browser.close();
          JS
          node .diag.mjs
      - name: Remove diagnostic
        if: always()
        run: |
          rm -f .diag.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ch1-diagnostic.yml
          git commit -m 'Remove Chapter 1 diagnostic' || true
          git push || true
