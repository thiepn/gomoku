name: v1.4 Game Feel 2.0
on:
  pull_request:
    paths: ['gamefeel2/**','index.html','sw.js','client-cache-version.txt','.github/workflows/verify-v1.4-gamefeel.yml']
  push:
    branches: [main]
    paths: ['gamefeel2/**','index.html','sw.js','client-cache-version.txt','.github/workflows/verify-v1.4-gamefeel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-feel-2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify Game Feel 2.0 model
        run: node gamefeel2/test-core.cjs
      - name: Rebuild portable artifact
        run: python gamefeel2/build.py
      - name: Require committed generated artifact
        run: git diff --exit-code -- index.html sw.js
      - name: Verify integration
        run: python gamefeel2/test-integration.py
      - name: Preserve previous product contracts
        run: |
          python ui/test-integrity.py
          python analysis/test-integrity.py
          python review/ux/test-integrity.py
          python learning/test-integration.py
          python course2/test-integration.py
          python ai2/test-integration.py
          node review/test-core.cjs
          node analysis/test-core.cjs
      - name: Install Chromium
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          npx playwright install chromium
      - name: Run Game Feel browser acceptance
        env:
          GAMEFEEL2_URL: http://127.0.0.1:8768/
        run: |
          python -m http.server 8768 --bind 127.0.0.1 >/tmp/gamefeel2-http.log 2>&1 &
          python gamefeel2/test-browser.py
      - name: Run product-quality audit
        run: node audit/p25-product-quality.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v1.4-game-feel-2.0
          path: |
            gamefeel2-test-output/
            p25-audit-output/
          retention-days: 14
