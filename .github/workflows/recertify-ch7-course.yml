name: Re-certify Chapter 7 reload persistence

on:
  push:
    paths: ['.github/workflows/recertify-ch7-course.yml']

permissions:
  contents: write
  actions: read

jobs:
  recertify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for this commit's Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for i in $(seq 1 90); do
            data=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" || true)
            state=$(printf '%s' "$data" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=j.workflow_runs?.find(x=>x.name==='pages build and deployment');process.stdout.write(r?.conclusion||r?.status||'missing')}catch{process.stdout.write('bad')}})")
            echo "Pages: $state"
            if [ "$state" = success ]; then ok=1; break; fi
            if [ "$state" = failure ] || [ "$state" = cancelled ]; then exit 1; fi
            sleep 2
          done
          test "$ok" = 1

      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Re-certify stable live reload
        shell: bash
        run: |
          cat > .ch7-recert.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;
          if(!chrome) throw new Error('Chrome missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const p=await ctx.newPage();
          p.setDefaultTimeout(20000);
          const errors=[];
          p.on('pageerror',e=>errors.push(e.message));
          await p.goto(root+'?ch7recert='+Date.now(),{waitUntil:'domcontentloaded'});
          await p.waitForFunction(()=>document.body?.dataset?.ready==='true' && typeof window.GomokuCourseChapter7?.openSection==='function');
          const initial=await p.evaluate(()=>window.GomokuCourseChapter7.report());
          if(initial.totalTasks!==48||initial.totalLessons!==8) throw new Error('Bad report '+JSON.stringify(initial));
          await p.evaluate(()=>localStorage.removeItem('gomoku.course.chapter7.v1'));
          await p.evaluate(()=>window.GomokuCourseChapter7.openSection(1,0));
          await p.waitForSelector('#ch7CourseDialog[open]');
          await p.locator('#ch7Board [data-coord="E5"]').click();
          if(!/^Completed\./.test(await p.locator('#ch7Feedback').innerText())) throw new Error('Board completion failed');
          const before=await p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter7.v1')).tasks.s6);
          if(!before?.correct||!before.firstTry||before.assisted) throw new Error('Pre-reload persistence state '+JSON.stringify(before));
          await p.reload({waitUntil:'domcontentloaded'});
          await p.waitForFunction(()=>document.body?.dataset?.ready==='true' && typeof window.GomokuCourseChapter7?.report==='function');
          const after=await p.evaluate(()=>({report:window.GomokuCourseChapter7.report(),state:JSON.parse(localStorage.getItem('gomoku.course.chapter7.v1'))}));
          if(!after.state?.tasks?.s6?.correct||after.report.lessons[1].completed<1) throw new Error('Reload persistence failed '+JSON.stringify(after));
          const stack=await p.evaluate(()=>[1,2,3,4,5,6,7].map(n=>document.querySelectorAll(`#ch${n}CourseCard`).length));
          if(stack.some(n=>n!==1)) throw new Error('Course stack '+JSON.stringify(stack));
          if(errors.some(x=>/ch7|chapter 7/i.test(x))) throw new Error('Chapter 7 errors '+JSON.stringify(errors));
          console.log('PASS stable reload + persistence + unique Chapters 1-7');
          console.log('CHAPTER7_RECERTIFIED');
          await ctx.close();
          await browser.close();
          JS
          node --check .ch7-recert.mjs
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node .ch7-recert.mjs

      - name: Remove re-certification workflow
        if: always()
        shell: bash
        run: |
          rm -f .ch7-recert.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/recertify-ch7-course.yml
          git commit -m 'Remove Chapter 7 re-certification' || true
          git push || true
