name: Install Chapter 9 Attack Construction course

on:
  push:
    paths: ['.github/workflows/install-ch9-course.yml']

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate Chapter 9 payload
        shell: bash
        run: |
          base64 -d .ch9-module.gz.b64 | gzip -dc > .ch9-module.html
          test "$(sha256sum .ch9-module.html | awk '{print $1}')" = "7c709c9f38f314e2ab80c4069b095d0e8dedbd8461481cc37aba4aea904d987f"
          grep -q 'id="course-ch9-v1-script"' .ch9-module.html
          grep -q 'function placeCard()' .ch9-module.html
          grep -q 'function settleCardPlacement(attempt=0)' .ch9-module.html
          grep -q 'function renderAttackBoard(task)' .ch9-module.html
          grep -q 'gomoku.course.chapter9.v1' .ch9-module.html
      - name: Install Chapter 9 into app
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          module=Path('.ch9-module.html').read_text(encoding='utf-8')
          if 'id="course-ch9-v1-script"' in s:
              raise SystemExit('Chapter 9 already installed')
          for n in range(1,9):
              marker=f'id="course-ch{n}-v1-script"'
              if s.count(marker)!=1:
                  raise SystemExit(f'Expected exactly one Chapter {n} marker, found {s.count(marker)}')
          if '</body>' not in s:
              raise SystemExit('Missing </body> insertion point')
          s=s.replace('</body>', module+'\n</body>', 1)
          for n in range(1,10):
              marker=f'id="course-ch{n}-v1-script"'
              if s.count(marker)!=1:
                  raise SystemExit(f'Post-install marker count failed for Chapter {n}: {s.count(marker)}')
          p.write_text(s,encoding='utf-8')
      - name: Commit implementation and clean installer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .ch9-module.gz.b64 .github/workflows/install-ch9-course.yml
          rm -f .ch9-module.html
          git commit -m 'Implement Chapter 9 Attack Construction and Conversion course'
          git push
