name: Analysis 3.0 A11 physical acceptance and release-readiness evidence
on:
  push:
    branches:
      - phase/a11-physical-acceptance-release-readiness
  pull_request:
    paths:
      - 'analysis3/a11-*'
      - 'analysis3/test-a11-*'
      - 'analysis3/A11-*'
      - '.github/workflows/verify-analysis3-a11.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: analysis3-a11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a11-nondeploying-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check A11 parser and adversarial tests without synthetic approvals
        run: |
          node --check analysis3/a11-release-admission.cjs
          node --check analysis3/test-a11-release-admission.cjs
          node analysis3/test-a11-release-admission.cjs
      - name: Fetch exact A9 passed immutable candidate (no rebuild)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: analysis3-a9-immutable-candidate-evidence
          repository: thiepn/gomoku
          run-id: 37922288752
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .a11-input
      - name: Independently verify upstream asset archive and prepare untested devices
        run: |
          python analysis3/a10-stage-preview.py .a11-input analysis10-test-output/preview-static
          python analysis3/a10-device-packet.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          lock=json.loads(Path('analysis3/a10-source-lock.json').read_text())
          receipt=json.loads(Path('analysis10-test-output/a10-verified-preview.json').read_text())
          worksheet=json.loads(Path('analysis10-test-output/a10-physical-worksheet.json').read_text())
          root=Path('analysis10-test-output/preview-static')
          assert receipt['sourceSha']==lock['sourceSha']
          assert receipt['offlineZipSha256']==lock['offlineZipSha256']
          assert len(receipt['assets'])==8
          for name,digest in receipt['assets'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          assert not worksheet['candidatePreviewUrl']
          assert sum(len(d['testCases']) for d in worksheet['physicalEvidence'].values())==18
          assert all(c['status']=='not_tested' for d in worksheet['physicalEvidence'].values() for c in d['testCases'])
          assert worksheet['ownerApproval']['status']=='not_requested'
          print('PASS A11 immutable source and eight assets; real hosted/device/owner evidence remains unavailable')
          PY
      - name: Confirm default A11 admission fails closed without human evidence
        run: |
          set +e
          node analysis3/a11-release-admission.cjs > a11-blocked-report.json
          code=$?
          set -e
          test "$code" -eq 2
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync('a11-blocked-report.json','utf8'));
          assert.equal(r.status,'blocked-source');
          assert.equal(r.canMerge,false);
          assert.equal(r.canTag,false);
          assert.equal(r.canDeployProduction,false);
          console.log('PASS A11 reports unprovided owner/physical/probe evidence as blocked; zero release privileges');
          NODE
      - name: Upload locked source and blocked acceptance report (not human signoff)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analysis3-a11-nondeploying-admission-evidence
          path: |
            analysis10-test-output/a10-verified-preview.json
            analysis10-test-output/a10-physical-worksheet.json
            a11-blocked-report.json
          if-no-files-found: warn
          retention-days: 14
