name: Install Chapter 5 Defense course

on:
  push:
    paths:
      - '.github/workflows/install-ch5-course.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Chapter 5 module
        shell: python
        run: |
          from pathlib import Path
          import base64, bz2, hashlib
          encoded = Path('.ch5-module.html').read_text(encoding='utf-8').strip()
          data = bz2.decompress(base64.b64decode(encoded))
          expected = 'f6be83a1ae88499ef3fcf666639ddcd5efb1e0de587d07f07ef80b41c522c341'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'Chapter 5 payload hash mismatch: {actual}')
          Path('/tmp/ch5-module.html').write_bytes(data)
      - name: Install module
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          module = Path('/tmp/ch5-module.html').read_text(encoding='utf-8')
          if s.count('id="course-ch4-v1-script"') != 1:
              raise SystemExit('Chapter 4 baseline marker missing or duplicated')
          if 'id="course-ch5-v1-script"' in s or 'gomoku.course.chapter5.v1' in s:
              raise SystemExit('Chapter 5 already present')
          if s.count('</body>') != 1:
              raise SystemExit('Expected exactly one closing body tag')
          if len(re.findall(r'"id":"[a-z][0-9]+"', module)) != 46:
              raise SystemExit('Chapter 5 task count is not 46')
          s = s.replace('</body>', module + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="course-ch5-v1-style"') == 1
          assert s.count('id="course-ch5-v1-script"') == 1
          assert s.count('gomoku.course.chapter5.v1') == 1
          assert s.count('window.GomokuCourseChapter5=') == 1
          m = re.search(r'<script id="course-ch5-v1-script">\n(.*?)\n</script>', s, re.S)
          assert m
          Path('/tmp/ch5.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/ch5.js
          git diff --check
      - name: Commit clean implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .ch5-module.html .github/workflows/install-ch5-course.yml
          git commit -m 'Implement Chapter 5 Defense course'
          git push
