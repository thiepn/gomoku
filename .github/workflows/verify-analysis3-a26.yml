name: Analysis 3.0 A26 original witness acceptance desk (nondeploying)
on:
  push:
    branches: [phase/a26-authentic-witness-intake]
  pull_request:
    paths:
      - 'analysis3/a26-*'
      - 'analysis3/test-a26-*'
      - 'analysis3/A26-*'
      - '.github/workflows/verify-analysis3-a26.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: analysis3-a26-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-witness-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # immutable P19
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # immutable P19
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable P19
        with:
          python-version: '3.12'
      - name: Retrieve public original A9 candidate archive (never production)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: analysis3-a9-immutable-candidate-evidence
          repository: thiepn/gomoku
          run-id: 37922288752
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .a26-original-a9
      - name: Reverify immutable original A9 assets for inherited A25 regression
        run: |
          python analysis3/a10-stage-preview.py .a26-original-a9 analysis24-test-output/preview-static
          python analysis3/a10-stage-preview.py .a26-original-a9 analysis25-test-output/preview-static
      - name: Inherited A24/A25 source-byte and new A26 adversarial tests
        run: |
          node --check analysis3/a26-witness-intake.cjs
          node --check analysis3/test-a26-witness.cjs
          node analysis3/test-a24-operator.cjs
          node analysis3/test-a25-handoff.cjs
          node analysis3/test-a26-witness.cjs
          node operations/p19-supply-chain-policy.mjs
      - name: Isolated real Chromium A25 and A26 desktop/mobile-emulated original-file intake
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python analysis3/test-a25-browser.py
          python analysis3/test-a26-browser.py
      - name: Assert no human/source/host authority or release certification gained from CI
        env:
          A26_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p analysis26-test-output
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const A=require('./analysis3/a23-acceptance.cjs').status();
          const roots=require('./analysis3/a18-review-roots.json');
          const parent=require('./analysis3/a23-parent-evidence.json');
          assert.equal(A.status,'NO_GO');
          assert.equal(A.physicalAccepted,0);
          assert.equal(roots.issuerKeys.length,0);
          assert.equal(parent.realSignerRoots.length,0);
          assert.equal(parent.realProviderRoots.length,0);
          for(const k of ['canMerge','canTag','canDeploy','canModifyProductionData','canCertifyPhysical','canCloseRelease','canGrantOwnerAuthority'])
            assert.equal(A[k],false);
          const packet={
            format:'GomokuA26QualificationOnly',version:26,
            authoredHead:process.env.A26_HEAD,
            checkoutSha:process.env.GITHUB_SHA,
            qualifiedParentA25:'10670c85fbd18077069ad69dc8a8079e0214127f',
            originalA9Source:'fca45816ed7d3a95bae550b9aa644e29053875f6',
            scope:'PUBLIC_A9_CI_BYTES_AND_SYNTHETIC_EXTERNAL_ORIGINALS_CHROMIUM_EMULATION',
            productionTouched:false,liveHostedRequests:0,realPhysicalAccepted:0,
            authenticHumanWitnesses:0,legalSourceRightsGranted:false,
            independentSignerRoots:0,actualPwaRollback:false,
            previousStablePlayerRecovery:false,actualA12Cutover:false,
            actualA13TelemetryHours:0,canMerge:false,canTag:false,canDeploy:false,
            decision:'NO_GO'};
          fs.writeFileSync('analysis26-test-output/a26-qualification.json',
            JSON.stringify(packet,null,2)+'\n');
          console.log('A26 source tests PASS, real human / physical / release gates OPEN');
          NODE
      - name: Retain source-only NO_GO qualification receipt (never private media)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a26-local-originals-nondeploying-qualification
          path: analysis26-test-output/a26-qualification.json
          if-no-files-found: warn
          retention-days: 14
