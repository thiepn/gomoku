name: Final certify Chapter 9 Attack Construction and Conversion

on:
  push:
    paths: ['.github/workflows/certify-ch9-course.yml']

permissions:
  actions: read
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for this commit's Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 100); do
            data=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" || true)
            state=$(printf '%s' "$data" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=j.workflow_runs?.find(x=>x.name==='pages build and deployment');process.stdout.write(r?.conclusion||r?.status||'missing')}catch{process.stdout.write('bad')}})")
            echo "Pages: $state"
            if [ "$state" = success ]; then ok=1; break; fi
            if [ "$state" = failure ] || [ "$state" = cancelled ]; then exit 1; fi
            sleep 2
          done
          test "$ok" = 1
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Confirm live Chapter 9 source
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 30); do
            curl -fsSL "https://thiepn.dev/gomoku/?ch9source=$(date +%s%N)" -o /tmp/live.html || true
            if grep -q 'id="course-ch9-v1-script"' /tmp/live.html \
              && grep -q 'function placeCard()' /tmp/live.html \
              && grep -q 'function settleCardPlacement(attempt=0)' /tmp/live.html \
              && grep -q 'function renderAttackBoard(task)' /tmp/live.html \
              && grep -q 'gomoku.course.chapter9.v1' /tmp/live.html; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          for n in 1 2 3 4 5 6 7 8 9; do
            test "$(grep -o "id=\"course-ch${n}-v1-script\"" /tmp/live.html | wc -l)" = 1
          done
      - name: Certify live Chapter 9
        shell: bash
        run: |
          cat > .ch9-cert.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;
          if(!chrome) throw new Error('Chrome missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const answers=[[{"type":"choice","answer":"Building a sequence in which each move increases concrete pressure or preserves multiple forcing continuations","id":"a1"},{"type":"choice","answer":"Improve the next move as well","id":"a2"},{"type":"choice","answer":"The defender cannot solve the whole position with one predictable reply","id":"a3"},{"type":"choice","answer":"When the position already supports a concrete forcing sequence","id":"a4"},{"type":"choice","answer":"The attacker spends tempo on a threat the defender can answer while improving their own position","id":"a5"}],[{"type":"board","answer":"F5","id":"a6"},{"type":"board","answer":"F6","id":"a7"},{"type":"board","answer":"E6","id":"a8"},{"type":"board","answer":"F4","id":"a9"},{"type":"board","answer":"E6","id":"a10"}],[{"type":"board","answer":"D5","id":"a11"},{"type":"board","answer":"E5","id":"a12"},{"type":"board","answer":"F4","id":"a13"},{"type":"board","answer":"D4","id":"a14"},{"type":"board","answer":"D5","id":"a15"},{"type":"board","answer":"D5","id":"a16"}],[{"type":"board","answer":"F5","id":"a17"},{"type":"board","answer":"E5","id":"a18"},{"type":"board","answer":"F4","id":"a19"},{"type":"board","answer":"E4","id":"a20"},{"type":"board","answer":"F5","id":"a21"},{"type":"board","answer":"E5","id":"a22"}],[{"type":"board","answer":"F5","id":"a23"},{"type":"board","answer":"F6","id":"a24"},{"type":"board","answer":"D5","id":"a25"},{"type":"board","answer":"E5","id":"a26"},{"type":"board","answer":"E5","id":"a27"}],[{"type":"board","answer":"F5","id":"a28"},{"type":"board","answer":"F4","id":"a29"},{"type":"board","answer":"F6","id":"a30"},{"type":"board","answer":"D6","id":"a31"},{"type":"board","answer":"E5","id":"a32"}],[{"type":"board","answer":"A5","id":"a33"},{"type":"board","answer":"F6","id":"a34"},{"type":"board","answer":"E6","id":"a35"},{"type":"board","answer":"D4","id":"a36"}],[{"type":"choice","answer":"Build useful shape → create a forcing move → preserve branches → restrict replies → convert","id":"a37"},{"type":"choice","answer":"It improves more than one credible continuation without giving the defender a free tactical resource","id":"a38"},{"type":"choice","answer":"Its forced reply may solve your threat while improving the defender's position and killing your continuation","id":"a39"},{"type":"choice","answer":"When every relevant defense leads to another forcing continuation or an immediate win","id":"a40"},{"type":"choice","answer":"Re-evaluate and build the next high-quality threat instead of forcing a fake continuation","id":"a41"},{"type":"choice","answer":"Prefer the move that leaves more strong continuations and fewer useful defensive replies","id":"a42"},{"type":"choice","answer":"A concrete win or a position where the defender has no adequate reply","id":"a43"},{"type":"board","answer":"F5","id":"a44"},{"type":"board","answer":"D6","id":"a45"},{"type":"board","answer":"E5","id":"a46"},{"type":"board","answer":"F6","id":"a47"},{"type":"board","answer":"A5","id":"a48"}]];
          const allAnswers=answers.flat();

          const make=async()=>{
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const p=await ctx.newPage();
            p.setDefaultTimeout(15000);
            p.setDefaultNavigationTimeout(20000);
            const errors=[];
            p.on('pageerror',e=>errors.push(e.message));
            await p.addInitScript(()=>{
              const original=HTMLDialogElement.prototype.showModal;
              HTMLDialogElement.prototype.showModal=function(){
                if(this.id==='v112WelcomeDialog') return;
                return original.call(this);
              };
            });
            await p.goto(root+'?ch9cert='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body?.dataset?.ready==='true'&&typeof window.GomokuCourseChapter9?.openSection==='function',null,{timeout:20000});
            await p.evaluate(()=>{
              document.querySelectorAll('dialog[open]:not(#ch9CourseDialog)').forEach(d=>d.close?.());
              document.querySelector('[data-v92-route="improve"]')?.click();
            });
            await p.waitForFunction(()=>document.querySelector('#ch9CourseCard')?.parentElement?.id==='v92ImproveHome'&&document.querySelector('#ch8CourseCard')?.nextElementSibling?.id==='ch9CourseCard',null,{timeout:10000});
            return {ctx,p,errors};
          };
          const dismiss=async p=>p.evaluate(()=>document.querySelectorAll('dialog[open]:not(#ch9CourseDialog)').forEach(d=>d.close?.()));
          const open=async(p,l,t)=>{
            await dismiss(p);
            await p.evaluate(([l,t])=>window.GomokuCourseChapter9.openSection(l,t),[l,t]);
            await p.waitForSelector('#ch9CourseDialog[open]');
            await dismiss(p);
          };
          const completeText=async p=>/^Completed\./.test(await p.locator('#ch9Feedback').innerText());
          const assertStack=async p=>{
            const x=await p.evaluate(()=>{
              const cards=[1,2,3,4,5,6,7,8,9].map(n=>document.querySelector(`#ch${n}CourseCard`));
              const follows=(a,b)=>!!(a&&b&&(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING));
              return {counts:cards.map((_,i)=>document.querySelectorAll(`#ch${i+1}CourseCard`).length),order:cards.every(Boolean)&&cards.slice(0,-1).every((c,i)=>follows(c,cards[i+1])),parents:cards.map(c=>c?.parentElement?.id||null)};
            });
            if(x.counts.some(n=>n!==1)||!x.order||x.parents.some(x=>x!=='v92ImproveHome')) throw new Error('Course stack '+JSON.stringify(x));
          };
          const assertMobile=async(p,label)=>{
            const g=await p.evaluate(()=>{
              const d=document.querySelector('#ch9CourseDialog'),f=d?.querySelector('.ch9-bottom'),r=document.querySelector('#ch9Reveal'),b=document.querySelector('#ch9Board');
              const fr=f?.getBoundingClientRect(),rr=r?.getBoundingClientRect(),br=b?.getBoundingClientRect();
              return {iw:innerWidth,ih:innerHeight,page:document.documentElement.scrollWidth,dialog:d?.scrollWidth,footer:fr?[fr.left,fr.top,fr.right,fr.bottom,fr.width,fr.height]:null,reveal:rr?[rr.left,rr.top,rr.right,rr.bottom,rr.width,rr.height]:null,board:br?[br.left,br.top,br.right,br.bottom,br.width,br.height]:null,rv:r?.checkVisibility?.()};
            });
            if(g.page>g.iw+2||g.dialog>g.iw+2||!g.footer||g.footer[4]<=1||g.footer[5]<=1||!g.reveal||g.reveal[4]<=1||g.reveal[5]<=1||!g.rv||g.reveal[0]<-1||g.reveal[2]>g.iw+1||g.reveal[1]<-1||g.reveal[3]>g.ih+1) throw new Error(label+' mobile geometry '+JSON.stringify(g));
            if(g.board&&g.board[4]>g.iw+2) throw new Error(label+' board overflow '+JSON.stringify(g));
          };

          // A — shell, structure, coaching and assisted accounting.
          const A=await make();
          await assertStack(A.p);
          let report=await A.p.evaluate(()=>window.GomokuCourseChapter9.report());
          if(report.totalTasks!==48||report.totalLessons!==8) throw new Error('Report '+JSON.stringify(report));
          await open(A.p,0,0);
          await assertMobile(A.p,'choice shell');
          await A.p.locator('#ch9CourseDialog[open]').getByRole('button',{name:"Playing toward the opponent's largest group",exact:true}).click();
          if(!/Not this\./.test(await A.p.locator('#ch9Feedback').innerText())||!(await A.p.locator('#ch9Reveal').isDisabled())) throw new Error('First miss coaching');
          await A.p.locator('#ch9CourseDialog[open]').getByRole('button',{name:'Adding stones as close together as possible',exact:true}).click();
          if(await A.p.locator('#ch9Reveal').isDisabled()) throw new Error('Reveal unavailable after second miss');
          await A.p.locator('#ch9Reveal').click();
          const assisted=await A.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter9.v1')).tasks.a1);
          if(!assisted?.correct||!assisted.assisted||assisted.firstTry!==false) throw new Error('Assisted state '+JSON.stringify(assisted));
          console.log('PASS structure + mobile shell + coaching + assisted accounting');
          await A.ctx.close();

          // B — complete every task cleanly with real pointer clicks.
          const B=await make();
          await assertStack(B.p);
          let completed=0;
          for(let l=0;l<answers.length;l++){
            for(let t=0;t<answers[l].length;t++){
              const a=answers[l][t];
              await open(B.p,l,t);
              if(a.type==='choice'){
                await B.p.locator('#ch9CourseDialog[open]').getByRole('button',{name:a.answer,exact:true}).click();
              }else{
                const cell=B.p.locator(`#ch9Board [data-coord="${a.answer}"]`);
                if(await cell.getAttribute('data-candidate')!=='1') throw new Error('Answer not candidate '+a.id+' '+a.answer);
                await cell.click();
              }
              if(!(await completeText(B.p))) throw new Error('Task failed '+a.id);
              const rec=await B.p.evaluate(id=>JSON.parse(localStorage.getItem('gomoku.course.chapter9.v1')).tasks[id],a.id);
              if(!rec?.correct||!rec.firstTry||rec.assisted) throw new Error('Task score '+a.id+' '+JSON.stringify(rec));
              completed++;
              if(a.id==='a6') await assertMobile(B.p,'board shell');
              if(a.id==='a37'&&!/1 \/ 12/.test(await B.p.locator('.ch9-task-count').innerText())) throw new Error('Checkpoint count');
            }
          }
          if(completed!==48) throw new Error('Completion loop '+completed);
          report=await B.p.evaluate(()=>window.GomokuCourseChapter9.report());
          if(report.completed!==48||report.lessons.some(x=>!x.complete||x.rate!==1)) throw new Error('Perfect report '+JSON.stringify(report));
          const state=await B.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter9.v1')));
          for(const a of allAnswers) if(!state?.tasks?.[a.id]?.correct||!state.tasks[a.id].firstTry||state.tasks[a.id].assisted) throw new Error('State mismatch '+a.id);
          console.log('PASS all 48 tasks first try + perfect lesson scoring');

          // Persistence after a true navigation reload.
          await B.p.reload({waitUntil:'domcontentloaded',timeout:20000});
          await B.p.waitForFunction(()=>document.body?.dataset?.ready==='true'&&typeof window.GomokuCourseChapter9?.report==='function',null,{timeout:20000});
          await B.p.evaluate(()=>{document.querySelectorAll('dialog[open]:not(#ch9CourseDialog)').forEach(d=>d.close?.());document.querySelector('[data-v92-route="improve"]')?.click()});
          await B.p.waitForFunction(()=>document.querySelector('#ch8CourseCard')?.nextElementSibling?.id==='ch9CourseCard',null,{timeout:10000});
          await assertStack(B.p);
          const persisted=await B.p.evaluate(()=>({report:window.GomokuCourseChapter9.report(),state:JSON.parse(localStorage.getItem('gomoku.course.chapter9.v1')),counts:[1,2,3,4,5,6,7,8,9].map(n=>document.querySelectorAll(`#ch${n}CourseCard`).length)}));
          if(persisted.report.completed!==48||persisted.report.lessons.some(x=>!x.complete||x.rate!==1)) throw new Error('Progress persistence '+JSON.stringify(persisted.report));
          for(const a of allAnswers) if(!persisted.state?.tasks?.[a.id]?.correct) throw new Error('Missing persisted '+a.id);
          if(persisted.counts.some(n=>n!==1)) throw new Error('Duplicate cards '+JSON.stringify(persisted.counts));
          if(B.errors.some(x=>/ch9|chapter 9/i.test(x))) throw new Error('Chapter 9 page errors '+JSON.stringify(B.errors));
          console.log('PASS reload persistence + unique ordered Chapters 1-9 + no Chapter 9 errors');
          await B.ctx.close();
          await browser.close();
          console.log('CHAPTER9_CERTIFIED');
          JS
          node --check .ch9-cert.mjs
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          timeout 180s env CHROME="$CHROME" node .ch9-cert.mjs
      - name: Remove certification workflow
        if: always()
        shell: bash
        run: |
          rm -f .ch9-cert.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/certify-ch9-course.yml
          git commit -m 'Remove Chapter 9 certification' || true
          git pull --rebase || true
          git push || true
