name: Realtime private room smoke test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke:
    if: github.event.head_commit.message == 'Run realtime room smoke test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install realtime client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.107.0
      - name: Verify database broadcast reaches a room subscriber
        run: |
          cat > realtime-smoke.mjs <<'JS'
          import fs from 'node:fs';
          import { createClient } from '@supabase/supabase-js';
          const source=fs.readFileSync('index.html','utf8');
          const project=source.match(/ROOM_PROJECT_URL='([^']+)'/)?.[1];
          const key=source.match(/ROOM_API_KEY='([^']+)'/)?.[1];
          if(!project||!key)throw new Error('Room project configuration not found');
          const api=project+'/functions/v1/gomoku-room';
          async function post(path,body){
            const res=await fetch(api+path,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(body)});
            const data=await res.json();
            if(!res.ok)throw new Error(path+' failed '+res.status+' '+JSON.stringify(data));
            return data;
          }
          const created=await post('/api/rooms',{name:'Realtime Host',rule:'renju-practice'});
          const room=created.id;
          console.log('SMOKE_ROOM='+room);
          const client=createClient(project,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
          let resolveSub,rejectSub,resolveEvent;
          const subscribed=new Promise((r,j)=>{resolveSub=r;rejectSub=j});
          const received=new Promise(r=>resolveEvent=r);
          const channel=client.channel('gomoku:'+room,{config:{broadcast:{self:false},private:false}})
            .on('broadcast',{event:'changed'},msg=>{console.log('BROADCAST='+JSON.stringify(msg.payload||{}));if(Number(msg.payload?.revision)===1)resolveEvent(msg.payload);})
            .subscribe(status=>{console.log('CHANNEL='+status);if(status==='SUBSCRIBED')resolveSub();if(['CHANNEL_ERROR','TIMED_OUT'].includes(status))rejectSub(new Error(status));});
          const limit=(label)=>new Promise((_,j)=>setTimeout(()=>j(new Error('Timed out: '+label)),8000));
          await Promise.race([subscribed,limit('subscription')]);
          await post('/api/rooms/'+room+'/join',{name:'Realtime Guest'});
          const event=await Promise.race([received,limit('revision 1 broadcast')]);
          if(Number(event.revision)!==1)throw new Error('Wrong revision payload');
          await client.removeChannel(channel);
          console.log('REALTIME_SMOKE_PASS room='+room);
          JS
          node realtime-smoke.mjs
      - name: Remove temporary smoke workflow
        run: |
          rm -f realtime-smoke.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/realtime-smoke.yml
          git commit -m 'Remove realtime room smoke test'
          git push
