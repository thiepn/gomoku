name: Analysis 3.0 A20 external evidence acceptance and multioperator recovery readiness
on:
  push:
    branches: [phase/a20-external-acceptance-recovery]
  pull_request:
    paths:
      - 'analysis3/a20-*'
      - 'analysis3/test-a20-*'
      - 'analysis3/A20-*'
      - '.github/workflows/verify-analysis3-a20.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: analysis3-a20-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a20-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # P19 immutable pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # P19 immutable pinned
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # P19 immutable pinned
        with:
          python-version: '3.12'
      - name: Download original read-only A9 CI source package, never an actual hosted production preview
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # P19 immutable pinned
        with:
          name: analysis3-a9-immutable-candidate-evidence
          repository: thiepn/gomoku
          run-id: 37922288752
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .a20-input
      - name: Reconcile original A9 nested offline ZIP and exact eight source asset bytes
        run: python analysis3/a10-stage-preview.py .a20-input analysis20-test-output/preview-static
      - name: Adversarial source-byte escrow, nonce/CAS, revoked-key, physical and distinct rollback tests
        run: |
          node --check analysis3/a20-original-intake.cjs
          node --check analysis3/a20-multioperator-recovery.cjs
          node --check analysis3/a20-release-review.cjs
          node --check analysis3/test-a20-evidence.cjs
          node analysis3/test-a20-evidence.cjs
          node operations/p19-supply-chain-policy.mjs
      - name: Actual localhost Chromium desktop/mobile-emulated operator conflict and pending-only physical tests
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python analysis3/test-a20-browser.py
      - name: Enforce zero real signer roots, zero accepted hardware and NO_GO at exact source
        env:
          A20_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const roots=require('./analysis3/a20-external-roots.json');
          const root18=require('./analysis3/a18-review-roots.json');
          const review=require('./analysis3/a20-release-review.cjs').state();
          assert.equal(roots.keys.length,0);
          assert.equal(roots.providerTrustRoots.length,0);
          assert.equal(root18.issuerKeys.length,0);
          assert.equal(roots.physicalAccepted,0);
          assert.equal(review.status,'NO_GO');
          for(const k of ['canDeploy','canMerge','canTag','canModifyProductionData','canCertifyPhysical','canCloseRelease','canGrantOwnerAuthority'])assert.equal(review[k],false);
          fs.mkdirSync('analysis20-test-output',{recursive:true});
          fs.writeFileSync('analysis20-test-output/a20-synthetic-report.json',JSON.stringify({
            format:'GomokuA20SyntheticQualificationOnly',sourceHeadSha:process.env.A20_SOURCE_HEAD,
            testedCheckoutSha:process.env.GITHUB_SHA,
            sourceA19Head:roots.a19Head,originalA9Sha:roots.originalA9Source,
            realPhysicalCases:0,realSigners:0,actualHostedAuthorized:false,
            independentGlobalReplayLedger:false,actualPreviousStableRestore:false,
            actualA12ProductionCutover:false,realA13PostreleaseMonitoring:false,
            productionDataAccessed:false,releasePermission:false,
            classification:'SYNTHETIC_NODE_AND_LOCAL_CHROMIUM_ONLY',decision:'NO_GO'
          },null,2)+'\n');
          console.log('PASS A20 NO_GO: independent original source, zero real hardware/human/production acceptance');
          NODE
      - name: Retain read-only synthetic qualification metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # P19 immutable pinned
        with:
          name: a20-synthetic-custody-qa
          path: analysis20-test-output/a20-synthetic-report.json
          retention-days: 14
          if-no-files-found: warn
