name: Harden Chapter 1 against Learn rerenders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Harden Chapter 1 against Learn rerenders'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Chapter card uniqueness observer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="let dialog=null,selected=-1,revealed=false,lastWrong=-1;\n\nfunction mount(){\n const existing=[...document.querySelectorAll('#ch1CourseCard')];for(let i=1;i<existing.length;i++)existing[i].remove();\n if($('#ch1CourseCard'))return;"
          new="""let dialog=null,selected=-1,revealed=false,lastWrong=-1,courseCardObserver=null;\nfunction enforceSingleCourseCard(){const cards=[...document.querySelectorAll('#ch1CourseCard')];if(cards.length<=1)return;const keep=cards.find(x=>x.isConnected&&x.getClientRects().length)||cards[0];for(const card of cards)if(card!==keep)card.remove();}\nfunction watchCourseCard(){if(courseCardObserver||!document.body)return;courseCardObserver=new MutationObserver(enforceSingleCourseCard);courseCardObserver.observe(document.body,{childList:true,subtree:true});window.__GomokuCourseChapter1Observer=courseCardObserver;}\n\nfunction mount(){\n enforceSingleCourseCard();watchCourseCard();\n if($('#ch1CourseCard'))return;"""
          if s.count(old)!=1: raise SystemExit('Chapter mount hardening marker mismatch '+str(s.count(old)))
          s=s.replace(old,new,1)
          after=" const path=$('v112LearnPath'),intro=home.querySelector('.v92-page-intro');(path||intro)?.insertAdjacentElement('afterend',card);"
          after2=after+"\n enforceSingleCourseCard();"
          if s.count(after)!=1: raise SystemExit('Chapter insertion marker mismatch')
          s=s.replace(after,after2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['function enforceSingleCourseCard()','new MutationObserver(enforceSingleCourseCard)','window.__GomokuCourseChapter1Observer','window.__GomokuCourseChapter1Booted']:
              if x not in s: raise SystemExit('missing '+x)
          if s.count('id="course-ch1-v1-script"')!=1: raise SystemExit('Chapter script count changed')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:f.write(js);name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'script {i}: {r.stderr}')
          print('Chapter rerender hardening validated')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/harden-ch1-rerender.yml
          git commit -m 'Keep Chapter 1 card unique across rerenders'
          git push
