name: Analysis 3.0 A27 isolated operator acceptance (NO_GO)
on:
  push:
    branches: [phase/a27-physical-acceptance-intake]
  pull_request:
    paths:
      - 'analysis3/a27-*'
      - 'analysis3/test-a27-*'
      - 'analysis3/A27-*'
      - '.github/workflows/verify-analysis3-a27.yml'
permissions:
  contents: read
concurrency:
  group: gomoku-a27-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-field-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline only adversarial operator and source-custody assertions
        run: |
          node --check analysis3/a27-field-intake.cjs
          node --check analysis3/test-a27-field.cjs
          node analysis3/test-a27-field.cjs
          node operations/p19-supply-chain-policy.mjs
      - name: Isolated localhost Chromium desktop and mobile emulation (NOT actual physical hardware)
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python analysis3/test-a27-browser.py
      - name: Record source-only NO_GO without original private files
        env:
          A27_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p analysis27-test-output
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const A=require('./analysis3/a23-acceptance.cjs').status();
          const gate=require('./analysis3/a27-field-intake.cjs');
          const p=require('./analysis3/a10-source-lock.json');
          const roots=require('./analysis3/a18-review-roots.json');
          assert.equal(A.status,'NO_GO');assert.equal(A.physicalAccepted,0);
          assert.equal(roots.issuerKeys.length,0);
          assert.equal(gate.CASES.length,25);
          const empty=gate.evaluate({manifest:{
            format:'GomokuA27PhysicalObservationDraft',version:27,
            a26QualifiedHead:'407bfb88430539932ab6bf07df1b33ae7b86829c',
            originalA9SourceSha:p.sourceSha,releaseState:'NO_GO',
            humanOwnerApproval:'NOT_OBTAINED',observations:[]}});
          assert.equal(empty.notTested,25);assert.equal(empty.reportedPass,0);
          assert.equal(empty.reportedFail,0);assert.equal(empty.canDeploy,false);
          assert.equal(empty.decision,'NO_GO');
          const report={format:'GomokuA27SourceOnlyQualification',version:27,
            sourceHead:process.env.A27_HEAD,checkoutSha:process.env.GITHUB_SHA,
            qualifiedParentA26:'407bfb88430539932ab6bf07df1b33ae7b86829c',
            originalA9Source:p.sourceSha,
            syntheticCIOnly:true,originalPrivateMediaIncluded:false,
            realHostedRequests:0,realPhysicalPass:0,realPhysicalFail:0,
            actualCasesTested:0,notTested:25,independentHumanWitnessesApproved:0,
            ownerAuthorization:false,realServiceWorkerRecovery:false,
            actualA12Cutover:false,actualA13MonitoringHours:0,
            canMerge:false,canTag:false,canDeploy:false,decision:'NO_GO'};
          fs.writeFileSync('analysis27-test-output/a27-source-no-go.json',
            JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Retain source-only qualification (no original files or personal data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a27-source-only-no-go
          path: analysis27-test-output/a27-source-no-go.json
          retention-days: 14
          if-no-files-found: warn
