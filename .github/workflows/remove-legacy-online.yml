name: Legacy online cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message == 'Retry legacy online cleanup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python .github/remove_legacy_online.py
      - name: Validate cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          forbidden=['openPlatform','queueTicket','queuePoll','pollQueue','keepQueue','platformSession','normalizedServer','gomoku.account.v5','gomoku.queue.v56','Quick match','Server URL','Optional accounts and online play require your own hosted server.','runAccountSync','platformFetch','authRequest','loadLeaderboard','joinQueue','cancelQueue','startSSE']
          leftovers={x:s.count(x) for x in forbidden if s.count(x)}
          if leftovers: raise SystemExit('legacy leftovers '+repr(leftovers))
          required=['let roomStream=null,networkClockTimer=0;','async function ensureRoomStream()','presence:{key:n.presenceKey}','function stopRoomStream()','function renderNetworkClock()','function renderNetworkOpening()','id="platformBtn"','No public matchmaking.','No account or public matchmaking is required.','function openOnline()','roomMatchHud','roomChatSheet']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing current room pieces '+repr(missing))
          for i,js in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)):
              if not js.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(js); name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'script {i}: {r.stderr}')
          print('legacy cleanup validated')
          PY
      - name: Commit production cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/remove_legacy_online.py .github/workflows/remove-legacy-online.yml
          git commit -m 'Remove legacy matchmaking and account subsystem'
          git push
