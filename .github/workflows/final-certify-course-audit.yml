name: Final certify whole Gomoku course audit

on:
  push:
    paths: ['.github/workflows/final-certify-course-audit.yml']

permissions:
  actions: read
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Wait for exact Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for i in $(seq 1 180); do
            data=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" || true)
            state=$(printf '%s' "$data" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=j.workflow_runs?.find(x=>x.name==='pages build and deployment');process.stdout.write(r?.conclusion||r?.status||'missing')}catch{process.stdout.write('bad')}})")
            echo "Pages: $state"
            if [ "$state" = success ]; then ok=1; break; fi
            if [ "$state" = failure ] || [ "$state" = cancelled ]; then exit 1; fi
            sleep 2
          done
          test "$ok" = 1
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Final live course certification
        shell: bash
        run: |
          cat > .final-course-cert.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/',chrome=process.env.CHROME;if(!chrome)throw new Error('Chrome missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const neutralize=async ctx=>ctx.addInitScript(()=>{const o=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){if(this.id==='v112WelcomeDialog')return;return o.call(this)};});
          const ch1Done=r=>(r.lessons||[]).reduce((a,x)=>a+Number(x.done||0),0),ch1Total=r=>(r.lessons||[]).reduce((a,x)=>a+Number(x.total||0),0);

          async function shell(viewport,label){
            const ctx=await browser.newContext({viewport,isMobile:viewport.width<600,hasTouch:viewport.width<600});await neutralize(ctx);const p=await ctx.newPage();p.setDefaultTimeout(16000);p.setDefaultNavigationTimeout(30000);
            await p.goto(root+'?final-course-shell='+label+'-'+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.body?.dataset?.ready==='true');
            await p.evaluate(()=>{document.querySelectorAll('dialog[open]').forEach(d=>d.close?.());document.querySelector('[data-v92-route="improve"]')?.click()});
            await p.waitForFunction(()=>document.querySelector('#ch14CourseCard')?.parentElement?.id==='v92ImproveHome');
            const x=await p.evaluate(()=>{const cards=Array.from({length:14},(_,i)=>document.querySelector(`#ch${i+1}CourseCard`));const follows=(a,b)=>!!(a&&b&&(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING));let total=0;const reports=[];for(let n=1;n<=14;n++){const r=window[`GomokuCourseChapter${n}`]?.report?.();const gs=r?.lessons||r?.sections||[];const t=n===1?gs.reduce((a,z)=>a+Number(z.total||0),0):Number(r?.totalTasks??gs.reduce((a,z)=>a+Number(z.total||0),0));total+=t;reports.push({n,t,title:r?.title||'',lessons:gs.map(z=>z.title||z.name||'')})}return{counts:cards.map((_,i)=>document.querySelectorAll(`#ch${i+1}CourseCard`).length),parents:cards.map(c=>c?.parentElement?.id||null),order:cards.every(Boolean)&&cards.slice(0,-1).every((c,i)=>follows(c,cards[i+1])),total,reports,page:document.documentElement.scrollWidth,iw:innerWidth}});
            if(x.counts.some(v=>v!==1)||x.parents.some(v=>v!=='v92ImproveHome')||!x.order||x.total!==655||x.page>x.iw+3)throw new Error(label+' shell '+JSON.stringify(x));
            const ch5=x.reports.find(r=>r.n===5);if(ch5.title!=='Defense'||ch5.lessons.length!==8||ch5.lessons.some(v=>!v))throw new Error('Ch5 report metadata '+JSON.stringify(ch5));
            console.log(`FINAL_${label.toUpperCase()}_SHELL_PASS totalTasks=${x.total}`);await ctx.close();
          }
          await shell({width:390,height:844},'mobile');await shell({width:1440,height:900},'desktop');

          // Chapter 1: discover all accepted answers, then clean-reset replay every one with real pointer navigation.
          async function makeCh1(tag){
            const ctx=await browser.newContext({viewport:{width:1100,height:850}});await neutralize(ctx);await ctx.addInitScript(()=>localStorage.removeItem('gomoku.course.chapter1.v1'));
            const p=await ctx.newPage();p.setDefaultTimeout(16000);p.setDefaultNavigationTimeout(30000);await p.goto(root+'?final-ch1='+tag+'-'+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.body?.dataset?.ready==='true'&&window.GomokuCourseChapter1?.open);await p.evaluate(()=>window.GomokuCourseChapter1.open());await p.waitForSelector('#ch1CourseDialog[open]');return{ctx,p};
          }
          async function ch1Candidates(p){return p.locator('#ch1Board button:not([disabled])').evaluateAll(bs=>bs.map(b=>b.dataset.i));}
          async function clickNextAndCheck(p){
            const b=p.locator('#ch1NextTask');if(!await b.count()||!await b.isVisible())throw new Error('Ch1 next not visible');
            const hit=await p.evaluate(()=>{const b=document.querySelector('#ch1NextTask'),bd=document.querySelector('#ch1Board');const r=b.getBoundingClientRect(),br=bd.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,h=document.elementFromPoint(x,y);return{button:[r.left,r.top,r.right,r.bottom,r.width,r.height],board:[br.left,br.top,br.right,br.bottom,br.width,br.height],hitId:h?.id||'',hitClass:h?.className||'',ok:h===b||b.contains(h),page:document.documentElement.scrollWidth,iw:innerWidth}});
            if(!hit.ok||hit.page>hit.iw+3)throw new Error('Ch1 control overlap '+JSON.stringify(hit));await b.click();
          }
          const A=await makeCh1('discover'),r0=await A.p.evaluate(()=>window.GomokuCourseChapter1.report()),T=ch1Total(r0);if(T!==39)throw new Error('Ch1 total '+T);const answers=[];
          for(let li=0;li<r0.lessons.length;li++){
            if(li>0){await A.p.locator('#ch1Nav button').nth(li).click();}
            const count=Number((await A.p.evaluate(()=>window.GomokuCourseChapter1.report())).lessons[li].total);
            for(let ti=0;ti<count;ti++){
              const before=ch1Done(await A.p.evaluate(()=>window.GomokuCourseChapter1.report())),cs=await ch1Candidates(A.p);let found=null;
              for(const i of cs){const el=A.p.locator(`#ch1Board [data-i="${i}"]`);if(!await el.count()||await el.isDisabled())continue;await el.click();if(ch1Done(await A.p.evaluate(()=>window.GomokuCourseChapter1.report()))===before+1){found=i;break;}}
              if(found==null)throw new Error(`Ch1 unsolvable lesson=${li} task=${ti}`);answers.push({li,ti,i:found});await clickNextAndCheck(A.p);
            }
          }
          if(ch1Done(await A.p.evaluate(()=>window.GomokuCourseChapter1.report()))!==T)throw new Error('Ch1 discovery incomplete');console.log('FINAL_CH1_DISCOVERY_PASS tasks=39');await A.ctx.close();
          const B=await makeCh1('replay');let pos=0;
          for(let li=0;li<r0.lessons.length;li++){
            if(li>0)await B.p.locator('#ch1Nav button').nth(li).click();const count=Number((await B.p.evaluate(()=>window.GomokuCourseChapter1.report())).lessons[li].total);
            for(let ti=0;ti<count;ti++){
              const a=answers[pos++],before=ch1Done(await B.p.evaluate(()=>window.GomokuCourseChapter1.report())),el=B.p.locator(`#ch1Board [data-i="${a.i}"]`);if(!await el.count()||await el.isDisabled())throw new Error(`Ch1 replay target unavailable ${li}/${ti}`);await el.click();if(ch1Done(await B.p.evaluate(()=>window.GomokuCourseChapter1.report()))!==before+1)throw new Error(`Ch1 replay failed ${li}/${ti}`);await clickNextAndCheck(B.p);
            }
          }
          const ch1Final=await B.p.evaluate(()=>window.GomokuCourseChapter1.report());if(!ch1Final.complete||ch1Final.firstTryRate!==1||ch1Done(ch1Final)!==39)throw new Error('Ch1 final '+JSON.stringify(ch1Final));console.log('FINAL_CH1_39_TASKS_FIRST_TRY_PASS');await B.ctx.close();

          // Chapter 5 metadata/framing and Chapter 11 official-format transfer item.
          const C=await browser.newContext({viewport:{width:1100,height:850}});await neutralize(C);await C.addInitScript(()=>localStorage.removeItem('gomoku.course.chapter11.v1'));const p=await C.newPage();p.setDefaultTimeout(16000);await p.goto(root+'?final-course-targeted='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.body?.dataset?.ready==='true'&&window.GomokuCourseChapter11?.openSection);
          const meta=await p.evaluate(()=>({r5:window.GomokuCourseChapter5.report(),card5:document.querySelector('#ch5CourseCard')?.innerText||'',card11:document.querySelector('#ch11CourseCard')?.innerText||''}));if(meta.r5.title!=='Defense'||meta.r5.lessons.some(x=>!x.title)||!/Renju-variant preview/i.test(meta.card5)||!/15×15/i.test(meta.card11)||!/Swap2/i.test(meta.card11))throw new Error('Targeted metadata/framing '+JSON.stringify(meta));
          await p.evaluate(()=>window.GomokuCourseChapter11.openSection(7,6));await p.waitForSelector('#ch11CourseDialog[open]');const q=await p.locator('#ch11CourseDialog .ch11-prompt').innerText();if(!/official RIF competition format/i.test(q))throw new Error('Ch11 o43 prompt '+q);await p.locator('#ch11CourseDialog[open]').getByRole('button',{name:'A 15×15 board with the Swap2 opening procedure',exact:true}).click();const rec=await p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter11.v1')).tasks.o43);if(!rec?.correct||!rec.firstTry||rec.assisted)throw new Error('Ch11 o43 scoring '+JSON.stringify(rec));console.log('FINAL_CH5_CH11_TEACHING_FRAMING_PASS');await C.close();
          await browser.close();console.log('WHOLE_GOMOKU_COURSE_FINAL_CERTIFIED');
          JS
          node --check .final-course-cert.mjs
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          timeout 540s env CHROME="$CHROME" node .final-course-cert.mjs
      - name: Remove certification workflow
        if: always()
        shell: bash
        run: |
          rm -f .final-course-cert.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/final-certify-course-audit.yml
          git commit -m 'Remove final whole-course certification' || true
          git pull --rebase || true
          git push || true
