name: Final certify whole Gomoku course audit v2

on:
  push:
    paths: ['.github/workflows/final-certify-course-audit-v2.yml']

permissions:
  actions: read
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Wait for exact Pages deployment
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          ok=0
          for i in $(seq 1 180); do
            data=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" || true)
            state=$(printf '%s' "$data" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=j.workflow_runs?.find(x=>x.name==='pages build and deployment');process.stdout.write(r?.conclusion||r?.status||'missing')}catch{process.stdout.write('bad')}})")
            echo "Pages: $state"; if [ "$state" = success ]; then ok=1; break; fi
            if [ "$state" = failure ] || [ "$state" = cancelled ]; then exit 1; fi; sleep 2
          done
          test "$ok" = 1
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Certify fixed course
        shell: bash
        run: |
          cat > .cert-v2.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/',chrome=process.env.CHROME;if(!chrome)throw new Error('Chrome missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const neutralize=ctx=>ctx.addInitScript(()=>{const o=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){if(this.id==='v112WelcomeDialog')return;return o.call(this)};});
          const done=r=>(r.lessons||[]).reduce((a,x)=>a+Number(x.done||0),0),total=r=>(r.lessons||[]).reduce((a,x)=>a+Number(x.total||0),0);
          async function shell(viewport,label){const ctx=await browser.newContext({viewport,isMobile:viewport.width<600,hasTouch:viewport.width<600});await neutralize(ctx);const p=await ctx.newPage();p.setDefaultTimeout(16000);await p.goto(root+'?cert-v2-shell='+label+'-'+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.body?.dataset?.ready==='true');await p.evaluate(()=>document.querySelector('[data-v92-route="improve"]')?.click());await p.waitForFunction(()=>document.querySelector('#ch14CourseCard')?.parentElement?.id==='v92ImproveHome');const x=await p.evaluate(()=>{const cards=Array.from({length:14},(_,i)=>document.querySelector(`#ch${i+1}CourseCard`)),f=(a,b)=>!!(a&&b&&(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING));let total=0;for(let n=1;n<=14;n++){const r=window[`GomokuCourseChapter${n}`].report(),gs=r.lessons||r.sections||[];total+=n===1?gs.reduce((a,z)=>a+Number(z.total||0),0):Number(r.totalTasks??gs.reduce((a,z)=>a+Number(z.total||0),0))}const r5=window.GomokuCourseChapter5.report();return{counts:cards.map((_,i)=>document.querySelectorAll(`#ch${i+1}CourseCard`).length),parents:cards.map(c=>c?.parentElement?.id),order:cards.slice(0,-1).every((c,i)=>f(c,cards[i+1])),total,page:document.documentElement.scrollWidth,iw:innerWidth,r5}});if(x.counts.some(v=>v!==1)||x.parents.some(v=>v!=='v92ImproveHome')||!x.order||x.total!==655||x.page>x.iw+3||x.r5.title!=='Defense'||x.r5.lessons.some(v=>!v.title))throw new Error(label+' shell '+JSON.stringify(x));console.log(`V2_${label.toUpperCase()}_SHELL_PASS`);await ctx.close()}
          await shell({width:390,height:844},'mobile');await shell({width:1440,height:900},'desktop');
          async function make(tag){const ctx=await browser.newContext({viewport:{width:1100,height:850}});await neutralize(ctx);await ctx.addInitScript(()=>localStorage.removeItem('gomoku.course.chapter1.v1'));const p=await ctx.newPage();p.setDefaultTimeout(16000);await p.goto(root+'?cert-v2-ch1='+tag+'-'+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.body?.dataset?.ready==='true'&&window.GomokuCourseChapter1?.open);await p.evaluate(()=>window.GomokuCourseChapter1.open());await p.waitForSelector('#ch1CourseDialog[open]');return{ctx,p}}
          async function candidates(p){return p.locator('#ch1Board button:not([disabled])').evaluateAll(bs=>bs.map(b=>b.dataset.i))}
          async function next(p){const b=p.locator('#ch1NextTask');if(!await b.count()||!await b.isVisible())throw new Error('next hidden');await b.scrollIntoViewIfNeeded();const h=await p.evaluate(()=>{const b=document.querySelector('#ch1NextTask'),bd=document.querySelector('#ch1Board'),r=b.getBoundingClientRect(),br=bd.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,e=document.elementFromPoint(x,y);return{ok:e===b||b.contains(e),button:[r.left,r.top,r.right,r.bottom],board:[br.left,br.top,br.right,br.bottom],hit:e?.className||e?.id||e?.tagName,page:document.documentElement.scrollWidth,iw:innerWidth}});if(!h.ok||h.page>h.iw+3)throw new Error('Ch1 hit '+JSON.stringify(h));await b.click()}
          const A=await make('discover'),r0=await A.p.evaluate(()=>window.GomokuCourseChapter1.report()),T=total(r0);if(T!==39)throw new Error('T='+T);const answers=[];
          for(let li=0;li<r0.lessons.length;li++){if(li>0)await A.p.locator('#ch1Nav button').nth(li).click();const cnt=Number((await A.p.evaluate(()=>window.GomokuCourseChapter1.report())).lessons[li].total);for(let ti=0;ti<cnt;ti++){const before=done(await A.p.evaluate(()=>window.GomokuCourseChapter1.report())),cs=await candidates(A.p);let hit=null;for(const i of cs){const el=A.p.locator(`#ch1Board [data-i="${i}"]`);if(!await el.count()||await el.isDisabled())continue;await el.click();if(done(await A.p.evaluate(()=>window.GomokuCourseChapter1.report()))===before+1){hit=i;break}}if(hit==null)throw new Error(`unsolvable ${li}/${ti}`);answers.push(hit);await next(A.p)}}if(done(await A.p.evaluate(()=>window.GomokuCourseChapter1.report()))!==39)throw new Error('discover incomplete');console.log('V2_CH1_DISCOVERY_PASS');await A.ctx.close();
          const B=await make('replay');let k=0;for(let li=0;li<r0.lessons.length;li++){if(li>0)await B.p.locator('#ch1Nav button').nth(li).click();const cnt=Number((await B.p.evaluate(()=>window.GomokuCourseChapter1.report())).lessons[li].total);for(let ti=0;ti<cnt;ti++){const before=done(await B.p.evaluate(()=>window.GomokuCourseChapter1.report())),el=B.p.locator(`#ch1Board [data-i="${answers[k++]}"]`);await el.click();if(done(await B.p.evaluate(()=>window.GomokuCourseChapter1.report()))!==before+1)throw new Error(`replay ${li}/${ti}`);await next(B.p)}}const f=await B.p.evaluate(()=>window.GomokuCourseChapter1.report());if(!f.complete||f.firstTryRate!==1||done(f)!==39)throw new Error('Ch1 final '+JSON.stringify(f));console.log('V2_CH1_ALL_39_FIRST_TRY_PASS');await B.ctx.close();
          const C=await browser.newContext({viewport:{width:1100,height:850}});await neutralize(C);await C.addInitScript(()=>localStorage.removeItem('gomoku.course.chapter11.v1'));const p=await C.newPage();await p.goto(root+'?cert-v2-targeted='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.body?.dataset?.ready==='true'&&window.GomokuCourseChapter11?.openSection);const m=await p.evaluate(()=>({r5:window.GomokuCourseChapter5.report(),c5:document.querySelector('#ch5CourseCard')?.innerText||'',c11:document.querySelector('#ch11CourseCard')?.innerText||''}));if(!/Renju-variant preview/i.test(m.c5)||!/15×15/.test(m.c11)||!/Swap2/.test(m.c11)||m.r5.lessons.some(x=>!x.title))throw new Error('framing '+JSON.stringify(m));await p.evaluate(()=>window.GomokuCourseChapter11.openSection(7,6));await p.waitForSelector('#ch11CourseDialog[open]');await p.locator('#ch11CourseDialog[open]').getByRole('button',{name:'A 15×15 board with the Swap2 opening procedure',exact:true}).click();const rec=await p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter11.v1')).tasks.o43);if(!rec?.correct||!rec.firstTry||rec.assisted)throw new Error('o43 '+JSON.stringify(rec));console.log('V2_TEACHING_FRAMING_PASS');await C.close();await browser.close();console.log('WHOLE_GOMOKU_COURSE_AUDIT_CERTIFIED');
          JS
          node --check .cert-v2.mjs
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          timeout 540s env CHROME="$CHROME" node .cert-v2.mjs
      - name: Remove certification workflow
        if: always()
        shell: bash
        run: |
          rm -f .cert-v2.mjs;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git rm .github/workflows/final-certify-course-audit-v2.yml;git commit -m 'Remove final course audit certification v2' || true;git pull --rebase || true;git push || true
