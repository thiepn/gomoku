name: Install Analysis 2.0
on:
  push:
    branches: ['analysis/engine-training-2']
    paths: ['.analysis-install/**', '.github/workflows/install-analysis2.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify and unpack source against the Renju-fixed baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma
          parts=sorted(Path('.analysis-install').glob('*.part'))
          assert len(parts)==8
          data=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=='4517a07f9197711c53074bb2f65e550a7c5cf0064f2aa0d3d0a2ad29c618d0b9', 'Transport integrity failure'
          assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest()=='4dee0885dab00731b444bf9a51cef84c7ee9df4a32b4834dd3ae3b53a4dec585', 'Baseline changed: inspect before building'
          files=json.loads(lzma.decompress(data))
          allowed={'analysis/README.md','analysis/analysis.css','analysis/baseline-integrity.json','analysis/benchmark.cjs','analysis/build.py','analysis/core.js','analysis/runtime.js','analysis/test-browser.py','analysis/test-core.cjs','analysis/test-integrity.py','analysis/test-proof-coverage.cjs','analysis/training.js','review/review.js','review/review.css','review/build.py','review/test-recovery.py','review/README.md','ui/build.py','ui/preserved-scripts.json'}
          assert set(files)==allowed
          for name,text in files.items():
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text,encoding='utf-8')
          print('Verified and unpacked',len(files),'source files')
          PY
      - name: Build and verify rules, proofs, and original gameplay
        run: |
          python review/build.py
          python ui/build.py
          python analysis/build.py
          python ui/test-integrity.py
          python analysis/test-integrity.py
          node --check review/review.js
          node --check analysis/core.js
          node --check analysis/runtime.js
          node --check analysis/training.js
          node review/test-core.cjs
          node analysis/test-core.cjs
          node analysis/test-proof-coverage.cjs
          node analysis/benchmark.cjs
          sha256sum index.html sw.js
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser regressions and native IndexedDB persistence
        env:
          CHROMIUM_PATH: playwright
          UI_URL: http://127.0.0.1:8765/
          REVIEW_URL: http://127.0.0.1:8765/
          ANALYSIS_URL: http://127.0.0.1:8765/
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/analysis-http.log 2>&1 &
          python review/test-browser.py
          python review/test-recovery.py
          python ui/test-ui.py
          python analysis/test-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis2-install-evidence
          path: |
            analysis-test-output/
            review-test-output/
            ui-test-output/
          retention-days: 14
      - name: Commit tested source to the isolated branch
        run: |
          test "$GITHUB_REF_NAME" = 'analysis/engine-training-2'
          rm -rf .analysis-install
          rm .github/workflows/install-analysis2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add analysis review ui index.html sw.js
          git commit -m 'Implement Analysis 2.0 with evidence-preserving search, verified threats and personal mistake training'
          git push origin HEAD:analysis/engine-training-2
