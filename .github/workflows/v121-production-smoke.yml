name: V12.1 production smoke

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke:
    if: github.event.head_commit.message == 'Run v12.1 production smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Test live v12.1 release
        run: |
          cat > .v121-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const root='https://thiepn.dev/gomoku/';
          const stamp=Date.now();
          const source=await (await fetch(root+'?releasecheck='+stamp,{cache:'no-store'})).text();
          const must=['12.1.0','private-room-ui-v121','Create or join an invite-only game.','ROOM_API_BASE','roomMatchHud','roomChatSheet'];
          for(const x of must)if(!source.includes(x))throw new Error('Missing live release marker: '+x);
          const stale=['12.0.1','networkOpeningMove','renderNetworkOpening','id="networkOpening"','Use your configured server.','PWA_SW_START','PWA_SW_END','private-room-realtime-style','multiplayer-ux-polish-v12'];
          for(const x of stale)if(source.includes(x))throw new Error('Stale live source marker: '+x);
          const registrations=(source.match(/navigator\.serviceWorker\.register\('\.\/sw\.js'/g)||[]).length;
          if(registrations!==1)throw new Error('Expected one service-worker registration, got '+registrations);
          const apiKey=source.match(/ROOM_API_KEY='([^']+)'/)?.[1];
          if(!apiKey)throw new Error('ROOM_API_KEY missing from live source');
          console.log('PASS live source is consolidated v12.1.0 with one SW registration');

          const swRes=await fetch(root+'sw.js?releasecheck='+stamp,{cache:'no-store'}),sw=await swRes.text();
          if(!swRes.ok)throw new Error('sw.js HTTP '+swRes.status);
          for(const x of ["gomoku-v12.1.0","event.data?.type === 'SKIP_WAITING'","self.skipWaiting()"]){if(!sw.includes(x))throw new Error('SW missing '+x)}
          if(sw.includes('.then(() => self.skipWaiting())'))throw new Error('SW still forces skipWaiting during install');
          console.log('PASS service-worker cache/update lifecycle is v12.1-aware');

          const manifestRes=await fetch(root+'manifest.webmanifest?releasecheck='+stamp,{cache:'no-store'}),manifest=await manifestRes.json();
          if(!manifestRes.ok||manifest.display!=='standalone'||!Array.isArray(manifest.icons)||manifest.icons.length<3)throw new Error('Invalid live manifest');
          for(const path of ['icons/icon-192.png','icons/icon-512.png','icons/maskable-icon-512.png','icons/apple-touch-icon.png','icons/favicon-32.png']){
            const r=await fetch(root+path+'?releasecheck='+stamp,{cache:'no-store'});if(!r.ok)throw new Error(path+' HTTP '+r.status);
          }
          console.log('PASS manifest and PWA icons are live');

          const browser=await chromium.launch({headless:true});
          const contexts=[];
          async function makePage(){
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});contexts.push(ctx);const p=await ctx.newPage();
            await p.goto(root+'?qa='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000}).catch(()=>{});
            await p.waitForTimeout(500);
            const close=p.locator('button[aria-label*="Close" i]:visible');
            if(await close.count())await close.first().click();else{const use=p.getByText(/use the current board/i);if(await use.count()&&await use.first().isVisible())await use.first().click();}
            await p.waitForTimeout(180);
            return p;
          }
          async function openRoom(p){
            const direct=p.getByRole('button',{name:/private room/i});
            if(await direct.count()&&await direct.first().isVisible())await direct.first().click();
            else{const menu=p.getByRole('button',{name:/menu|more/i}).first();if(await menu.count()&&await menu.isVisible())await menu.click();await p.waitForTimeout(120);await p.getByRole('button',{name:/private room/i}).first().click();}
            await p.waitForTimeout(160);const d=p.locator('#workbenchDialog');if(!(await d.isVisible())||!/Private online room/i.test(await d.innerText()))throw new Error('Private-room setup did not open');return d;
          }
          const session=async p=>JSON.parse(await p.evaluate(()=>sessionStorage.getItem('gomoku.room.v4'))||'null');
          async function state(s){const r=await fetch(s.base+'/api/rooms/'+s.id,{headers:{apikey:apiKey,Authorization:'Bearer '+s.token}});return {status:r.status,data:await r.json()}}

          const H=await makePage();
          const geom=await H.evaluate(()=>({iw:innerWidth,sw:document.documentElement.scrollWidth,manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||null,version:document.documentElement.dataset.gomokuVersion}));
          if(geom.sw>geom.iw+2)throw new Error('390px viewport horizontal overflow '+geom.sw+' > '+geom.iw);
          if(!geom.manifest||geom.version!=='12.1.0')throw new Error('Live DOM PWA/version marker mismatch '+JSON.stringify(geom));
          console.log('PASS 390px mobile geometry and DOM release markers');

          // New profile: registration should install, become ready, then control after a reload.
          const pwa=await H.evaluate(async()=>{
            if(!('serviceWorker'in navigator))return {supported:false};
            const ready=await Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(new Error('service worker ready timeout')),12000))]);
            return {supported:true,scope:ready.scope,active:ready.active?.scriptURL||'',controller:!!navigator.serviceWorker.controller};
          });
          if(!pwa.supported||!pwa.scope.endsWith('/gomoku/')||!pwa.active.endsWith('/gomoku/sw.js'))throw new Error('PWA registration invalid '+JSON.stringify(pwa));
          await H.reload({waitUntil:'domcontentloaded'});await H.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000}).catch(()=>{});await H.waitForTimeout(450);
          const controlled=await H.evaluate(()=>({controller:!!navigator.serviceWorker.controller,url:navigator.serviceWorker.controller?.scriptURL||''}));
          if(!controlled.controller||!controlled.url.endsWith('/gomoku/sw.js'))throw new Error('PWA not controlling after reload '+JSON.stringify(controlled));
          const close2=H.locator('button[aria-label*="Close" i]:visible');if(await close2.count())await close2.first().click();
          console.log('PASS service worker installs at /gomoku/ and controls after reload');

          let d=await openRoom(H);await H.locator('#roomNickname').fill('V121 QA Host');await d.getByRole('button',{name:/create room/i}).first().click();
          await H.waitForFunction(()=>!!sessionStorage.getItem('gomoku.room.v4'),{timeout:8000});await H.waitForTimeout(650);const hs=await session(H);if(!hs?.id)throw new Error('Host room not created');console.log('V121_QA_ROOM='+hs.id);
          if(await H.locator('#workbenchDialog').evaluate(e=>e.open))throw new Error('Create setup stayed open');if(!await H.locator('#roomWaitingPanel').isVisible())throw new Error('Waiting panel missing');
          console.log('PASS private-room create and waiting state');

          const G=await makePage();d=await openRoom(G);await G.locator('#roomNickname').fill('V121 QA Guest');await G.locator('#roomCode').fill(hs.id);await d.getByRole('button',{name:/join room/i}).first().click();
          await G.waitForFunction(id=>{try{return JSON.parse(sessionStorage.getItem('gomoku.room.v4'))?.id===id}catch{return false}},hs.id,{timeout:8000});await H.waitForTimeout(1300);
          if(await G.locator('#workbenchDialog').evaluate(e=>e.open))throw new Error('Join setup stayed open');if(await H.locator('#roomWaitingPanel').isVisible().catch(()=>false))throw new Error('Waiting panel stayed after join');
          await H.waitForFunction(()=>/online/i.test(document.querySelector('#roomMatchHud')?.innerText||''),{timeout:6000});
          console.log('PASS guest join and Realtime Presence');

          await H.locator('#roomHudChat').click();await H.locator('#roomChatInput').fill('v12.1 smoke');await H.locator('#roomChatForm').getByRole('button',{name:/send/i}).click();await G.waitForTimeout(1000);await G.locator('#roomHudChat').click();await G.waitForFunction(()=>document.querySelector('#roomChatSheet')?.innerText.includes('v12.1 smoke'),{timeout:5000});await G.locator('#roomChatClose').click();await H.locator('#roomChatClose').click();
          console.log('PASS room chat sync');

          await H.evaluate(()=>document.querySelectorAll('.board-point')[112]?.click());await H.waitForTimeout(100);await Promise.allSettled([H.locator('#placeBtn').click(),H.locator('#placeBtn').click()]);await H.waitForTimeout(950);
          const rs=await state(hs),moves=rs.data?.game?.moves||rs.data?.moves||[];if(rs.status!==200||!Array.isArray(moves)||moves.length!==1)throw new Error('Rapid confirm persisted '+moves.length+' moves');
          console.log('PASS server authority collapses rapid double-confirm to one move');

          const T=await makePage();d=await openRoom(T);await T.locator('#roomNickname').fill('V121 QA Third');await T.locator('#roomCode').fill(hs.id);await d.getByRole('button',{name:/join room/i}).first().click();await T.waitForTimeout(900);
          if(!await T.locator('#workbenchDialog').evaluate(e=>e.open))throw new Error('Full-room rejection closed setup');const inline=(await T.locator('#roomStatus').innerText()).trim();if(!/two players|full|already/i.test(inline))throw new Error('Full-room inline error unclear: '+inline);
          console.log('PASS third-player rejection remains inline: '+inline);

          for(const ctx of contexts)await ctx.close();await browser.close();
          console.log('V121_PRODUCTION_SMOKE_PASS');
          JS
          node .v121-smoke.mjs
      - name: Remove temporary smoke
        if: always()
        run: |
          rm -f .v121-smoke.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v121-production-smoke.yml
          git commit -m 'Remove v12.1 production smoke' || true
          git push || true
