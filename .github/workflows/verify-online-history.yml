name: Online match history verification
on:
  pull_request:
    paths: ['index.html','online/**','supabase/functions/gomoku-room/**','supabase/migrations/**','.github/workflows/verify-online-history.yml','operations/**','supabase/**','ui/**','analysis/**','review/**','.github/workflows/p16-release-control.yml','.github/workflows/p17-preview-promotion.yml','.github/workflows/p18-portability-recovery.yml']
  push:
    branches: [main]
    paths: ['index.html','online/**','supabase/functions/gomoku-room/**','supabase/migrations/**','.github/workflows/verify-online-history.yml','operations/**','supabase/**','ui/**','analysis/**','review/**','.github/workflows/p16-release-control.yml','.github/workflows/p17-preview-promotion.yml','.github/workflows/p18-portability-recovery.yml']
permissions:
  contents: read
concurrency:
  group: gomoku-online-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - name: Verify P5 persistence markers
        run: |
          grep -q "gomoku_matches" supabase/functions/gomoku-room/index.ts
          grep -q "makeCompletedMatch" supabase/functions/gomoku-room/index.ts
          grep -q "persistPendingMatch" supabase/functions/gomoku-room/index.ts
          grep -q "listHistory" supabase/functions/gomoku-room/index.ts
          grep -q "historyToken" supabase/functions/gomoku-room/index.ts
      - name: Verify history UI source and syntax
        run: node online/test-history-ui.mjs
      - name: Exercise live persistent history
        run: node online/test-history.mjs
