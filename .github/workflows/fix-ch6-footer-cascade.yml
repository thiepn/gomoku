name: Fix Chapter 6 footer cascade collision

on:
  push:
    paths: ['.github/workflows/fix-ch6-footer-cascade.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scope Chapter 6 footer styles
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if s.count('id="course-ch6-v1-script"') != 1: raise SystemExit('Chapter 6 marker missing or duplicated')
          reps=[
            ('.ch6-bottom{display:flex;gap:9px;align-items:center;justify-content:flex-end;padding:11px 16px;border-top:1px solid color-mix(in srgb,currentColor 13%,transparent)}',
             '#ch6CourseDialog .ch6-bottom{display:flex!important;visibility:visible!important;opacity:1;gap:9px;align-items:center;justify-content:flex-end;padding:11px 16px;border-top:1px solid color-mix(in srgb,currentColor 13%,transparent)}'),
            ('.ch6-bottom{flex:0 0 auto;padding:9px 10px;position:sticky;bottom:0;z-index:4;background:Canvas}',
             '#ch6CourseDialog .ch6-bottom{display:flex!important;visibility:visible!important;flex:0 0 auto;padding:9px 10px;position:sticky;bottom:0;z-index:4;background:Canvas}')
          ]
          for old,new in reps:
            n=s.count(old)
            if n!=1: raise SystemExit(f'Expected one CSS target, got {n}: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          out=p.read_text(encoding='utf-8')
          for _,new in reps:
            if out.count(new)!=1: raise SystemExit('Scoped footer rule missing after patch')
          for n in range(1,7):
            if out.count(f'id="course-ch{n}-v1-script"')!=1: raise SystemExit(f'Chapter {n} marker check failed')
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-ch6-footer-cascade.yml
          git commit -m 'Fix Chapter 6 footer cascade collision'
          git push
