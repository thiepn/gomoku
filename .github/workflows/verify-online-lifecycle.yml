name: Online room lifecycle verification
on:
  pull_request:
    paths: ['index.html','sw.js','online/**','supabase/**','.github/workflows/verify-online-lifecycle.yml','operations/**','ui/**','analysis/**','review/**','.github/workflows/p16-release-control.yml','.github/workflows/p17-preview-promotion.yml','.github/workflows/p18-portability-recovery.yml']
  push:
    branches: [main]
    paths: ['index.html','sw.js','online/**','supabase/**','.github/workflows/verify-online-lifecycle.yml','operations/**','ui/**','analysis/**','review/**','.github/workflows/p16-release-control.yml','.github/workflows/p17-preview-promotion.yml','.github/workflows/p18-portability-recovery.yml']
permissions:
  contents: read
concurrency:
  group: gomoku-online-lifecycle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - name: Verify versioned Edge Function markers
        run: |
          grep -q "PLAYER_STALE_TTL_MS=600000" supabase/functions/gomoku-room/index.ts
          grep -q "async function leavePlayer" supabase/functions/gomoku-room/index.ts
          grep -q "gomoku_room_player_presence" supabase/functions/gomoku-room/index.ts
          grep -q "seat=!occupied.has(1)?1:2" supabase/functions/gomoku-room/index.ts
      - name: Exercise live multiplayer lifecycle
        run: node online/test-lifecycle.mjs
