name: P25 product UX accessibility and final quality

on:
  pull_request:
    paths:
      - 'index.html'
      - 'ui/**'
      - 'review/**'
      - 'analysis/**'
      - 'training/**'
      - 'online/**'
      - 'audit/p25-*'
      - 'operations/P25-RUNBOOK.md'
      - 'online/test-p25-product-quality.mjs'
      - '.github/workflows/verify-p25-product-quality.yml'
  push:
    branches: [main]
    paths:
      - 'operations/p26-device-matrix.json' # rerun on final physical evidence SHA
      - 'index.html'
      - 'ui/**'
      - 'review/**'
      - 'analysis/**'
      - 'training/**'
      - 'online/**'
      - 'audit/p25-*'
      - 'operations/P25-RUNBOOK.md'
      - 'online/test-p25-product-quality.mjs'
      - '.github/workflows/verify-p25-product-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p25-product-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p25-contract:
    name: p25-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node online/test-p25-product-quality.mjs
      - run: node operations/p19-supply-chain-policy.mjs

  p25-product-quality:
    name: p25-product-quality
    needs: p25-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify generated client matches durable P25 sources
        run: |
          python ui/build.py
          python online/build-p8-client.py
          git diff --exit-code -- index.html
      - run: npm install --no-save playwright@1.62.0 @axe-core/playwright@4.13.0
      - run: npx playwright install --with-deps chromium
      - name: Audit local product journeys
        env:
          P25_URL: http://127.0.0.1:8765/
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/p25-http.log 2>&1 &
          node audit/p25-product-quality.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p25-product-quality-${{ github.sha }}
          path: p25-audit-output/
          retention-days: 14
          if-no-files-found: warn

  p25-deployed-quality:
    name: p25-deployed-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: p25-product-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify exact deployed P25 artifact
        run: |
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          expected=hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          for attempt in range(120):
              try:
                  req=urllib.request.Request('https://thiepn.dev/gomoku/index.html?p25='+expected+'&attempt='+str(attempt),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      actual=hashlib.sha256(response.read()).hexdigest()
                  if actual==expected:
                      print('EXACT_DEPLOYED_FILE index.html '+expected,flush=True)
                      break
              except Exception as error:
                  print(type(error).__name__,str(error)[:140],flush=True)
              time.sleep(5)
          else:
              raise SystemExit('Public index.html did not match this P25 commit')
          PY
      - run: npm install --no-save playwright@1.62.0 @axe-core/playwright@4.13.0
      - run: npx playwright install --with-deps chromium
      - name: Audit exact public product journeys
        env:
          P25_URL: https://thiepn.dev/gomoku/
        run: node audit/p25-product-quality.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p25-deployed-quality-${{ github.sha }}
          path: p25-audit-output/
          retention-days: 14
          if-no-files-found: warn
