name: v1.1 learning intelligence

on:
  pull_request:
    paths:
      - 'learning/**'
      - 'index.html'
      - 'sw.js'
      - 'client-cache-version.txt'
      - '.github/workflows/verify-v1.1-learning.yml'
  push:
    branches: [main]
    paths:
      - 'learning/**'
      - 'index.html'
      - 'sw.js'
      - 'client-cache-version.txt'
      - '.github/workflows/verify-v1.1-learning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify pure learning model
        run: node learning/test-core.mjs
      - name: Rebuild portable learning artifact
        run: python learning/build.py
      - name: Require committed generated artifact
        run: git diff --exit-code -- index.html sw.js
      - name: Verify v1.1 integration contract
        run: python learning/test-integration.py
      - name: Preserve approved product modules
        run: |
          python ui/test-integrity.py
          python analysis/test-integrity.py
          python review/ux/test-integrity.py
      - name: Preserve review and analysis behavior
        run: |
          node review/test-core.cjs
          node analysis/test-core.cjs
          node analysis/test-proof-coverage.cjs
      - name: Install browser acceptance runtime
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run full-app Learning Intelligence acceptance
        env:
          LEARNING_URL: http://127.0.0.1:8765/
          CHROMIUM_PATH: playwright
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/learning-http.log 2>&1 &
          python learning/test-browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v1.1-learning-intelligence
          path: learning-test-output/
          retention-days: 14
