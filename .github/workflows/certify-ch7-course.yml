name: Final certify Chapter 7 Shape and Positional Play

on:
  push:
    paths: ['.github/workflows/certify-ch7-course.yml']

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Confirm patched live source
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 75); do
            curl -fsSL "https://thiepn.dev/gomoku/?ch7final=$(date +%s%N)" -o /tmp/live.html || true
            if grep -q 'id="course-ch7-v1-script"' /tmp/live.html \
              && grep -q '#ch7CourseDialog .ch7-bottom{display:flex!important;visibility:visible!important' /tmp/live.html \
              && grep -q 'function mountChapter7()' /tmp/live.html \
              && grep -q 'function renderPositionalBoard()' /tmp/live.html; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          for n in 1 2 3 4 5 6 7; do
            test "$(grep -o "id=\"course-ch${n}-v1-script\"" /tmp/live.html | wc -l)" = 1
          done

      - name: Certify live Chapter 7
        shell: bash
        run: |
          cat > .ch7-cert.mjs <<'JS'
          import { chromium } from 'playwright-core';

          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;
          if(!chrome) throw new Error('Chrome missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});

          const make=async()=>{
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const p=await ctx.newPage();
            p.setDefaultTimeout(15000);
            p.setDefaultNavigationTimeout(20000);
            const errors=[];
            p.on('pageerror',e=>errors.push(e.message));
            await p.goto(root+'?ch7cert='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body?.dataset?.ready==='true' && typeof window.GomokuCourseChapter7?.openSection==='function',null,{timeout:20000});
            await p.addStyleTag({content:'#v112WelcomeDialog{display:none!important;pointer-events:none!important}'});
            await p.evaluate(()=>{
              document.querySelector('[data-v92-route="improve"]')?.click();
              document.querySelector('#v112WelcomeDialog')?.close?.();
            });
            await p.waitForTimeout(500);
            await p.waitForSelector('#ch7CourseCard',{state:'attached'});
            return {ctx,p,errors};
          };

          const assertCourseStack=async p=>{
            const stack=await p.evaluate(()=>{
              const cards=[1,2,3,4,5,6,7].map(n=>document.querySelector(`#ch${n}CourseCard`));
              const follows=(a,b)=>!!(a&&b&&(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING));
              return {
                counts:[1,2,3,4,5,6,7].map(n=>document.querySelectorAll(`#ch${n}CourseCard`).length),
                order:cards.every(Boolean)&&cards.slice(0,-1).every((c,i)=>follows(c,cards[i+1]))
              };
            });
            if(stack.counts.some(n=>n!==1)||!stack.order) throw new Error('Course stack '+JSON.stringify(stack));
          };

          const choose=(p,name)=>p.locator('#ch7CourseDialog[open]').getByRole('button',{name,exact:true}).click();
          const openSection=async(p,lesson,task)=>{
            await p.evaluate(([l,t])=>window.GomokuCourseChapter7.openSection(l,t),[lesson,task]);
            await p.waitForSelector('#ch7CourseDialog[open]');
          };
          const footerGeometry=async p=>p.evaluate(()=>{
            const footer=document.querySelector('#ch7CourseDialog .ch7-bottom');
            const reveal=document.querySelector('#ch7Reveal');
            const dialog=document.querySelector('#ch7CourseDialog');
            const fr=footer?.getBoundingClientRect();
            const rr=reveal?.getBoundingClientRect();
            const fs=footer?getComputedStyle(footer):null;
            return {
              viewport:[innerWidth,innerHeight],
              pageWidth:document.documentElement.scrollWidth,
              dialogWidth:dialog?.scrollWidth,
              footerDisplay:fs?.display,
              footerRect:fr?[fr.left,fr.top,fr.right,fr.bottom,fr.width,fr.height]:null,
              revealRect:rr?[rr.left,rr.top,rr.right,rr.bottom,rr.width,rr.height]:null,
              revealVisible:reveal?.checkVisibility?.(),
              revealDisabled:reveal?.disabled
            };
          });
          const assertFooterVisible=async(p,label)=>{
            const g=await footerGeometry(p);
            const [iw,ih]=g.viewport;
            const f=g.footerRect,r=g.revealRect;
            if(g.pageWidth>iw+2||g.dialogWidth>iw+2) throw new Error(label+' horizontal overflow '+JSON.stringify(g));
            if(g.footerDisplay==='none'||!f||f[4]<=1||f[5]<=1) throw new Error(label+' footer hidden '+JSON.stringify(g));
            if(!r||r[4]<=1||r[5]<=1||!g.revealVisible) throw new Error(label+' reveal hidden '+JSON.stringify(g));
            if(r[0]<-1||r[1]<-1||r[2]>iw+1||r[3]>ih+1) throw new Error(label+' reveal outside viewport '+JSON.stringify(g));
          };

          const A=await make();
          await assertCourseStack(A.p);
          let report=await A.p.evaluate(()=>window.GomokuCourseChapter7.report());
          if(report.totalTasks!==48||report.totalLessons!==8) throw new Error('Chapter 7 report '+JSON.stringify(report));
          await openSection(A.p,0,0);
          await assertFooterVisible(A.p,'initial');
          await choose(A.p,'It makes the longest-looking chain');
          if(!/Not this\./.test(await A.p.locator('#ch7Feedback').innerText())) throw new Error('First-miss coaching missing');
          if(!(await A.p.locator('#ch7Reveal').isDisabled())) throw new Error('Reveal enabled after one miss');
          await assertFooterVisible(A.p,'after first miss');
          await choose(A.p,'It is adjacent to the most friendly stones');
          if(await A.p.locator('#ch7Reveal').isDisabled()) throw new Error('Reveal unavailable after second miss');
          await A.p.locator('#ch7Reveal').click();
          const assisted=await A.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter7.v1')).tasks.s1);
          if(!assisted?.correct||!assisted.assisted||assisted.firstTry!==false) throw new Error('Assisted accounting '+JSON.stringify(assisted));
          console.log('PASS mobile shell + staged coaching + assisted accounting');
          await A.ctx.close();

          const B=await make();
          await assertCourseStack(B.p);
          await openSection(B.p,0,0);
          const cleanAnswers=[
            'It contributes to several realistic future lines while preserving space',
            'A stone that still participates in realistic extensions, threats, defense, or future forks',
            'Using several stones to do essentially the same job while leaving other directions undeveloped',
            'Yes — gaps can preserve flexible extensions and future tactical links',
            'Live extension points, number of useful directions, opponent interference, and future tactical potential'
          ];
          for(let i=0;i<cleanAnswers.length;i++){
            await choose(B.p,cleanAnswers[i]);
            if(!/^Completed\./.test(await B.p.locator('#ch7Feedback').innerText())) throw new Error('Clean answer failed '+cleanAnswers[i]);
            if(i<cleanAnswers.length-1) await B.p.locator('#ch7NextTask').click();
          }
          report=await B.p.evaluate(()=>window.GomokuCourseChapter7.report());
          if(!report.lessons[0].complete||report.lessons[0].rate!==1) throw new Error('Lesson 1 clean score '+JSON.stringify(report.lessons[0]));
          console.log('PASS clean first-try shape-principles lesson');

          await openSection(B.p,1,0);
          const candidateCount=await B.p.locator('#ch7Board [data-candidate="1"]').count();
          if(candidateCount!==3) throw new Error('Expected three positional candidates, saw '+candidateCount);
          await B.p.locator('#ch7Board [data-coord="E5"]').click();
          if(!/^Completed\./.test(await B.p.locator('#ch7Feedback').innerText())) throw new Error('Efficient-connection board failed');
          if(await B.p.locator('#ch7Board [data-coord="E5"] .black').count()!==1) throw new Error('E5 answer stone missing');
          const s6=await B.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter7.v1')).tasks.s6);
          if(!s6?.correct||!s6.firstTry||s6.assisted) throw new Error('Board score '+JSON.stringify(s6));
          console.log('PASS clean positional board decision');

          await openSection(B.p,3,0);
          await B.p.locator('#ch7Board [data-coord="E5"]').click();
          if(!/^Completed\./.test(await B.p.locator('#ch7Feedback').innerText())) throw new Error('Direction-multiplication board failed');
          await openSection(B.p,4,1);
          await B.p.locator('#ch7Board [data-coord="D4"]').click();
          if(!/^Completed\./.test(await B.p.locator('#ch7Feedback').innerText())) throw new Error('Overconcentration board failed');
          await openSection(B.p,5,3);
          await B.p.locator('#ch7Board [data-coord="D3"]').click();
          if(!/^Completed\./.test(await B.p.locator('#ch7Feedback').innerText())) throw new Error('Edge-to-center board failed');
          await openSection(B.p,6,5);
          await B.p.locator('#ch7Board [data-coord="E4"]').click();
          if(!/^Completed\./.test(await B.p.locator('#ch7Feedback').innerText())) throw new Error('Future-fork board failed');
          console.log('PASS direction, space, edge and future-fork boards');

          await openSection(B.p,7,0);
          if(!/1 \/ 12/.test(await B.p.locator('.ch7-task-count').innerText())) throw new Error('Checkpoint is not 12 positions');
          await choose(B.p,'The one participating in the greatest number of realistic live lines and future interactions');
          if(!/^Completed\./.test(await B.p.locator('#ch7Feedback').innerText())) throw new Error('Checkpoint principle failed');
          console.log('PASS 12-position checkpoint entry');

          await B.p.reload({waitUntil:'domcontentloaded'});
          await B.p.waitForFunction(()=>document.body?.dataset?.ready==='true' && typeof window.GomokuCourseChapter7?.report==='function',null,{timeout:20000});
          report=await B.p.evaluate(()=>window.GomokuCourseChapter7.report());
          if(!report.lessons[0].complete||report.lessons[1].completed<1||report.lessons[3].completed<1||report.lessons[6].completed<1) throw new Error('Progress persistence '+JSON.stringify(report));
          const persisted=await B.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter7.v1')).tasks);
          if(!persisted.s6?.correct||!persisted.s16?.correct||!persisted.s36?.correct) throw new Error('Task persistence failed');
          if(B.errors.some(x=>/ch7|chapter 7/i.test(x))) throw new Error('Chapter 7 page errors '+JSON.stringify(B.errors));
          await assertCourseStack(B.p);
          console.log('PASS persistence + no Chapter 7 page errors + unique course stack');
          await B.ctx.close();
          await browser.close();
          console.log('CHAPTER7_CERTIFIED');
          JS
          node --check .ch7-cert.mjs
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node .ch7-cert.mjs

      - name: Remove certification workflow
        if: always()
        shell: bash
        run: |
          rm -f .ch7-cert.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/certify-ch7-course.yml
          git commit -m 'Remove Chapter 7 certification' || true
          git push || true
