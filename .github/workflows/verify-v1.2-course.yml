name: v1.2 Course 2.0

on:
  pull_request:
    paths:
      - 'course2/**'
      - 'learning/**'
      - 'index.html'
      - 'sw.js'
      - 'client-cache-version.txt'
      - '.github/workflows/verify-v1.2-course.yml'
  push:
    branches: [main]
    paths:
      - 'course2/**'
      - 'index.html'
      - 'sw.js'
      - 'client-cache-version.txt'
      - '.github/workflows/verify-v1.2-course.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course-2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify Course 2.0 model
        run: node course2/test-core.mjs
      - name: Verify Learning Intelligence dependency
        run: node learning/test-core.mjs
      - name: Rebuild portable Course 2.0 artifact
        run: python course2/build.py
      - name: Require committed generated artifact
        run: git diff --exit-code -- index.html sw.js
      - name: Verify Course 2.0 integration
        run: python course2/test-integration.py
      - name: Preserve v1.1 integration
        run: python learning/test-integration.py
      - name: Preserve approved product modules
        run: |
          python ui/test-integrity.py
          python analysis/test-integrity.py
          python review/ux/test-integrity.py
      - name: Preserve review and analysis behavior
        run: |
          node review/test-core.cjs
          node analysis/test-core.cjs
          node analysis/test-proof-coverage.cjs
      - name: Install Course 2.0 browser runtime
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run Course 2.0 desktop and mobile acceptance
        env:
          COURSE2_URL: http://127.0.0.1:8766/
        run: |
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/course2-http.log 2>&1 &
          python course2/test-browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v1.2-course-2.0
          path: course2-test-output/
          retention-days: 14
