name: Diagnose Chapter 7 reload v2

on:
  push:
    paths: ['.github/workflows/diagnose-ch7-reload-v2.yml']

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            data=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" || true)
            state=$(printf '%s' "$data" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=j.workflow_runs?.find(x=>x.name==='pages build and deployment');process.stdout.write(r?.conclusion||r?.status||'missing')}catch{process.stdout.write('bad')}})")
            echo "Pages: $state"
            [ "$state" = success ] && exit 0
            { [ "$state" = failure ] || [ "$state" = cancelled ]; } && exit 1
            sleep 2
          done
          exit 1
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Diagnose reload state
        shell: bash
        run: |
          cat > .ch7-diag.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;
          if(!chrome) throw new Error('Chrome missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const p=await ctx.newPage();
          p.setDefaultTimeout(8000);
          const errors=[];
          const consoleErrors=[];
          p.on('pageerror',e=>errors.push(e.message));
          p.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
          const snapshot=()=>p.evaluate(()=>({
            ready:document.body?.dataset?.ready??null,
            api:typeof window.GomokuCourseChapter7?.report,
            loaded:window.__gomokuCourseChapter7Loaded??null,
            marker:!!document.getElementById('course-ch7-v1-script'),
            cards:[1,2,3,4,5,6,7].map(n=>document.querySelectorAll(`#ch${n}CourseCard`).length),
            apis:[1,2,3,4,5,6,7].map(n=>typeof window[`GomokuCourseChapter${n}`]),
            state:localStorage.getItem('gomoku.course.chapter7.v1'),
            href:location.href,
            title:document.title,
            controller:navigator.serviceWorker?.controller?.scriptURL||null,
            htmlLength:document.documentElement.outerHTML.length
          }));
          const close=async()=>{try{await ctx.close()}catch{};try{await browser.close()}catch{}};
          try{
            await p.goto(root+'?ch7diag2='+Date.now(),{waitUntil:'domcontentloaded',timeout:15000});
            await p.waitForTimeout(2500);
            const first=await snapshot();
            console.log('FIRST='+JSON.stringify(first));
            if(first.api!=='function'||!first.marker) throw new Error('INITIAL_UNAVAILABLE '+JSON.stringify(first));
            await p.evaluate(()=>localStorage.setItem('gomoku.course.chapter7.v1',JSON.stringify({version:1,tasks:{s6:{correct:true,firstTry:true,assisted:false}},last:{lesson:1,task:0}})));
            let reloadError=null;
            try{await p.reload({waitUntil:'domcontentloaded',timeout:15000})}catch(e){reloadError=e.message;console.log('RELOAD_ERROR='+e.message)}
            await p.waitForTimeout(3500);
            const second=await snapshot();
            console.log('SECOND='+JSON.stringify(second));
            console.log('PAGE_ERRORS='+JSON.stringify(errors));
            console.log('CONSOLE_ERRORS='+JSON.stringify(consoleErrors));
            const network=await p.evaluate(async()=>{
              try{
                const r=await fetch('./?networkprobe='+Date.now(),{cache:'no-store'});
                const t=await r.text();
                return {ok:r.ok,status:r.status,url:r.url,marker:t.includes('course-ch7-v1-script'),mount:t.includes('function mountChapter7()'),len:t.length};
              }catch(e){return {error:String(e)}}
            });
            console.log('NETWORK='+JSON.stringify(network));
            if(reloadError) throw new Error('RELOAD_NAVIGATION '+reloadError+' SECOND='+JSON.stringify(second)+' NETWORK='+JSON.stringify(network));
            if(second.api!=='function'||!second.marker||second.ready!=='true') throw new Error('RELOAD_STATE '+JSON.stringify(second)+' ERRORS='+JSON.stringify(errors)+' CONSOLE='+JSON.stringify(consoleErrors)+' NETWORK='+JSON.stringify(network));
            if(!JSON.parse(second.state||'null')?.tasks?.s6?.correct) throw new Error('STORED_PROGRESS_LOST '+JSON.stringify(second.state));
            if(second.cards.some(n=>n!==1)) throw new Error('COURSE_STACK '+JSON.stringify(second.cards));
            console.log('CHAPTER7_RELOAD_DIAGNOSTIC_PASS');
          } finally {
            await close();
          }
          JS
          node --check .ch7-diag.mjs
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          timeout 55s env CHROME="$CHROME" node .ch7-diag.mjs
      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          rm -f .ch7-diag.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-ch7-reload-v2.yml
          git commit -m 'Remove Chapter 7 reload diagnostic v2' || true
          git pull --rebase || true
          git push || true
