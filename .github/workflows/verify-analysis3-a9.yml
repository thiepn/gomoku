name: Analysis 3.0 A9 immutable candidate and offline package qualification

on:
  push:
    branches:
      - phase/a9-immutable-release-candidate
    paths:
      - 'analysis3/**'
      - 'review/**'
      - 'analysis/**'
      - 'client-cache-version.txt'
      - '.github/workflows/verify-analysis3-a9.yml'
      - 'index.html'
      - 'sw.js'

permissions:
  contents: read

jobs:
  integrated-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # immutable P19 allowlist SHA
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # immutable P19 allowlist SHA
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable P19 allowlist SHA
        with:
          python-version: '3.12'
      - name: Validate modular source syntax
        run: |
          node --check review/review.js
          node --check analysis3/workspace-core.js
          node --check analysis3/game-diagnosis.js
          node --check analysis3/practice-core.js
          node --check analysis3/runtime-policy.js
          node --check analysis/runtime.js
          node --check sw.js
          node --check analysis/training.js
          node --check analysis3/test-a3.cjs
          node --check analysis3/test-a4.cjs
          node --check analysis3/test-a5.cjs
          node --check analysis3/test-a6.cjs
          node --check analysis3/test-a6-sw.cjs
          node --check analysis3/release-gate.js
          node --check analysis3/a7-report.cjs
          node --check analysis3/test-a7.cjs
          node --check analysis3/test-a8.cjs
          node --check analysis3/practice-integrity.js
          node --check analysis3/rc9-core.cjs
          node --check analysis3/rc9.cjs
          node --check analysis3/test-a9.cjs
          python -m py_compile analysis3/rc9-package.py analysis3/test-a9-package-browser.py
          python -m py_compile review/build.py analysis/build.py analysis3/test-a3-browser.py analysis3/test-a4-browser.py analysis3/test-a5-browser.py analysis3/test-a6-browser.py analysis3/test-a7-browser.py analysis3/test-a8-browser.py review/ux/test-integrity.py
      - name: Rebuild portable review and verify source boundaries
        run: |
          python review/build.py
          python ui/build.py
          python analysis/build.py
          python review/ux/test-integrity.py
          python analysis/test-integrity.py
          python ui/test-integrity.py
          git diff --exit-code -- index.html sw.js manifest.webmanifest
      - name: Create immutable A9 source snapshot
        run: |
          node analysis3/rc9.cjs init
          node analysis3/rc9.cjs mark sources
      - name: Run tactical and visual-model regressions
        run: |
          node analysis3/test-evidence.cjs
          node analysis3/test-a1.cjs
          node analysis3/test-a2.cjs
          node analysis3/test-a3.cjs
          node analysis3/test-a4.cjs
          node analysis3/test-a5.cjs
          node analysis3/test-a6.cjs
          node analysis3/test-a6-sw.cjs
          node analysis3/test-a7.cjs
          node analysis3/test-a8.cjs
          node analysis3/test-a9.cjs
          node review/test-core.cjs
          node analysis/test-core.cjs
          node analysis/test-forcing-defense.cjs
          node analysis/test-proof-coverage.cjs
      - name: Attest native and model regression evidence
        run: node analysis3/rc9.cjs mark tactical
      - name: Benchmark known tactical failures with the real native engine
        run: |
          mkdir -p analysis-test-output
          node analysis3/benchmark.cjs
      - name: Attest native tactical benchmark execution
        run: node analysis3/rc9.cjs mark benchmark
      - name: Check repeatable offline embedding and guarded changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          files=[Path('index.html'),Path('sw.js')]
          hashes={str(f):hashlib.sha256(f.read_bytes()).hexdigest() for f in files}
          for task in ('review/build.py','ui/build.py','analysis/build.py'):
              subprocess.run(['python',task],check=True)
          expected={str(f):hashlib.sha256(f.read_bytes()).hexdigest() for f in files}
          assert hashes==expected,(hashes,expected)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed<={'index.html','sw.js'},changed
          assert not changed,'A9 must use already-committed artifact bytes: '+str(changed)
          print('PASS frozen deterministic offline shell')
          PY
      - name: Attest deterministic unchanged PWA artifacts
        run: node analysis3/rc9.cjs mark reproducibility
      - name: Run original A7 fail-closed release policy and rollback dry run
        run: |
          node analysis3/test-a7.cjs
          node analysis3/a7-report.cjs rollback-test
      - name: Install browser acceptance environment
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check real browser interactions, screenshots, and regression flows
        env:
          CHROMIUM_PATH: playwright
          A3_URL: http://127.0.0.1:8765/
          A4_URL: http://127.0.0.1:8765/
          A5_URL: http://127.0.0.1:8765/
          A6_URL: http://127.0.0.1:8765/
          A7_URL: http://127.0.0.1:8765/
          A8_URL: http://127.0.0.1:8765/
          ANALYSIS_URL: http://127.0.0.1:8765/
          WORKSPACE_URL: http://127.0.0.1:8765/
          REVIEW_URL: http://127.0.0.1:8765/
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/a3-http.log 2>&1 &
          python analysis3/test-a3-browser.py
          python analysis3/test-a4-browser.py
          python analysis3/test-a5-browser.py
          python analysis3/test-a6-browser.py
          python analysis3/test-a7-browser.py
          python analysis3/test-a8-browser.py
          python analysis/test-browser.py
          python review/ux/test-workspace.py
          python review/test-browser.py
          python review/test-recovery.py
      - name: Attest full browser regressions and real offline SW check
        run: |
          node analysis3/rc9.cjs mark browser
          node analysis3/rc9.cjs mark offline
      - name: Package the exact tested offline app
        run: |
          python analysis3/rc9-package.py create
          python analysis3/rc9-package.py verify
          python analysis3/test-a9-package-browser.py
      - name: Attest verified extracted PWA package
        run: node analysis3/rc9.cjs mark package
      - name: Produce candidate report with explicit physical and owner holds
        run: node analysis3/rc9.cjs finalize
      - name: Publish QA evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis3-a9-immutable-candidate-evidence
          path: |
            analysis3-test-output/
            analysis4-test-output/
            analysis5-test-output/
            analysis6-test-output/
            analysis7-test-output/
            analysis8-test-output/
            analysis9-test-output/
            workspace-test-output/
            review-test-output/
            analysis-test-output/
            index.html
            sw.js
          retention-days: 14
