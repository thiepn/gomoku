name: PWA Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PWA assets and patch app shell
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          root = Path('.')
          icons = root / 'icons'
          icons.mkdir(exist_ok=True)

          source = Image.open(icons / 'icon-source.jpg').convert('RGB')
          resampling = Image.Resampling.LANCZOS

          def save_icon(size, filename):
              source.resize((size, size), resampling).save(
                  icons / filename,
                  'PNG',
                  optimize=True,
              )

          save_icon(32, 'favicon-32.png')
          save_icon(180, 'apple-touch-icon.png')
          save_icon(192, 'icon-192.png')
          save_icon(512, 'icon-512.png')

          # Maskable variant: preserve the full approved icon inside Android's safe zone.
          canvas = Image.new('RGB', (512, 512), '#1f1714')
          safe = source.resize((410, 410), resampling)
          canvas.paste(safe, ((512 - 410) // 2, (512 - 410) // 2))
          canvas.save(icons / 'maskable-icon-512.png', 'PNG', optimize=True)

          manifest = {
              'name': 'Gomoku',
              'short_name': 'Gomoku',
              'description': 'A clean Gomoku (five-in-a-row) game.',
              'id': './',
              'start_url': './',
              'scope': './',
              'display': 'standalone',
              'orientation': 'any',
              'background_color': '#1f1714',
              'theme_color': '#1f1714',
              'lang': 'en',
              'categories': ['games', 'entertainment'],
              'icons': [
                  {
                      'src': './icons/icon-192.png',
                      'sizes': '192x192',
                      'type': 'image/png',
                      'purpose': 'any'
                  },
                  {
                      'src': './icons/icon-512.png',
                      'sizes': '512x512',
                      'type': 'image/png',
                      'purpose': 'any'
                  },
                  {
                      'src': './icons/maskable-icon-512.png',
                      'sizes': '512x512',
                      'type': 'image/png',
                      'purpose': 'maskable'
                  }
              ],
              'prefer_related_applications': False
          }
          (root / 'manifest.webmanifest').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )

          sw = r'''const CACHE_NAME = 'gomoku-v1';
          const APP_SHELL = [
            './',
            './index.html',
            './manifest.webmanifest',
            './icons/icon-192.png',
            './icons/icon-512.png',
            './icons/maskable-icon-512.png',
            './icons/apple-touch-icon.png',
            './icons/favicon-32.png'
          ];

          self.addEventListener('install', (event) => {
            event.waitUntil(
              caches.open(CACHE_NAME)
                .then((cache) => cache.addAll(APP_SHELL))
                .then(() => self.skipWaiting())
            );
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil(
              caches.keys()
                .then((keys) => Promise.all(
                  keys
                    .filter((key) => key.startsWith('gomoku-') && key !== CACHE_NAME)
                    .map((key) => caches.delete(key))
                ))
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', (event) => {
            const request = event.request;
            if (request.method !== 'GET') return;

            const url = new URL(request.url);
            if (url.origin !== self.location.origin) return;

            if (request.mode === 'navigate') {
              event.respondWith(
                fetch(request)
                  .then((response) => {
                    if (response && response.ok) {
                      const copy = response.clone();
                      caches.open(CACHE_NAME).then((cache) => cache.put('./index.html', copy));
                    }
                    return response;
                  })
                  .catch(() => caches.match('./index.html'))
              );
              return;
            }

            event.respondWith(
              caches.match(request).then((cached) => {
                const network = fetch(request)
                  .then((response) => {
                    if (response && response.ok) {
                      caches.open(CACHE_NAME).then((cache) => cache.put(request, response.clone()));
                    }
                    return response;
                  })
                  .catch(() => cached);
                return cached || network;
              })
            );
          });
          '''
          # Dedent the workflow's YAML indentation from the JS block.
          import textwrap
          (root / 'sw.js').write_text(textwrap.dedent(sw).lstrip(), encoding='utf-8')

          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')

          head_block = '''
          <!-- PWA_META_START -->
          <meta name="theme-color" content="#1f1714">
          <meta name="application-name" content="Gomoku">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="Gomoku">
          <link rel="manifest" href="./manifest.webmanifest">
          <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
          <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
          <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
          <!-- PWA_META_END -->
          '''
          head_block = textwrap.dedent(head_block).strip()

          sw_block = '''
          <!-- PWA_SW_START -->
          <script>
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('./sw.js').catch((error) => {
                console.error('Service worker registration failed:', error);
              });
            });
          }
          </script>
          <!-- PWA_SW_END -->
          '''
          sw_block = textwrap.dedent(sw_block).strip()

          if '<!-- PWA_META_START -->' not in html:
              if '</head>' not in html:
                  raise RuntimeError('Cannot patch PWA metadata: </head> not found')
              html = html.replace('</head>', head_block + '\n</head>', 1)

          if '<!-- PWA_SW_START -->' not in html:
              if '</body>' not in html:
                  raise RuntimeError('Cannot patch service worker: </body> not found')
              html = html.replace('</body>', sw_block + '\n</body>', 1)

          index.write_text(html, encoding='utf-8')
          PY

      - name: Validate generated PWA files
        shell: bash
        run: |
          test -s manifest.webmanifest
          test -s sw.js
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          test -s icons/maskable-icon-512.png
          test -s icons/apple-touch-icon.png
          test -s icons/favicon-32.png
          grep -q 'PWA_META_START' index.html
          grep -q 'PWA_SW_START' index.html
          python -m json.tool manifest.webmanifest >/dev/null

      - name: Commit PWA upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js icons/
          if git diff --cached --quiet; then
            echo 'No PWA changes required.'
            exit 0
          fi
          git commit -m 'feat: add installable PWA and app icons'
          git push origin HEAD:main
