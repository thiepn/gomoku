name: Verify P13 reliability and competitive recovery

on:
  push:
    branches: [main]
    paths:
      - 'online/p8-competition.js'
      - 'online/p8-competition.css'
      - 'online/build-p8-client.py'
      - 'online/test-p13-reliability.mjs'
      - 'supabase/functions/gomoku-room/**'
      - 'supabase/migrations/*gomoku_p8*.sql'
      - 'supabase/migrations/*gomoku_p9*.sql'
      - 'supabase/migrations/*gomoku_p10*.sql'
      - 'supabase/migrations/*gomoku_p11*.sql'
      - 'supabase/migrations/*gomoku_p12*.sql'
      - 'supabase/migrations/*gomoku_p13*.sql'
      - 'ui/build.py'
      - 'analysis/build.py'
      - 'review/build.py'
      - '.github/workflows/verify-p8-competition.yml'
      - 'online/**'
      - 'operations/**'
      - 'supabase/**'
      - 'ui/**'
      - 'analysis/**'
      - 'review/**'
      - '.github/workflows/p16-release-control.yml'
      - '.github/workflows/p17-preview-promotion.yml'
      - '.github/workflows/p18-portability-recovery.yml'
  pull_request:
    paths:
      - 'online/p8-competition.js'
      - 'online/p8-competition.css'
      - 'online/build-p8-client.py'
      - 'online/test-p13-reliability.mjs'
      - 'supabase/functions/gomoku-room/**'
      - 'supabase/migrations/*gomoku_p8*.sql'
      - 'supabase/migrations/*gomoku_p9*.sql'
      - 'supabase/migrations/*gomoku_p10*.sql'
      - 'supabase/migrations/*gomoku_p11*.sql'
      - 'supabase/migrations/*gomoku_p12*.sql'
      - 'supabase/migrations/*gomoku_p13*.sql'
      - 'ui/build.py'
      - 'analysis/build.py'
      - 'review/build.py'
      - '.github/workflows/verify-p8-competition.yml'

      - 'online/**'
      - 'operations/**'
      - 'supabase/**'
      - 'ui/**'
      - 'analysis/**'
      - 'review/**'
      - '.github/workflows/p16-release-control.yml'
      - '.github/workflows/p17-preview-promotion.yml'
      - '.github/workflows/p18-portability-recovery.yml'
permissions:
  contents: write

jobs:
  p13:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild shared presentation
        run: |
          python ui/build.py
          python online/build-p8-client.py
      - name: Validate P13 source syntax
        run: |
          node --check online/p8-competition.js
          python -m py_compile online/build-p8-client.py
      - name: Verify P13 source and generated contracts
        run: node online/test-p13-reliability.mjs
      - name: Ensure P13 builder is idempotent
        run: |
          cp index.html /tmp/p13-index.html
          cp sw.js /tmp/p13-sw.js
          python online/build-p8-client.py
          cmp index.html /tmp/p13-index.html
          cmp sw.js /tmp/p13-sw.js
      - name: Commit generated competitive app shell
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # A manual rerun can execute against an older push after main has moved.
          # Never let a stale checkout generate a non-fast-forward bot push.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced after this workflow started; skipping stale generated-shell push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js review/build.py manifest.webmanifest
          if ! git diff --cached --quiet; then
            git commit -m "Generate competitive app shell"
            git push origin HEAD:main
          fi
