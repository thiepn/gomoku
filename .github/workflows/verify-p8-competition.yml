name: Verify P11 competitive social layer

on:
  push:
    branches: [main]
    paths:
      - 'online/p8-competition.js'
      - 'online/p8-competition.css'
      - 'online/build-p8-client.py'
      - 'online/test-p11-social.mjs'
      - 'supabase/functions/gomoku-room/**'
      - 'supabase/migrations/*gomoku_p8*.sql'
      - 'supabase/migrations/*gomoku_p9*.sql'
      - 'supabase/migrations/*gomoku_p10*.sql'
      - 'supabase/migrations/*gomoku_p11*.sql'
      - 'ui/build.py'
      - 'analysis/build.py'
      - 'review/build.py'
      - '.github/workflows/verify-p8-competition.yml'
  pull_request:
    paths:
      - 'online/p8-competition.js'
      - 'online/p8-competition.css'
      - 'online/build-p8-client.py'
      - 'online/test-p11-social.mjs'
      - 'supabase/functions/gomoku-room/**'
      - 'supabase/migrations/*gomoku_p8*.sql'
      - 'supabase/migrations/*gomoku_p9*.sql'
      - 'supabase/migrations/*gomoku_p10*.sql'
      - 'supabase/migrations/*gomoku_p11*.sql'
      - 'ui/build.py'
      - 'analysis/build.py'
      - 'review/build.py'
      - '.github/workflows/verify-p8-competition.yml'

permissions:
  contents: write

jobs:
  p11:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild shared presentation
        run: |
          python ui/build.py
          python online/build-p8-client.py
      - name: Validate P11 source syntax
        run: |
          node --check online/p8-competition.js
          python -m py_compile online/build-p8-client.py
      - name: Verify P11 source and live public contracts
        run: node online/test-p11-social.mjs
      - name: Ensure P11 builder is idempotent
        run: |
          cp index.html /tmp/p11-index.html
          cp sw.js /tmp/p11-sw.js
          python online/build-p8-client.py
          cmp index.html /tmp/p11-index.html
          cmp sw.js /tmp/p11-sw.js
      - name: Commit generated P11 app shell
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js review/build.py manifest.webmanifest
          if ! git diff --cached --quiet; then
            git commit -m "P11: generate social rivalry bundle"
            git push
          fi
