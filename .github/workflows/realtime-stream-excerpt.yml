name: Capture room stream functions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message == 'Capture room stream functions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          i=s.find('function ensureRoomStream')
          if i<0: raise SystemExit('ensureRoomStream not found')
          Path('.github/room-stream-excerpt.txt').write_text(s[max(0,i-1200):i+6500])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/room-stream-excerpt.txt
          git commit -m 'Capture room stream functions' || exit 0
          git push
