name: Inspect mobile Gomoku UI

on:
  push:
    branches: [main]

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect mobile Gomoku UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect final mobile layers
        run: |
          echo '=== V9.2 LAYOUT ==='
          sed -n '4680,4775p' index.html
          echo '=== V9.2 PLAY ROUTE / MENU ==='
          sed -n '4865,4965p' index.html
          echo '=== V9.3 MOBILE COLLAPSE ==='
          sed -n '5045,5130p' index.html
          echo '=== V10 SETTINGS ==='
          sed -n '5320,5410p' index.html
          echo '=== V11 MOBILE MENU ==='
          sed -n '5600,5650p' index.html
