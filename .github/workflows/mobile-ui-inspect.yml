name: Inspect mobile Gomoku UI

on:
  push:
    branches: [main]

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect mobile Gomoku UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect game bar and mobile board state
        run: |
          echo '=== GAME BAR CREATION ==='
          sed -n '4790,4868p' index.html
          echo '=== BOARD CLICK LOGIC ==='
          sed -n '2668,2705p' index.html
          echo '=== RENDER PLACEMENT ==='
          sed -n '2508,2548p' index.html
          echo '=== MOBILE BOARD CSS LATE ==='
          sed -n '4920,4960p' index.html
          sed -n '5130,5160p' index.html
