name: Inspect mobile Gomoku UI

on:
  push:
    branches: [main]

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect mobile Gomoku UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current menu and private room routing
        run: |
          echo '=== V111 MENU SCRIPT ==='
          sed -n '5635,5705p' index.html
          echo '=== ONLINE REFERENCES LATE ==='
          grep -n "onlineBtn\|openOnline\|openPlatform\|Private room\|Private online" index.html | tail -n 60
