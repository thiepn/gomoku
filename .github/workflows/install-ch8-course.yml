name: Install Chapter 8 Initiative and Move Priority course

on:
  push:
    paths:
      - '.github/workflows/install-ch8-course.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Chapter 8 module
        shell: python
        run: |
          from pathlib import Path
          import base64, bz2, hashlib
          encoded = ''.join(Path(f'.ch8-payload-{i}.b64').read_text(encoding='utf-8').strip() for i in (1,2,3))
          data = bz2.decompress(base64.b64decode(encoded))
          expected = '889ad1ecede4a478fd7b939ee6ef01b4b6bd80066903b44738bd181b9d81b892'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'Chapter 8 payload hash mismatch: {actual}')
          text = data.decode('utf-8')
          required = [
              'id="course-ch8-v1-script"',
              'function mountChapter8()',
              'function renderPriorityBoard(',
              'window.GomokuCourseChapter8',
              'gomoku.course.chapter8.v1',
              'attributeFilter:["data-ready"]',
              'Initiative and Move Priority',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Chapter 8 module missing markers: {missing}')
          Path('/tmp/ch8-module.html').write_bytes(data)

      - name: Install Chapter 8 into app
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          module = Path('/tmp/ch8-module.html').read_text(encoding='utf-8')
          for n in range(1, 8):
              marker = f'id="course-ch{n}-v1-script"'
              if s.count(marker) != 1:
                  raise SystemExit(f'Baseline course marker check failed for Chapter {n}')
          count = s.count('id="course-ch8-v1-script"')
          if count > 1:
              raise SystemExit('Chapter 8 marker duplicated before install')
          if count == 0:
              idx = s.rfind('</body>')
              if idx < 0:
                  raise SystemExit('Closing body tag not found')
              s = s[:idx] + '\n' + module + '\n' + s[idx:]
              p.write_text(s, encoding='utf-8')
          final = p.read_text(encoding='utf-8')
          for n in range(1, 9):
              marker = f'id="course-ch{n}-v1-script"'
              if final.count(marker) != 1:
                  raise SystemExit(f'Installed course marker check failed for Chapter {n}')
          if 'function mountChapter8()' not in final or 'gomoku.course.chapter8.v1' not in final:
              raise SystemExit('Chapter 8 installed source missing required API/storage markers')

      - name: Commit installed course and clean installer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .ch8-payload-1.b64 .ch8-payload-2.b64 .ch8-payload-3.b64 .github/workflows/install-ch8-course.yml
          git commit -m 'Implement Chapter 8 Initiative and Move Priority course'
          git push
