name: Certify Chapter 4 Forks course

on:
  push:
    paths:
      - '.github/workflows/certify-ch4-course.yml'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Confirm production source
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 45); do
            curl -fsSL "https://thiepn.dev/gomoku/?ch4ready=$(date +%s%N)" -o /tmp/live.html || true
            if grep -q 'course-ch4-v1-script' /tmp/live.html && grep -q 'gomoku.course.chapter4.v1' /tmp/live.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          for n in 1 2 3 4; do
            test "$(grep -o "id=\"course-ch${n}-v1-script\"" /tmp/live.html | wc -l)" = 1
          done
      - name: Certify live Chapter 4
        shell: bash
        run: |
          cat > .ch4-cert.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;if(!chrome)throw new Error('Chrome missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const make=async()=>{
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const p=await ctx.newPage();p.setDefaultTimeout(7000);p.setDefaultNavigationTimeout(15000);
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto(root+'?ch4qa='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000});await p.waitForTimeout(900);
            const close=p.locator('button[aria-label*="Close" i]:visible');if(await close.count())await close.first().click();
            return{ctx,p,errors};
          };
          const toLearn=async p=>{
            const l=p.getByRole('button',{name:/^learn$/i});
            if(await l.count())await l.first().click();else await p.locator('[data-v92-route="improve"]').first().click();
            await p.waitForTimeout(650);
            const counts=await p.evaluate(()=>{
              const a=document.querySelector('#ch1CourseCard'),b=document.querySelector('#ch2CourseCard'),c=document.querySelector('#ch3CourseCard'),d=document.querySelector('#ch4CourseCard');
              const follows=(x,y)=>!!(x&&y&&(x.compareDocumentPosition(y)&Node.DOCUMENT_POSITION_FOLLOWING));
              return{ch1:document.querySelectorAll('#ch1CourseCard').length,ch2:document.querySelectorAll('#ch2CourseCard').length,ch3:document.querySelectorAll('#ch3CourseCard').length,ch4:document.querySelectorAll('#ch4CourseCard').length,order:follows(a,b)&&follows(b,c)&&follows(c,d)};
            });
            if(counts.ch1!==1||counts.ch2!==1||counts.ch3!==1||counts.ch4!==1||!counts.order)throw new Error('Course stack '+JSON.stringify(counts));
          };
          const choice=async(p,name)=>p.locator('#ch4CourseDialog[open]').getByRole('button',{name,exact:true}).click();

          const A=await make();await toLearn(A.p);
          const api=await A.p.evaluate(()=>({open:typeof window.GomokuCourseChapter4?.open,section:typeof window.GomokuCourseChapter4?.openSection,report:window.GomokuCourseChapter4?.report?.()}));
          if(api.open!=='function'||api.section!=='function'||api.report?.totalTasks!==46||api.report?.totalLessons!==8)throw new Error('Chapter 4 API/report '+JSON.stringify(api));
          for(const n of [1,2,3]){
            await A.p.locator(`#ch${n}Start`).click();
            await A.p.waitForSelector(`#ch${n}CourseDialog[open] #ch${n}Board`,{state:'visible'});
            await A.p.locator(`#ch${n}CourseDialog[open] #ch${n}Close`).click();
          }
          console.log('PASS Chapters 1–3 regression + ordered four-card stack');

          await A.p.locator('#ch4Start').click();await A.p.waitForSelector('#ch4CourseDialog[open] #ch4Board',{state:'visible'});
          const geo=await A.p.evaluate(()=>{const d=document.querySelector('#ch4CourseDialog');return{iw:innerWidth,sw:document.documentElement.scrollWidth,dw:d.scrollWidth,open:d.open}});
          if(!geo.open||geo.sw>geo.iw+2||geo.dw>geo.iw+2)throw new Error('Mobile overflow '+JSON.stringify(geo));
          await choice(A.p,'A fake fork');if(!/Not this\./.test(await A.p.locator('#ch4Feedback').innerText()))throw new Error('First-miss coaching missing');
          await choice(A.p,'A single threat');if(await A.p.locator('#ch4Reveal').isHidden())throw new Error('Reveal unavailable after second miss');
          await A.p.locator('#ch4Reveal').click();
          const assisted=await A.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter4.v1')).tasks.r1);
          if(!assisted?.correct||!assisted.assisted||assisted.firstTry!==false)throw new Error('Assisted accounting '+JSON.stringify(assisted));
          console.log('PASS mobile course + staged coaching + assisted accounting');await A.ctx.close();

          const B=await make();await toLearn(B.p);await B.p.locator('#ch4Start').click();await B.p.waitForSelector('#ch4CourseDialog[open] #ch4Board',{state:'visible'});
          for(const answer of ['A true fork','No — one move can answer both','Four–three fork','No — both branches must be functional']){
            await choice(B.p,answer);
            if(!/^Completed\./.test(await B.p.locator('#ch4Feedback').innerText()))throw new Error('Clean answer failed '+answer);
            if(answer!=='No — both branches must be functional')await B.p.locator('#ch4NextTask').click();
          }
          let rep=await B.p.evaluate(()=>window.GomokuCourseChapter4.report());
          if(!rep.lessons[0].complete||rep.lessons[0].rate!==1)throw new Error('Recognition lesson score '+JSON.stringify(rep.lessons[0]));
          console.log('PASS clean first-try recognition lesson');

          await B.p.evaluate(()=>window.GomokuCourseChapter4.openSection(1,0));await B.p.waitForTimeout(120);
          const candidates=await B.p.locator('#ch4Board .ch4-cell[data-candidate="1"]:not(:disabled)').count();if(candidates!==3)throw new Error('Expected three move candidates, got '+candidates);
          await B.p.locator('#ch4Board [data-coord="F6"]').click();if(!/^Completed\./.test(await B.p.locator('#ch4Feedback').innerText()))throw new Error('Fork move failed');
          await B.p.evaluate(()=>window.GomokuCourseChapter4.openSection(6,0));await B.p.waitForTimeout(120);await choice(B.p,'Forbidden — double-four');
          if(!/forbidden/i.test(await B.p.locator('#ch4Feedback').innerText()))throw new Error('Renju double-four failed');
          await B.p.evaluate(()=>window.GomokuCourseChapter4.openSection(6,2));await B.p.waitForTimeout(120);await choice(B.p,'No');
          if(!/not automatically forbidden|not automatically/i.test(await B.p.locator('#ch4Feedback').innerText()))throw new Error('Renju four-three distinction failed');
          await B.p.evaluate(()=>window.GomokuCourseChapter4.openSection(6,4));await B.p.waitForTimeout(120);await choice(B.p,'No — both threes must be genuine');
          if(!/genuine/i.test(await B.p.locator('#ch4Feedback').innerText()))throw new Error('Renju genuine-three distinction failed');
          await B.p.evaluate(()=>window.GomokuCourseChapter4.openSection(7,0));await B.p.waitForTimeout(120);
          if(!/1 \/ 12/.test(await B.p.locator('.ch4-task-count').innerText()))throw new Error('Checkpoint is not 12 positions');
          console.log('PASS fork move + Renju legality distinctions + 12-position checkpoint');

          await B.p.reload({waitUntil:'domcontentloaded'});await B.p.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000});await B.p.waitForTimeout(900);
          rep=await B.p.evaluate(()=>window.GomokuCourseChapter4.report());if(!rep.lessons[0].complete)throw new Error('Progress persistence failed');
          const close=B.p.locator('button[aria-label*="Close" i]:visible');if(await close.count())await close.first().click();await toLearn(B.p);
          const finalCounts=await B.p.evaluate(()=>({ch1:document.querySelectorAll('#ch1CourseCard').length,ch2:document.querySelectorAll('#ch2CourseCard').length,ch3:document.querySelectorAll('#ch3CourseCard').length,ch4:document.querySelectorAll('#ch4CourseCard').length}));
          if(Object.values(finalCounts).some(n=>n!==1))throw new Error('Duplicate cards '+JSON.stringify(finalCounts));
          if(B.errors.some(x=>/ch4|chapter 4/i.test(x)))throw new Error('Chapter 4 page errors '+JSON.stringify(B.errors));
          console.log('PASS persistence + rerender uniqueness');
          await B.ctx.close();await browser.close();console.log('CHAPTER4_CERTIFIED');
          JS
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node .ch4-cert.mjs
      - name: Remove certification
        if: always()
        shell: bash
        run: |
          rm -f .ch4-cert.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/certify-ch4-course.yml
          git commit -m 'Remove Chapter 4 certification' || true
          git push || true
