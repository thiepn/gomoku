name: Chapter 1 final certification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  certify:
    if: github.event.head_commit.message == 'Run Chapter 1 final certification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Certify live course
        run: |
          cat > .cert.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;if(!chrome)throw new Error('Chrome missing');
          const source=await (await fetch(root+'?cert='+Date.now(),{cache:'no-store'})).text();
          for(const x of ['course-ch1-v1-script','gomoku.course.chapter1.v1',"String(id||'').replace(/^#/,'')",'window.GomokuCourseChapter1=Object.freeze'])if(!source.includes(x))throw new Error('Missing live marker '+x);
          if((source.match(/id="course-ch1-v1-script"/g)||[]).length!==1)throw new Error('Course source duplicated');
          console.log('PASS singular normalized Chapter 1 source');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          async function fresh(){const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});const p=await ctx.newPage();await p.goto(root+'?qa='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000});await p.waitForTimeout(900);const c=p.locator('button[aria-label*="Close" i]:visible');if(await c.count())await c.first().click();return{ctx,p}}
          async function learn(p){const l=p.getByRole('button',{name:/^learn$/i});if(await l.count())await l.click();else await p.locator('[data-v92-route="improve"]').first().click();await p.waitForTimeout(500);const n=await p.locator('#ch1CourseCard').count();if(n!==1)throw new Error('Course card count '+n)}
          const A=await fresh();await learn(A.p);const api=await A.p.evaluate(()=>({open:typeof window.GomokuCourseChapter1?.open,report:typeof window.GomokuCourseChapter1?.report}));if(api.open!=='function'||api.report!=='function')throw new Error('Course API missing');await A.p.locator('#ch1Start').click();await A.p.waitForSelector('#ch1CourseDialog[open] #ch1Board',{state:'visible',timeout:5000});const g=await A.p.evaluate(()=>{const d=document.querySelector('#ch1CourseDialog');return{iw:innerWidth,sw:document.documentElement.scrollWidth,dw:d.scrollWidth,open:d.open}});if(!g.open||g.sw>g.iw+2||g.dw>g.iw+2)throw new Error('Mobile overflow '+JSON.stringify(g));console.log('PASS launcher + mobile course surface');
          await A.p.locator('#ch1CourseDialog[open] #ch1Board [data-i="0"]').click();if(!/not this/i.test(await A.p.locator('#ch1CourseDialog[open] #ch1Feedback').innerText()))throw new Error('First miss feedback');await A.p.locator('#ch1CourseDialog[open] #ch1Board [data-i="8"]').click();if(await A.p.locator('#ch1CourseDialog[open] #ch1Reveal').isHidden())throw new Error('Reveal missing');await A.p.locator('#ch1CourseDialog[open] #ch1Reveal').click();const assisted=await A.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter1.v1')).tasks.d1);if(!assisted?.correct||!assisted.assisted||assisted.firstTry!==false)throw new Error('Assisted scoring wrong '+JSON.stringify(assisted));console.log('PASS coaching + assisted accounting');await A.ctx.close();
          const B=await fresh();await learn(B.p);await B.p.locator('#ch1Start').click();await B.p.waitForSelector('#ch1CourseDialog[open] #ch1Board',{state:'visible',timeout:5000});for(const i of [42,58,60,56]){await B.p.locator('#ch1CourseDialog[open] #ch1Board [data-i="'+i+'"]').click();if(!/^Correct\./.test(await B.p.locator('#ch1CourseDialog[open] #ch1Feedback').innerText()))throw new Error('Clean answer '+i);await B.p.locator('#ch1CourseDialog[open] #ch1NextTask').click();}let r=await B.p.evaluate(()=>window.GomokuCourseChapter1.report());if(!r.lessons[0].complete||r.lessons[0].rate!==1)throw new Error('Lesson 1 report '+JSON.stringify(r.lessons[0]));console.log('PASS Lesson 1 clean first-try score');
          await B.p.reload({waitUntil:'domcontentloaded'});await B.p.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000});await B.p.waitForTimeout(900);r=await B.p.evaluate(()=>window.GomokuCourseChapter1.report());if(!r.lessons[0].complete)throw new Error('Persistence failed');const c2=B.p.locator('button[aria-label*="Close" i]:visible');if(await c2.count())await c2.first().click();await learn(B.p);if(await B.p.locator('#ch1CourseCard').count()!==1)throw new Error('Card duplicate after reload');console.log('PASS persistence + unique Learn card');
          await B.p.locator('#ch1Start').click();await B.p.waitForSelector('#ch1CourseDialog[open] #ch1Board',{state:'visible',timeout:5000});await B.p.getByRole('button',{name:/read live and blocked space/i}).click();await B.p.waitForTimeout(100);const enabled=await B.p.locator('#ch1CourseDialog[open] #ch1Board .ch1-cell:not(:disabled)').count();if(enabled!==2)throw new Error('Expected 2 candidate moves, got '+enabled);await B.p.locator('#ch1CourseDialog[open] #ch1Board [data-i="41"]').click();if(!/^Correct\./.test(await B.p.locator('#ch1CourseDialog[open] #ch1Feedback').innerText()))throw new Error('Candidate lesson failed');await B.p.getByRole('button',{name:/chapter checkpoint/i}).click();await B.p.waitForTimeout(100);if(!/1 \/ 12/.test(await B.p.locator('#ch1CourseDialog[open] .ch1-task-count').innerText()))throw new Error('Checkpoint size wrong');console.log('PASS positional lesson + 12-position checkpoint');
          const incidents=await B.p.evaluate(()=>window.__GomokuEarly117?.incidents?.().slice(-20)||[]);const errors=incidents.filter(x=>/ch1|course/i.test(x.message||''));if(errors.length)throw new Error('Chapter runtime incidents '+JSON.stringify(errors));await B.ctx.close();await browser.close();console.log('CHAPTER1_CERTIFIED');
          JS
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node .cert.mjs
      - name: Remove certification
        if: always()
        run: |
          rm -f .cert.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ch1-release-final.yml
          git commit -m 'Remove Chapter 1 final certification' || true
          git push || true
