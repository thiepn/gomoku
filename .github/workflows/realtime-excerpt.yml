name: Capture room transport excerpt

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message == 'Capture room transport excerpt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -n '3205,3275p' index.html > .github/room-transport-excerpt.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/room-transport-excerpt.txt
          git commit -m 'Capture room transport excerpt' || exit 0
          git push
