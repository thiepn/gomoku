name: Normalize Chapter 1 control selectors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Normalize Chapter 1 control selectors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize course selector helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const $=id=>dialog?.querySelector?.('#'+id)||document.getElementById(id),KEY='gomoku.course.chapter1.v1',N=9,p=(x,y)=>y*N+x,now=()=>Date.now();"
          new="const $=id=>{const key=String(id||'').replace(/^#/,'');return dialog?.querySelector?.('#'+key)||document.getElementById(key)},KEY='gomoku.course.chapter1.v1',N=9,p=(x,y)=>y*N+x,now=()=>Date.now();"
          if s.count(old)!=1: raise SystemExit('old Chapter selector helper count='+str(s.count(old)))
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          marker="const $=id=>{const key=String(id||'').replace(/^#/,'');return dialog?.querySelector?.('#'+key)||document.getElementById(key)},KEY='gomoku.course.chapter1.v1'"
          if marker not in s: raise SystemExit('normalized selector helper missing')
          if s.count('id="course-ch1-v1-script"')!=1: raise SystemExit('course source count changed')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:f.write(js);name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'script {i}: {r.stderr}')
          print('Chapter selector normalization validated')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-ch1-selector-normalization.yml
          git commit -m 'Normalize Chapter 1 control selectors'
          git push
