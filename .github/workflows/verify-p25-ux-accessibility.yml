name: P25 UX accessibility baseline audit

on:
  pull_request:
    paths:
      - 'audit/p25-*'
      - '.github/workflows/verify-p25-ux-accessibility.yml'
      - 'operations/P25-RUNBOOK.md'
      - 'online/test-p25-ux-accessibility.mjs'
      - 'ui/**'
      - 'online/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p25-ux-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p25-ux-audit:
    name: p25-ux-audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm install --no-save axe-core@4.10.3
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Capture P25 journey evidence and WCAG audit
        env:
          P25_URL: http://127.0.0.1:8765/
          P25_AXE: node_modules/axe-core/axe.min.js
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/p25-http.log 2>&1 &
          python audit/p25-ux-a11y.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p25-ux-audit-${{ github.sha }}
          path: p25-audit-output/
          retention-days: 14
          if-no-files-found: error
