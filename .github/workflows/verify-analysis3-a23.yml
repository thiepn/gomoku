name: Analysis 3.0 A23 independent multi-custodian source and recovery reconciliation
on:
  push:
    branches: [phase/a23-multicustodian-original-acceptance]
  pull_request:
    paths:
      - 'analysis3/a23-*'
      - 'analysis3/test-a23-*'
      - 'analysis3/A23-*'
      - '.github/workflows/verify-analysis3-a23.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: analysis3-a23-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nondeploying-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # P19 immutable reviewed
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # P19 immutable reviewed
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # P19 immutable reviewed
        with:
          python-version: '3.12'
      - name: Original A9 source CI archive only, never live hosted preview
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # P19 immutable reviewed
        with:
          name: analysis3-a9-immutable-candidate-evidence
          repository: thiepn/gomoku
          run-id: 37922288752
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .a23-input
      - name: Validate original immutable nested offline A9 ZIP and exact eight game asset bytes
        run: python analysis3/a10-stage-preview.py .a23-input analysis23-test-output/preview-static
      - name: Run adversarial independent escrow, Ed25519, global nonce, compromised signer and 18+7 physical tests
        run: |
          node --check analysis3/a23-multicustodian.cjs
          node --check analysis3/a23-incidents.cjs
          node --check analysis3/a23-acceptance.cjs
          node --check analysis3/test-a23-evidence.cjs
          node analysis3/test-a23-evidence.cjs
          node operations/p19-supply-chain-policy.mjs
      - name: Real Chromium local desktop/mobile/zoom/keyboard and unsigned multi-custodian dispute desk
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python analysis3/test-a23-browser.py
      - name: Verify exact head, empty real trust roots and immutable release NO_GO
        env:
          A23_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const p=require('./analysis3/a23-parent-evidence.json');
          const real=require('./analysis3/a18-review-roots.json');
          const s=require('./analysis3/a23-acceptance.cjs').status();
          assert.equal(p.realSignerRoots.length,0);
          assert.equal(p.realProviderRoots.length,0);
          assert.equal(p.physicalCasesAccepted,0);
          assert.equal(real.issuerKeys.length,0);
          assert.equal(s.status,'NO_GO');
          for(const k of ['canDeploy','canMerge','canTag','canModifyProductionData','canCertifyPhysical','canCloseRelease','canGrantOwnerAuthority'])
            assert.equal(s[k],false);
          fs.writeFileSync('analysis23-test-output/a23-qualification.json',JSON.stringify({
            format:'GomokuA23SyntheticOriginalQualificationOnly',
            sourceHeadSha:process.env.A23_SOURCE_HEAD,testedCheckoutSha:process.env.GITHUB_SHA,
            parentA22Head:p.a22Head,originalA9Run:p.a9OriginalRun,
            originalA9OfflineZipSha256:p.a9NestedZipSha256,
            classification:'SYNTHETIC_EXTERNAL_SIGNERS_AND_LOCAL_CHROMIUM_ONLY',
            actualPhysicalChrome:0,actualPhysicalSamsung:0,actualPhysicalInstalledPwa:0,
            realHumanSignerKeys:0,authorizedHostedHttps:false,realOriginalRights:false,
            independentlyAdministeredGlobalReplay:false,genuineSwUpdate:false,
            priorStablePlayerRestore:false,actualA12ProductionCutover:false,
            actualA13PostreleaseMonitoringHours:0,ownerHumanCloseout:false,
            productionDataAccessed:false,mergingOrDeployingAuthorized:false,
            decision:'NO_GO'
          },null,2)+'\n');
          console.log('PASS A23 NO_GO: exact original CI source, 0 real physical/human approvals and no production release');
          NODE
      - name: Upload synthetic-only exact-head qualification (no keys or private files)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # P19 immutable reviewed
        with:
          name: a23-synthetic-independent-custody
          path: analysis23-test-output/a23-qualification.json
          if-no-files-found: warn
          retention-days: 14
