name: Fix Chapter 1 cloned launcher events

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix Chapter 1 cloned launcher events'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden cloned launcher behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            "const keep=cards.find(x=>x.isConnected&&x.getClientRects().length)||cards[0];": "const keep=cards.find(x=>x.__gomokuCh1Owner)||cards.find(x=>x.isConnected&&x.getClientRects().length)||cards[0];",
            "const card=document.createElement('section');card.id='ch1CourseCard';": "const card=document.createElement('section');card.id='ch1CourseCard';card.__gomokuCh1Owner=true;",
            " $('#ch1Start').onclick=()=>openCourse(nextLesson());$('#ch1Review').onclick=()=>openCourse(weakestLesson());": ""
          }
          for old,new in replacements.items():
              if s.count(old)!=1: raise SystemExit(f'replacement count {s.count(old)} for {old[:70]!r}')
              s=s.replace(old,new,1)
          marker="function watchCourseCard(){if(courseCardObserver||!document.body)return;courseCardObserver=new MutationObserver(enforceSingleCourseCard);courseCardObserver.observe(document.body,{childList:true,subtree:true});window.__GomokuCourseChapter1Observer=courseCardObserver;}"
          addition=marker+"\nfunction chapterLauncherClick(e){const start=e.target?.closest?.('#ch1Start'),review=e.target?.closest?.('#ch1Review');if(!start&&!review)return;e.preventDefault();e.stopPropagation();openCourse(review?weakestLesson():nextLesson());}\ndocument.addEventListener('click',chapterLauncherClick,true);"
          if s.count(marker)!=1: raise SystemExit('observer marker mismatch')
          s=s.replace(marker,addition,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          required=['__gomokuCh1Owner','function chapterLauncherClick(e)','document.addEventListener(\'click\',chapterLauncherClick,true)','openCourse(review?weakestLesson():nextLesson())']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing '+repr(missing))
          if s.count('id="course-ch1-v1-script"')!=1: raise SystemExit('course script count changed')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:f.write(js);name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'script {i}: {r.stderr}')
          print('cloned launcher hardening validated')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-ch1-clone-events.yml
          git commit -m 'Keep Chapter 1 launcher interactive after rerenders'
          git push
