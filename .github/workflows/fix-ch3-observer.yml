name: Fix Chapter 3 observer loop

on:
  push:
    paths:
      - '.github/workflows/fix-ch3-observer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch observer
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  if(existing){
    if(ch2&&existing.previousElementSibling!==ch2)ch2.insertAdjacentElement('afterend',existing);
    updateCard();return;
  }"""
          new="""  if(existing){
    if(ch2&&existing.previousElementSibling!==ch2)ch2.insertAdjacentElement('afterend',existing);
    return;
  }"""
          if s.count(old)!=1:
              raise SystemExit(f'Expected one observer block, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="course-ch3-v1-script">\n(.*?)\n</script>',s,re.S)
          assert m
          Path('/tmp/ch3.js').write_text(m.group(1),encoding='utf-8')
          assert 'updateCard();return;' not in m.group(1)
          PY
          node --check /tmp/ch3.js
          git diff --check
      - name: Commit clean fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-ch3-observer.yml
          git commit -m 'Fix Chapter 3 observer loop'
          git push
