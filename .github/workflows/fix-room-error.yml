name: Show private room errors inline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Show private room errors inline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist connection errors in the room dialog
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""}catch(err){if(network&&!network.id)network=null;safeError(err);}}"""
          new="""}catch(err){if(network&&!network.id)network=null;const status=$('roomStatus');if(status)status.textContent=err.message||'Could not connect to this room.';safeError(err);}}"""
          count=s.count(old)
          if count!=1: raise SystemExit(f'room connect catch count={count}')
          s=s.replace(old,new,1)
          if s.count("const status=$('roomStatus');if(status)status.textContent=err.message||'Could not connect to this room.';")!=1:
              raise SystemExit('inline error hook missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ["role=\"status\"","Could not connect to this room.","workbenchDialog').open)$('workbenchDialog').close()"]:
              if x not in s: raise SystemExit('missing '+x)
          for i,js in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)):
              if not js.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:f.write(js);name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'script {i}: {r.stderr}')
          print('syntax valid')
          PY
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-room-error.yml
          git commit -m 'Show private room connection errors inline'
          git push
