      - name: Install module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          mod=Path('/tmp/ch2.html').read_text(encoding='utf-8')
          if 'id="course-ch2-v1-script"' in s: raise SystemExit('Chapter 2 already installed')
          if s.count('id="course-ch1-v1-script"')!=1: raise SystemExit('Chapter 1 baseline is not singular')
          if s.count('</body>')!=1: raise SystemExit('unexpected body closing count')
          s=s.replace('</body>',mod+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('Chapter 2 inserted')
          PY
      - name: Validate app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'ch1':s.count('id="course-ch1-v1-script"'),
            'ch2':s.count('id="course-ch2-v1-script"'),
            'ch2style':s.count('id="course-ch2-v1-style"')
          }
          if checks!={'ch1':1,'ch2':1,'ch2style':1}: raise SystemExit(str(checks))
          for marker in ['gomoku.course.chapter2.v1','window.GomokuCourseChapter2=Object.freeze','No — Black double-four is forbidden','const totalTasks=allTasks.length']:
            if marker not in s: raise SystemExit('missing marker '+marker)
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,js in enumerate(scripts):
            if not js.strip(): continue
            f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8')
            f.write(js);f.close()
            r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
            os.unlink(f.name)
            if r.returncode: raise SystemExit(f'script {i}: {r.stderr}')
          print('inline JavaScript valid; scripts',len(scripts))
          PY
          git diff --check
      - name: Commit clean implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/install-ch2-course.yml
          git commit -m 'Implement Chapter 2 Fours course'
          git push
