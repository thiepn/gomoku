name: P16 release control

on:
  pull_request:
    paths:
      - 'online/**'
      - 'operations/**'
      - 'supabase/functions/gomoku-room/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'ui/**'
      - 'analysis/**'
      - 'review/**'
      - '.github/workflows/p16-release-control.yml'
      - '.github/workflows/p17-preview-promotion.yml'
  push:
    branches: [main]
    paths:
      - 'online/**'
      - 'operations/**'
      - 'supabase/functions/gomoku-room/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'ui/**'
      - 'analysis/**'
      - 'review/**'
      - '.github/workflows/p16-release-control.yml'
      - '.github/workflows/p17-preview-promotion.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: p16-release-control-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild generated application shell
        run: |
          python ui/build.py
          python online/build-p8-client.py
      - name: Validate P16 source syntax and contracts
        run: |
          node --check operations/p15-console.js
          node --check operations/p16-release-control.mjs
          node --check operations/p16-await-checks.mjs
          python -m py_compile online/build-p8-client.py
          node online/test-p16-release-control.mjs
      - name: Wait for authoritative release checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P16_CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node operations/p16-await-checks.mjs
      - name: Submit automated admission
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          P16_GIT_SHA: ${{ github.sha }}
          P16_EVIDENCE_FILE: /tmp/p16-check-evidence.json
        run: node operations/p16-release-control.mjs admit

  orchestrate:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      P16_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Delegate deployment to P17 preview promotion
        env:
          P16_STAGE: deployment
          P16_STATUS: blocked
          P16_DETAILS_JSON: '{"reason":"delegated_to_p17","message":"Production deployment is gated by P17 preview certification and safe promotion."}'
        run: node operations/p16-release-control.mjs event

  certify_production:
    needs: [qualify, orchestrate]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.qualify.result == 'success' && needs.orchestrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Certify currently running production build
        run: node operations/p16-release-control.mjs certify

  continuous_certification:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Continuous production certification
        run: node operations/p16-release-control.mjs certify
