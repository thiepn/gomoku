name: Puzzle Training 2.0 verification
on:
  pull_request:
    paths: ['index.html', 'sw.js', 'puzzles/**', 'review/**', 'analysis/**', 'ui/**', '.github/workflows/verify-puzzle-training.yml']
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'puzzles/**', 'review/**', 'analysis/**', 'ui/**', '.github/workflows/verify-puzzle-training.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify exact content bank, reproducibility and unchanged existing application
        run: |
          echo 'cf719c2a94f0807f9be76af5aa927a563ed1764e59a46ba0f7a98b5228b310da  puzzles/bank.json' | sha256sum -c -
          python review/build.py
          python ui/build.py
          python analysis/build.py
          python puzzles/build.py
          git diff --exit-code -- index.html sw.js
          python puzzles/test-integrity.py
          python ui/test-integrity.py
          python analysis/test-integrity.py
          python review/ux/test-integrity.py
          node --check puzzles/core.js
          node --check puzzles/app.js
          node --check puzzles/store.js
          node puzzles/test-core.cjs
          node review/test-core.cjs
          node analysis/test-core.cjs
          node analysis/test-proof-coverage.cjs
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Full-app browser and native storage suites
        env:
          CHROMIUM_PATH: playwright
          PUZZLE_URL: http://127.0.0.1:8765/
          REVIEW_URL: http://127.0.0.1:8765/
          UI_URL: http://127.0.0.1:8765/
          ANALYSIS_URL: http://127.0.0.1:8765/
          WORKSPACE_URL: http://127.0.0.1:8765/
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/puzzle-http.log 2>&1 &
          python puzzles/test-browser.py
          python review/test-browser.py
          python review/test-recovery.py
          python ui/test-ui.py
          python analysis/test-browser.py
          python review/ux/test-workspace.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-training-verification
          path: |
            puzzle-test-output/
            review-test-output/
            analysis-test-output/
            ui-test-output/
            workspace-test-output/
          retention-days: 14
  deployed-puzzles:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check exact public application, worker and puzzle bank
        run: |
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          root='https://thiepn.dev/gomoku/'
          for name in ['index.html','sw.js','puzzles/bank.json','puzzles/manifest.json']:
              expected=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for attempt in range(90):
                  try:
                      request=urllib.request.Request(root+name+'?puzzle-check='+expected+'&attempt='+str(attempt),headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          received=hashlib.sha256(response.read()).hexdigest()
                      if received==expected:
                          print('EXACT_DEPLOYED_FILE',name,expected,flush=True)
                          break
                  except Exception as error:
                      print(type(error).__name__,str(error)[:160],flush=True)
                  time.sleep(4)
              else:
                  raise SystemExit('Deployed file did not match this commit: '+name)
          PY
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Exercise public puzzles, full lines, recall, storage and review
        env:
          CHROMIUM_PATH: playwright
          PUZZLE_URL: https://thiepn.dev/gomoku/?puzzle-ci=${{ github.sha }}
          REVIEW_URL: https://thiepn.dev/gomoku/?puzzle-ci=${{ github.sha }}
          ANALYSIS_URL: https://thiepn.dev/gomoku/?puzzle-ci=${{ github.sha }}
          WORKSPACE_URL: https://thiepn.dev/gomoku/?puzzle-ci=${{ github.sha }}
        run: |
          python puzzles/test-browser.py
          python review/test-browser.py
          python analysis/test-browser.py
          python review/ux/test-workspace.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-puzzle-training-verification
          path: |
            puzzle-test-output/
            review-test-output/
            analysis-test-output/
            workspace-test-output/
          retention-days: 14
