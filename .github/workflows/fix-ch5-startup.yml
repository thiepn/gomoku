name: Fix Chapter 5 startup isolation

on:
  push:
    paths:
      - '.github/workflows/fix-ch5-startup.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Defer Chapter 5 DOM mount until app ready
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'ensureDialog();ensureCard();updateCard();\nconst obs=new MutationObserver(()=>ensureCard());\nobs.observe(document.body,{childList:true,subtree:true});\nwindow.GomokuCourseChapter5={open,openSection,report,reset};'
          new = '''window.GomokuCourseChapter5={open,openSection,report,reset};
          let ch5Mounted=false;
          function mountChapter5(){
           if(ch5Mounted)return;
           ch5Mounted=true;
           ensureDialog();ensureCard();updateCard();
           const obs=new MutationObserver(()=>ensureCard());
           obs.observe(document.body,{childList:true,subtree:true});
          }
          if(document.body?.dataset?.ready==="true")setTimeout(mountChapter5,0);
          else{
           const readyObs=new MutationObserver(()=>{
            if(document.body?.dataset?.ready==="true"){readyObs.disconnect();setTimeout(mountChapter5,0);}
           });
           readyObs.observe(document.body,{attributes:true,attributeFilter:["data-ready"]});
           window.addEventListener("load",()=>{
            if(document.body?.dataset?.ready==="true"){readyObs.disconnect();setTimeout(mountChapter5,0);}
           },{once:true});
          }'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one Chapter 5 eager-mount block, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('function mountChapter5()') == 1
          assert s.count('attributeFilter:["data-ready"]') == 1
          m=re.search(r'<script id="course-ch5-v1-script">\n(.*?)\n</script>',s,re.S)
          assert m
          Path('/tmp/ch5.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/ch5.js
          git diff --check
      - name: Commit clean fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-ch5-startup.yml
          git commit -m 'Isolate Chapter 5 startup from app boot'
          git push
