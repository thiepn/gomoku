name: Fix Chapter 6 mobile action footer

on:
  push:
    paths:
      - '.github/workflows/fix-ch6-mobile-footer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Chapter 6 mobile layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if s.count('id="course-ch6-v1-script"') != 1:
              raise SystemExit('Chapter 6 marker missing or duplicated')
          replacements = [
              (
                  '.ch6-main{display:flex;flex-direction:column}',
                  '.ch6-main{display:flex;flex-direction:column;min-height:0;overflow:hidden}'
              ),
              (
                  '.ch6-stage{padding:14px 12px}',
                  '.ch6-stage{min-height:0;flex:1 1 auto;overflow:auto;padding:14px 12px}'
              ),
              (
                  '.ch6-bottom{padding:9px 10px;position:relative}',
                  '.ch6-bottom{flex:0 0 auto;padding:9px 10px;position:sticky;bottom:0;z-index:4;background:Canvas}'
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one mobile CSS target: {old!r}; got {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          out = p.read_text(encoding='utf-8')
          for _, new in replacements:
              if out.count(new) != 1:
                  raise SystemExit(f'Patched CSS missing or duplicated: {new!r}')
          for n in range(1, 7):
              marker=f'id="course-ch{n}-v1-script"'
              if out.count(marker) != 1:
                  raise SystemExit(f'Course marker check failed for Chapter {n}')
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-ch6-mobile-footer.yml
          git commit -m 'Fix Chapter 6 mobile action footer'
          git push
