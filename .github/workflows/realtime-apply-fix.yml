name: Apply private room realtime fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply private room realtime fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct patch guard and apply
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/realtime_rooms_patch.py')
          s=p.read_text()
          start=s.index("checks=['ROOM_REALTIME_MODULE'")
          end=s.index('\nfor chk in checks:',start)
          line="checks=['ROOM_REALTIME_MODULE','roomRealtimeClient',\"client.channel('gomoku:'+n.id\",'SUBSCRIBED','roomConnectionPill','visibilitychange','Network restored. Reconnecting','roomConnectionLabel()']"
          s=s[:start]+line+s[end:]
          p.write_text(s)
          PY
          python .github/realtime_rooms_patch.py
      - name: Validate patched source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          required=['ROOM_REALTIME_MODULE','roomRealtimeClient',"client.channel('gomoku:'+n.id",'SUBSCRIBED','roomConnectionPill','Network restored. Reconnecting','private-room-realtime-style']
          for x in required: assert x in s, x
          assert s.count('id="private-room-realtime-style"') == 1
          for n,m in enumerate(re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I),1):
              attrs=m.group(1).lower()
              if 'application/json' in attrs or 'importmap' in attrs: continue
              code=m.group(2)
              if not code.strip(): continue
              path=Path('/tmp')/f'gomoku-inline-{n}.js'
              path.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(path)],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'Inline script {n} syntax failed:\n{r.stderr}')
          print('Realtime source validation passed')
          PY
      - name: Commit implementation and clean temporary files
        run: |
          rm -f .github/realtime_rooms_patch.py \
                .github/room-transport-excerpt.txt \
                .github/room-stream-excerpt.txt \
                .github/workflows/realtime-inspect.yml \
                .github/workflows/realtime-excerpt.yml \
                .github/workflows/realtime-stream-excerpt.yml \
                .github/workflows/realtime-apply.yml \
                .github/workflows/realtime-apply-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add realtime private rooms and reconnect resilience'
          git push
