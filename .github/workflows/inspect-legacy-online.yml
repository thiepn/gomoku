name: Inspect obsolete online subsystem

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect obsolete online subsystem'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map obsolete online subsystem
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.find('/* Optional self-hosted competition. Offline play never touches these endpoints. */')
          current=s.find("const ROOM_PROJECT_URL='https://hycegznamzjhwinegaai.supabase.co';")
          print('START',start,'CURRENT_PRIVATE_START',current,'DIST',current-start)
          if start<0 or current<0 or current<=start: raise SystemExit('markers not found')
          block=s[start:current]
          print('LEGACY_BLOCK_LENGTH',len(block))
          print('--- BLOCK START ---')
          print(block[:9000])
          print('--- BLOCK END ---')
          print(block[-9000:])
          print('--- FUNCTION NAMES ---')
          names=[]
          for m in re.finditer(r'(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',block): names.append(m.group(1))
          print(names)
          print('--- OUTSIDE REFERENCES ---')
          outside=s[:start]+s[current:]
          terms=['queueTicket','queuePoll','pollQueue','keepQueue','platformSession','openPlatform','normalizedServer','roomStream','networkClockTimer','startSSE','ensureRoomStream','stopRoomStream']
          for term in terms:
              hits=[m.start() for m in re.finditer(re.escape(term),outside)]
              print(term,len(hits),hits[:20])
              for pos in hits[:5]: print('CTX',term, outside[max(0,pos-220):pos+320].replace('\n',' '))
          print('--- STALE COPY ---')
          for phrase in ['Optional accounts and online play require your own hosted server.','Server URL','matchmaking','Quick match']:
              print(phrase, s.count(phrase))
          PY
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/inspect-legacy-online.yml
          git commit -m 'Remove obsolete online inspection' || true
          git push || true
