name: Diagnose Chapter 8 board hit testing

on:
  push:
    paths:
      - .github/workflows/diagnose-ch8-board.yml

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    timeout-minutes: 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            data=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" || true)
            state=$(printf '%s' "$data" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=j.workflow_runs?.find(x=>x.name==='pages build and deployment');process.stdout.write(r?.conclusion||r?.status||'missing')}catch{process.stdout.write('bad')}})")
            [ "$state" = success ] && exit 0
            { [ "$state" = failure ] || [ "$state" = cancelled ]; } && exit 1
            sleep 2
          done
          exit 1
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Inspect board hit testing
        shell: bash
        run: |
          cat > .ch8-hit.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME});
          const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const p=await ctx.newPage();
          await p.goto('https://thiepn.dev/gomoku/?ch8hit='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
          await p.waitForFunction(()=>document.body?.dataset?.ready==='true'&&typeof window.GomokuCourseChapter8?.openSection==='function',null,{timeout:20000});
          await p.addStyleTag({content:'#v112WelcomeDialog{display:none!important;pointer-events:none!important}'});
          await p.evaluate(()=>{document.querySelector('[data-v92-route="improve"]')?.click();document.querySelector('#v112WelcomeDialog')?.close?.();window.GomokuCourseChapter8.openSection(1,0)});
          await p.waitForSelector('#ch8CourseDialog[open]');
          const cell=p.locator('#ch8Board [data-coord="A5"]');
          await cell.scrollIntoViewIfNeeded();
          await p.waitForTimeout(300);
          const info=await p.evaluate(()=>{
            const cell=document.querySelector('#ch8Board [data-coord="A5"]');
            const dialog=document.querySelector('#ch8CourseDialog');
            const rect=cell.getBoundingClientRect();
            const x=rect.left+rect.width/2,y=rect.top+rect.height/2;
            const ancestors=[];let n=cell;
            while(n){const cs=getComputedStyle(n);ancestors.push({tag:n.tagName,id:n.id||null,cls:n.className||null,pe:cs.pointerEvents,display:cs.display,visibility:cs.visibility,opacity:cs.opacity,inert:n.inert||false,z:cs.zIndex,rect:(()=>{const r=n.getBoundingClientRect();return[r.left,r.top,r.right,r.bottom]})()});n=n.parentElement}
            return {
              point:[x,y],cellRect:[rect.left,rect.top,rect.right,rect.bottom],
              elementFromPoint:(()=>{const e=document.elementFromPoint(x,y);return e?{tag:e.tagName,id:e.id||null,cls:e.className||null}:null})(),
              elementsFromPoint:document.elementsFromPoint(x,y).slice(0,12).map(e=>({tag:e.tagName,id:e.id||null,cls:e.className||null,pe:getComputedStyle(e).pointerEvents})),
              dialog:{open:dialog.open,modal:dialog.matches(':modal'),pe:getComputedStyle(dialog).pointerEvents,rect:(()=>{const r=dialog.getBoundingClientRect();return[r.left,r.top,r.right,r.bottom]})()},
              openDialogs:[...document.querySelectorAll('dialog[open]')].map(d=>({id:d.id,modal:d.matches(':modal'),pe:getComputedStyle(d).pointerEvents})),
              ancestors
            };
          });
          console.log('CH8_HIT_DIAG='+JSON.stringify(info));
          await p.evaluate(()=>document.querySelector('#ch8Board [data-coord="A5"]').click());
          await p.waitForTimeout(100);
          console.log('PROGRAMMATIC_FEEDBACK='+JSON.stringify(await p.locator('#ch8Feedback').innerText()));
          await browser.close();
          JS
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          timeout 60s env CHROME="$CHROME" node .ch8-hit.mjs
      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          rm -f .ch8-hit.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-ch8-board.yml
          git commit -m 'Remove Chapter 8 board diagnostic' || true
          git pull --rebase || true
          git push || true
