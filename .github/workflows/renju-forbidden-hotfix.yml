name: Renju forbidden-move hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and test
        run: python .github/renju_hotfix.py
      - name: Commit fix and remove temporary patch files
        run: |
          rm .github/renju_hotfix.py .github/workflows/renju-forbidden-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Renju forbidden moves and UI newline leak"
          git push
