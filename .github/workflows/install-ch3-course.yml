name: Install Chapter 3 Threes course

on:
  push:
    paths:
      - '.github/workflows/install-ch3-course.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Chapter 3 module
        shell: bash
        run: |
          gzip -dc .ch3-module.gz > /tmp/ch3-module.html
          echo "1d66e854240e089f4b62869720bc68609f632e071349aa0877a316b00969e2ee  /tmp/ch3-module.html" | sha256sum -c -
      - name: Install module
        shell: python
        run: |
          from pathlib import Path
          app = Path('index.html')
          html = app.read_text(encoding='utf-8')
          module = Path('/tmp/ch3-module.html').read_text(encoding='utf-8')
          if 'id="course-ch3-v1-script"' in html:
              raise SystemExit('Chapter 3 marker already exists; refusing duplicate install')
          if 'id="course-ch2-v1-script"' not in html:
              raise SystemExit('Chapter 2 baseline marker missing')
          if '</body>' not in html:
              raise SystemExit('Closing body tag missing')
          app.write_text(html.replace('</body>', module + '\n</body>', 1), encoding='utf-8')
      - name: Validate app
        shell: bash
        run: |
          test "$(grep -o 'id=\"course-ch1-v1-script\"' index.html | wc -l)" = 1
          test "$(grep -o 'id=\"course-ch2-v1-script\"' index.html | wc -l)" = 1
          test "$(grep -o 'id=\"course-ch3-v1-script\"' index.html | wc -l)" = 1
          test "$(grep -o 'gomoku.course.chapter3.v1' index.html | wc -l)" -ge 1
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="course-ch3-v1-script">\n(.*?)\n</script>',html,re.S)
          assert m, 'Chapter 3 script not found'
          Path('/tmp/ch3.js').write_text(m.group(1),encoding='utf-8')
          assert m.group(1).count('"id":"') >= 46, 'task bank appears incomplete'
          PY
          node --check /tmp/ch3.js
          git diff --check
      - name: Commit clean implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .ch3-module.gz .github/workflows/install-ch3-course.yml
          git commit -m 'Implement Chapter 3 Threes course'
          git push
