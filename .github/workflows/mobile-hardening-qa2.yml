name: Mobile multiplayer hardening QA v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  qa:
    if: github.event.head_commit.message == 'Run mobile multiplayer hardening QA v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Run production mobile multiplayer QA
        run: |
          cat > .mobile-hardening-qa2.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://thiepn.dev/gomoku/';
          const html=await (await fetch(base)).text();
          const apiKey=html.match(/ROOM_API_KEY='([^']+)'/)?.[1];
          if(!apiKey) throw new Error('ROOM_API_KEY not found in production source');
          const browser=await chromium.launch({headless:true});
          const failures=[];
          const assert=(cond,msg)=>{if(!cond){failures.push(msg);console.error('FAIL '+msg)}else console.log('PASS '+msg)};
          const visible=async loc=>await loc.count()&&await loc.first().isVisible().catch(()=>false);
          async function ready(page){
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000}).catch(()=>{});
            await page.waitForTimeout(500);
            const close=page.locator('button[aria-label*="Close" i]:visible');
            if(await close.count()) { await close.first().click(); await page.waitForTimeout(250); }
            else {
              const use=page.getByText(/use the current board/i);
              if(await visible(use)) { await use.click(); await page.waitForTimeout(250); }
            }
          }
          async function openPrivate(page){
            let route='';
            for(const c of [page.getByRole('button',{name:/private room/i}),page.locator('#onlineBtn:visible'),page.locator('#platformBtn:visible')]){
              if(await visible(c)){await c.first().click();route='direct';break;}
            }
            if(!route){
              for(const menu of [page.getByRole('button',{name:/menu/i}),page.getByRole('button',{name:/more/i}),page.locator('[data-v92-action="menu"]:visible')]){
                if(await visible(menu)){await menu.first().click();await page.waitForTimeout(150);route='menu';break;}
              }
              const pr=page.getByRole('button',{name:/private room/i});
              if(await visible(pr)){await pr.first().click();route='menu-private';}
            }
            await page.waitForTimeout(250);
            const dlg=page.locator('#workbenchDialog');
            const ok=await dlg.isVisible().catch(()=>false)&&/Private online room/i.test(await dlg.innerText().catch(()=>''));
            assert(ok,'Visible mobile path opens Private online room');
            console.log('PRIVATE_ROUTE='+route);
            if(!ok){
              const btns=await page.locator('button:visible').evaluateAll(es=>es.map(e=>({id:e.id,text:(e.innerText||'').trim(),aria:e.getAttribute('aria-label')})).slice(0,40));
              console.log('VISIBLE_BUTTONS='+JSON.stringify(btns));
              // Diagnostic fallback only, so later multiplayer checks can continue.
              await page.evaluate(()=>document.querySelector('#onlineBtn')?.click());
              await page.waitForTimeout(200);
            }
          }
          async function roomSession(page){return JSON.parse(await page.evaluate(()=>sessionStorage.getItem('gomoku.room.v4'))||'null');}
          async function serverState(session){const r=await fetch(session.base+'/api/rooms/'+session.id,{headers:{apikey:apiKey,Authorization:'Bearer '+session.token}});return {status:r.status,data:await r.json()};}

          // Portrait + landscape geometry.
          for(const vp of [{width:360,height:800},{width:390,height:844},{width:412,height:915},{width:430,height:932},{width:844,height:390},{width:915,height:412}]){
            const ctx=await browser.newContext({viewport:vp,isMobile:true,hasTouch:true}); const p=await ctx.newPage(); await ready(p);
            const m=await p.evaluate(()=>{const b=document.querySelector('.board-shell')?.getBoundingClientRect(),pl=document.querySelector('#placeBtn')?.getBoundingClientRect();return {iw:innerWidth,ih:innerHeight,sw:document.documentElement.scrollWidth,board:b?{w:b.width,h:b.height,left:b.left,right:b.right}:null,place:pl?{h:pl.height,bottom:pl.bottom}:null}});
            assert(m.sw<=m.iw+2,`${vp.width}x${vp.height} no horizontal overflow (${m.sw}/${m.iw})`);
            assert(m.board&&m.board.left>=-1&&m.board.right<=m.iw+1,`${vp.width}x${vp.height} board stays in viewport width`);
            assert(m.place?.h>=44,`${vp.width}x${vp.height} Place touch target >=44px`);
            if(vp.width<vp.height) assert(m.board.w>=vp.width*.88,`${vp.width}px portrait board uses >=88% width`);
            if(vp.width>vp.height) assert(m.board.h<=m.ih*1.55,`${vp.width}x${vp.height} landscape board is not excessively oversized (${m.board?.h}/${m.ih})`);
            await ctx.close();
          }

          const hostCtx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const guestCtx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const host=await hostCtx.newPage(),guest=await guestCtx.newPage(); await ready(host); await ready(guest);
          await openPrivate(host);
          assert(await host.locator('#roomNickname').isVisible().catch(()=>false),'Room nickname field is visible');
          await host.locator('#roomNickname').fill('QA Host');
          const create=host.locator('#createRoomBtn');
          assert(await create.isVisible().catch(()=>false),'Create room button is visible');
          await create.click();
          await host.waitForFunction(()=>!!sessionStorage.getItem('gomoku.room.v4'),{timeout:8000});
          await host.waitForTimeout(1000);
          const hs=await roomSession(host); assert(!!hs?.id&&!!hs?.token,'Host session persisted');
          console.log('QA_ROOM='+hs.id);
          assert(await host.locator('#multiplayerStrip').isVisible().catch(()=>false),'Multiplayer strip visible for host');
          assert(await host.locator('#waitingRoomCard').isVisible().catch(()=>false),'Waiting room visible before guest joins');

          await openPrivate(guest); await guest.locator('#roomNickname').fill('QA Guest'); await guest.locator('#roomCode').fill(hs.id);
          const join=guest.locator('#joinRoomBtn'); assert(await join.isVisible().catch(()=>false),'Join room button is visible'); await join.click();
          await guest.waitForFunction(id=>{try{return JSON.parse(sessionStorage.getItem('gomoku.room.v4'))?.id===id}catch{return false}},hs.id,{timeout:8000});
          await host.waitForTimeout(1500); await guest.waitForTimeout(800);
          const gs=await roomSession(guest); assert(gs?.id===hs.id,'Guest joined same room');
          assert(!(await host.locator('#waitingRoomCard').isVisible().catch(()=>false)),'Waiting room hides after guest joins');
          const hstrip=await host.locator('#multiplayerStrip').innerText(); const gstrip=await guest.locator('#multiplayerStrip').innerText();
          assert(hstrip.includes('QA Host')&&hstrip.includes('QA Guest'),'Host strip shows both names');
          assert(gstrip.includes('QA Host')&&gstrip.includes('QA Guest'),'Guest strip shows both names');
          await host.waitForFunction(()=>/online/i.test(document.querySelector('#multiplayerStrip')?.innerText||''),{timeout:6000}).catch(()=>{});
          assert(/online/i.test(await host.locator('#multiplayerStrip').innerText()),'Opponent Presence reaches online state');

          // Mobile chat sheet + pushed message.
          await host.locator('#openRoomChat').click();
          assert(await host.locator('#roomChatSheet').isVisible(),'Chat opens as bottom sheet');
          const hchat=host.locator('#roomChatSheet textarea, #roomChatSheet input').last(); await hchat.fill('hello from mobile QA'); await host.locator('#roomChatSheet').getByRole('button',{name:/send/i}).click();
          await guest.waitForTimeout(1200); await guest.locator('#openRoomChat').click();
          await guest.waitForFunction(()=>document.querySelector('#roomChatSheet')?.innerText.includes('hello from mobile QA'),{timeout:5000}).catch(()=>{});
          assert((await guest.locator('#roomChatSheet').innerText()).includes('hello from mobile QA'),'Chat message pushes to opponent');
          await guest.keyboard.press('Escape'); await host.keyboard.press('Escape');

          // Rapid double-confirm must produce only one server move.
          await host.bringToFront();
          await host.evaluate(()=>document.querySelectorAll('.board-point')[112]?.click()); await host.waitForTimeout(120);
          const place=host.locator('#placeBtn'); assert(await place.isVisible(),'Place remains reachable during online turn');
          await Promise.allSettled([place.click({timeout:3000}),place.click({timeout:3000})]); await host.waitForTimeout(1200);
          const st=await serverState(hs); const moves=st.data?.game?.moves||st.data?.moves||[];
          assert(st.status===200,'Authoritative state remains readable after rapid tap');
          assert(Array.isArray(moves)&&moves.length===1,`Rapid double Place creates exactly one move (${moves.length})`);

          // Background/foreground + offline recovery.
          await guest.bringToFront(); await guest.waitForTimeout(300); await host.bringToFront(); await host.waitForTimeout(1200);
          assert(/live|fallback|connecting|reconnecting/i.test(await host.locator('#roomConnectionPill').innerText()),'Foreground return keeps/rebuilds room connection');
          await hostCtx.setOffline(true); await host.evaluate(()=>window.dispatchEvent(new Event('offline'))); await host.waitForTimeout(250);
          assert(/offline/i.test(await host.locator('#roomConnectionPill').innerText()),'Offline state is shown immediately');
          await hostCtx.setOffline(false); await host.evaluate(()=>window.dispatchEvent(new Event('online')));
          await host.waitForFunction(()=>/live|fallback sync/i.test(document.querySelector('#roomConnectionPill')?.innerText||''),{timeout:8000}).catch(()=>{});
          assert(/live|fallback sync|connecting|reconnecting/i.test(await host.locator('#roomConnectionPill').innerText()),'Connection recovers after network restoration');

          // Third player gets a full-room error in the UI.
          const thirdCtx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true}); const third=await thirdCtx.newPage(); await ready(third); await openPrivate(third);
          await third.locator('#roomNickname').fill('QA Third'); await third.locator('#roomCode').fill(hs.id); await third.locator('#joinRoomBtn').click(); await third.waitForTimeout(900);
          const ttext=await third.locator('#workbenchDialog').innerText().catch(()=>document.body.innerText);
          assert(/full|already has|two players|unavailable/i.test(ttext),'Full room gives a clear third-player error');
          await thirdCtx.close();

          await host.screenshot({path:'qa-host-room.png',fullPage:true}); await guest.screenshot({path:'qa-guest-chat.png',fullPage:true});
          await hostCtx.close(); await guestCtx.close(); await browser.close();
          if(failures.length){console.error('QA_FAILURES='+JSON.stringify(failures));process.exit(1)}
          console.log('MOBILE_HARDENING_QA2_PASS');
          JS
          node .mobile-hardening-qa2.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-hardening-qa2
          path: qa-*.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove temporary QA workflow
        if: always()
        run: |
          rm -f .mobile-hardening-qa2.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mobile-hardening-qa2.yml
          git commit -m 'Remove mobile multiplayer hardening QA v2' || true
          git push || true
