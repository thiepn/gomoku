name: Install Tournament Table
on:
  push:
    branches: ['design/tournament-table']
    paths: ['.ui-install/**', '.github/workflows/install-tournament-table.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify transport and original application
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma
          parts=sorted(Path('.ui-install').glob('*.part'))
          assert len(parts)==4
          data=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=='5ae5155a66b22d4dc1d2ed47cfcace9d2b9aa7d9881a290a23a2504120a66599', 'Transport integrity failed'
          assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest()=='ede940b0c3f7eb757544e8e9f12f1f9aab6d79b164e80126256c2e45bc1ff2d6', 'Baseline changed: inspect before building'
          files=json.loads(lzma.decompress(data))
          allowed={'ui/README.md','ui/board-material.js','ui/build-icons.py','ui/build.py','ui/preserved-scripts.json','ui/studio.css','ui/studio.js','ui/test-integrity.py','ui/test-ui.py'}
          assert set(files)==allowed
          for name,text in files.items():
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text,encoding='utf-8')
          print('Verified and unpacked',len(files),'source files')
          PY
      - name: Build and verify preserved logic
        run: |
          python ui/build.py
          python ui/build-icons.py
          python ui/test-integrity.py
          node --check ui/studio.js
          node --check ui/board-material.js
          node review/test-core.cjs
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Exercise full app on an HTTP origin
        env:
          UI_URL: http://127.0.0.1:8765/
          REVIEW_URL: http://127.0.0.1:8765/
          CHROMIUM_PATH: playwright
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/table-http.log 2>&1 &
          python ui/test-ui.py
          python review/test-browser.py
          python review/test-recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tournament-table-install-evidence
          path: |
            ui-test-output/
            review-test-output/
          retention-days: 14
      - name: Commit tested presentation to isolated branch
        run: |
          test "$GITHUB_REF_NAME" = 'design/tournament-table'
          rm -rf .ui-install
          rm .github/workflows/install-tournament-table.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add ui index.html sw.js manifest.webmanifest icons review/build.py
          git commit -m 'Rebuild Gomoku appearance as Tournament Table with unified learning and responsive controls'
          git push origin HEAD:design/tournament-table
