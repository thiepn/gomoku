name: v1.3 AI 2.0
on:
  pull_request:
    paths: ['ai2/**','index.html','sw.js','client-cache-version.txt','.github/workflows/verify-v1.3-ai2.yml']
  push:
    branches: [main]
    paths: ['ai2/**','index.html','sw.js','client-cache-version.txt','.github/workflows/verify-v1.3-ai2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai-2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify pure AI 2.0 model
        run: node ai2/test-core.cjs
      - name: Verify R3 adaptation and game-level freeze
        run: node ai2/test-r3.cjs
      - name: Rebuild portable AI 2.0 artifact
        run: python ai2/build.py
      - name: Require committed generated artifact
        run: git diff --exit-code -- index.html sw.js
      - name: Verify AI 2.0 integration
        run: python ai2/test-integration.py
      - name: Run deterministic engine benchmark
        run: node ai2/benchmark.cjs
      - name: Preserve learning/course/review analysis contracts
        run: |
          python ui/test-integrity.py
          python analysis/test-integrity.py
          python review/ux/test-integrity.py
          python learning/test-integration.py
          python course2/test-integration.py
          node review/test-core.cjs
          node analysis/test-core.cjs
          node analysis/test-proof-coverage.cjs
      - name: Install browser runtime
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run AI 2.0 browser acceptance
        env:
          AI2_URL: http://127.0.0.1:8767/
        run: |
          python -m http.server 8767 --bind 127.0.0.1 >/tmp/ai2-http.log 2>&1 &
          python ai2/test-browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v1.3-ai-2.0
          path: ai2-test-output/
          retention-days: 14
