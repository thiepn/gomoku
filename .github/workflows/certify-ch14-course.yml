name: Final certify Chapter 14 Full-Game Mastery and Final Examination

on:
  push:
    paths: ['.github/workflows/certify-ch14-course.yml']

permissions:
  actions: read
  contents: write

jobs:
  certify:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for this commit's Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for i in $(seq 1 180); do
            data=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" || true)
            state=$(printf '%s' "$data" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=j.workflow_runs?.find(x=>x.name==='pages build and deployment');process.stdout.write(r?.conclusion||r?.status||'missing')}catch{process.stdout.write('bad')}})")
            echo "Pages: $state"
            if [ "$state" = success ]; then ok=1; break; fi
            if [ "$state" = failure ] || [ "$state" = cancelled ]; then exit 1; fi
            sleep 2
          done
          test "$ok" = 1
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Confirm live Chapter 14 source
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 50); do
            curl -fsSL "https://thiepn.dev/gomoku/?ch14source=$(date +%s%N)" -o /tmp/live.html || true
            if grep -q 'id="course-ch14-v1-script"' /tmp/live.html \
              && grep -q 'function placeCard()' /tmp/live.html \
              && grep -q 'function settleCardPlacement(attempt=0)' /tmp/live.html \
              && grep -q 'function renderMasteryBoard(task)' /tmp/live.html \
              && grep -q 'gomoku.course.chapter14.v1' /tmp/live.html \
              && grep -q 'Final Mastery Examination' /tmp/live.html; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          for n in $(seq 1 14); do
            test "$(grep -o "id=\"course-ch${n}-v1-script\"" /tmp/live.html | wc -l)" = 1
          done
      - name: Certify live Chapter 14
        shell: bash
        run: |
          cat > .ch14-cert.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;
          if(!chrome) throw new Error('Chrome missing');
          const answers=[[{"id":"m1","type":"choice","answer":"Immediate wins and losses, then forcing threats, then strategic features"},{"id":"m2","type":"choice","answer":"Find the area where the next few moves most strongly affect wins, threats, or connectivity"},{"id":"m3","type":"choice","answer":"When the opponent has a more urgent threat that your attack does not neutralize or outrun"},{"id":"m4","type":"choice","answer":"New tactical information or the opponent's reply changes the position's priorities"},{"id":"m5","type":"choice","answer":"Diagnose → generate candidates → calculate best defense → compare outcomes → play → re-evaluate"}],[{"id":"m6","type":"board","answer":"F5"},{"id":"m7","type":"board","answer":"F4"},{"id":"m8","type":"board","answer":"E5"},{"id":"m9","type":"board","answer":"F6"},{"id":"m10","type":"board","answer":"F3"}],[{"id":"m11","type":"board","answer":"F5"},{"id":"m12","type":"board","answer":"F4"},{"id":"m13","type":"board","answer":"F7"},{"id":"m14","type":"board","answer":"F4"},{"id":"m15","type":"board","answer":"F6"},{"id":"m16","type":"board","answer":"F5"}],[{"id":"m17","type":"board","answer":"F5"},{"id":"m18","type":"board","answer":"F5"},{"id":"m19","type":"board","answer":"D6"},{"id":"m20","type":"board","answer":"E5"},{"id":"m21","type":"board","answer":"G5"},{"id":"m22","type":"board","answer":"F6"}],[{"id":"m23","type":"board","answer":"F5"},{"id":"m24","type":"board","answer":"G7"},{"id":"m25","type":"board","answer":"E5"},{"id":"m26","type":"board","answer":"E6"},{"id":"m27","type":"board","answer":"F5"}],[{"id":"m28","type":"board","answer":"F4"},{"id":"m29","type":"board","answer":"F2"},{"id":"m30","type":"board","answer":"F6"},{"id":"m31","type":"board","answer":"E5"},{"id":"m32","type":"board","answer":"F4"}],[{"id":"m33","type":"board","answer":"E5"},{"id":"m34","type":"board","answer":"F5"},{"id":"m35","type":"board","answer":"F4"},{"id":"m36","type":"board","answer":"F7"}],[{"id":"m37","type":"choice","answer":"Win now → stop immediate loss → strongest forcing move → active defense → positional move"},{"id":"m38","type":"choice","answer":"It creates multiple urgent continuations that one reply may not neutralize"},{"id":"m39","type":"choice","answer":"Shape generates and ranks ideas; calculation verifies whether they actually work"},{"id":"m40","type":"choice","answer":"Search the opponent's strongest reply, not the reply you hope for"},{"id":"m41","type":"choice","answer":"Whether the move is legal with respect to overline, double-four, and forbidden double-three restrictions"},{"id":"m42","type":"choice","answer":"At a terminal result, forced conclusion, or stable node unlikely to change the candidate ranking"},{"id":"m43","type":"choice","answer":"Re-diagnose the position instead of blindly continuing the previous plan"},{"id":"m44","type":"board","answer":"F5"},{"id":"m45","type":"board","answer":"D6"},{"id":"m46","type":"board","answer":"E5"},{"id":"m47","type":"board","answer":"F2"},{"id":"m48","type":"board","answer":"E6"}]];
          const flat=answers.flat();
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const make=async()=>{
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await ctx.addInitScript(()=>{const o=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){if(this.id==='v112WelcomeDialog')return;return o.call(this)}});
            const p=await ctx.newPage(); p.setDefaultTimeout(15000); p.setDefaultNavigationTimeout(25000); const errors=[]; p.on('pageerror',e=>errors.push(e.message));
            await p.goto(root+'?ch14cert='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body?.dataset?.ready==='true'&&typeof window.GomokuCourseChapter14?.openSection==='function',null,{timeout:20000});
            await p.evaluate(()=>{document.querySelectorAll('dialog[open]:not(#ch14CourseDialog)').forEach(d=>d.close?.());document.querySelector('[data-v92-route="improve"]')?.click()});
            await p.waitForFunction(()=>document.querySelector('#ch14CourseCard')?.parentElement?.id==='v92ImproveHome'&&document.querySelector('#ch13CourseCard')?.nextElementSibling?.id==='ch14CourseCard',null,{timeout:10000});
            return {ctx,p,errors};
          };
          const open=async(p,l,t)=>{await p.evaluate(()=>document.querySelectorAll('dialog[open]:not(#ch14CourseDialog)').forEach(d=>d.close?.()));await p.evaluate(([l,t])=>window.GomokuCourseChapter14.openSection(l,t),[l,t]);await p.waitForSelector('#ch14CourseDialog[open]')};
          const assertStack=async p=>{const x=await p.evaluate(()=>{const cards=Array.from({length:14},(_,i)=>document.querySelector(`#ch${i+1}CourseCard`));const follows=(a,b)=>!!(a&&b&&(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING));return{counts:cards.map((_,i)=>document.querySelectorAll(`#ch${i+1}CourseCard`).length),order:cards.every(Boolean)&&cards.slice(0,-1).every((c,i)=>follows(c,cards[i+1])),parents:cards.map(c=>c?.parentElement?.id||null)}});if(x.counts.some(n=>n!==1)||!x.order||x.parents.some(v=>v!=='v92ImproveHome'))throw new Error('Course stack '+JSON.stringify(x));};
          const assertMobile=async(p,label)=>{const g=await p.evaluate(()=>{const d=document.querySelector('#ch14CourseDialog'),f=d?.querySelector('.ch14-bottom'),r=document.querySelector('#ch14Reveal'),b=document.querySelector('#ch14Board');const fr=f?.getBoundingClientRect(),rr=r?.getBoundingClientRect(),br=b?.getBoundingClientRect();return{iw:innerWidth,ih:innerHeight,page:document.documentElement.scrollWidth,dialog:d?.scrollWidth,footer:fr?[fr.left,fr.top,fr.right,fr.bottom,fr.width,fr.height]:null,reveal:rr?[rr.left,rr.top,rr.right,rr.bottom,rr.width,rr.height]:null,board:br?[br.left,br.top,br.right,br.bottom,br.width,br.height]:null,rv:r?.checkVisibility?.()}});if(g.page>g.iw+2||g.dialog>g.iw+2||!g.footer||g.footer[4]<=1||g.footer[5]<=1||!g.reveal||g.reveal[4]<=1||g.reveal[5]<=1||!g.rv||g.reveal[0]<-1||g.reveal[2]>g.iw+1||g.reveal[1]<-1||g.reveal[3]>g.ih+1)throw new Error(label+' mobile geometry '+JSON.stringify(g));if(g.board&&g.board[4]>g.iw+2)throw new Error(label+' board overflow '+JSON.stringify(g));};

          const A=await make(); await assertStack(A.p); let report=await A.p.evaluate(()=>window.GomokuCourseChapter14.report()); if(report.totalTasks!==48||report.totalLessons!==8)throw new Error('Report '+JSON.stringify(report));
          await open(A.p,0,0); await assertMobile(A.p,'choice shell');
          await A.p.locator('#ch14CourseDialog[open]').getByRole('button',{name:'The prettiest shape on the board',exact:true}).click();
          if(!/Not this\./.test(await A.p.locator('#ch14Feedback').innerText())||!(await A.p.locator('#ch14Reveal').isDisabled()))throw new Error('First miss coaching');
          await A.p.locator('#ch14CourseDialog[open]').getByRole('button',{name:'Only your own attacking stones',exact:true}).click();
          if(await A.p.locator('#ch14Reveal').isDisabled())throw new Error('Reveal unavailable after second miss');
          await A.p.locator('#ch14Reveal').click();
          const assisted=await A.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter14.v1')).tasks.m1);
          if(!assisted?.correct||!assisted.assisted||assisted.firstTry!==false)throw new Error('Assisted state '+JSON.stringify(assisted));
          if(A.errors.some(x=>/ch14|chapter 14/i.test(x)))throw new Error('Assisted page errors '+JSON.stringify(A.errors));
          console.log('PASS structure + mobile + staged coaching + assisted accounting'); await A.ctx.close();

          const B=await make(); await assertStack(B.p); await B.p.evaluate(()=>localStorage.removeItem('gomoku.course.chapter14.v1')); let count=0;
          for(let l=0;l<answers.length;l++)for(let t=0;t<answers[l].length;t++){
            const x=answers[l][t]; await open(B.p,l,t);
            if(x.type==='choice') await B.p.locator('#ch14CourseDialog[open]').getByRole('button',{name:x.answer,exact:true}).click();
            else {const cell=B.p.locator(`#ch14Board [data-coord="${x.answer}"]`);if(await cell.getAttribute('data-candidate')!=='1')throw new Error('Answer not candidate '+x.id);await cell.click();}
            if(!/^Completed\./.test(await B.p.locator('#ch14Feedback').innerText()))throw new Error('Task failed '+x.id);
            const rec=await B.p.evaluate(id=>JSON.parse(localStorage.getItem('gomoku.course.chapter14.v1')).tasks[id],x.id);
            if(!rec?.correct||!rec.firstTry||rec.assisted)throw new Error('Task score '+x.id+' '+JSON.stringify(rec));
            count++; if(x.id==='m6')await assertMobile(B.p,'board shell'); if(x.id==='m37'&&!/1 \/ 12/.test(await B.p.locator('.ch14-task-count').innerText()))throw new Error('Final exam checkpoint count');
          }
          if(count!==48)throw new Error('Completion count '+count);
          report=await B.p.evaluate(()=>window.GomokuCourseChapter14.report()); if(report.completed!==48||report.lessons.some(x=>!x.complete||x.rate!==1))throw new Error('Perfect report '+JSON.stringify(report));
          const persisted=await B.p.evaluate(()=>({state:JSON.parse(localStorage.getItem('gomoku.course.chapter14.v1')),report:window.GomokuCourseChapter14.report(),markerCount:document.querySelectorAll('#course-ch14-v1-script').length,cardCount:document.querySelectorAll('#ch14CourseCard').length,title:document.querySelector('#ch14CourseCard .ch14-card-title')?.textContent||''}));
          for(const x of flat)if(!persisted.state?.tasks?.[x.id]?.correct||!persisted.state.tasks[x.id].firstTry||persisted.state.tasks[x.id].assisted)throw new Error('Persisted state '+x.id);
          if(persisted.markerCount!==1||persisted.cardCount!==1||!/Full-Game Mastery/.test(persisted.title))throw new Error('Chapter 14 duplication/title '+JSON.stringify(persisted));
          if(B.errors.some(x=>/ch14|chapter 14/i.test(x)))throw new Error('Chapter 14 page errors '+JSON.stringify(B.errors));
          console.log('PASS all 48 tasks first try + perfect scoring + persisted localStorage state');
          console.log('PASS unique ordered Chapters 1-14 + final examination');
          console.log('CHAPTER14_CERTIFIED');
          await B.ctx.close(); await browser.close();
          JS
          node --check .ch14-cert.mjs
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          timeout 210s env CHROME="$CHROME" node .ch14-cert.mjs
      - name: Remove certification workflow
        if: always()
        shell: bash
        run: |
          rm -f .ch14-cert.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/certify-ch14-course.yml
          git commit -m 'Remove Chapter 14 certification' || true
          git pull --rebase || true
          git push || true
