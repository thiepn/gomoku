name: Final certify Chapter 6 Reading Sequences course

on:
  push:
    paths:
      - '.github/workflows/certify-ch6-course.yml'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Confirm patched live source
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 60); do
            curl -fsSL "https://thiepn.dev/gomoku/?ch6cert=$(date +%s%N)" -o /tmp/live.html || true
            if grep -q 'course-ch6-v1-script' /tmp/live.html && grep -q 'position:sticky;bottom:0;z-index:4;background:Canvas' /tmp/live.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          for n in 1 2 3 4 5 6; do test "$(grep -o "id=\"course-ch${n}-v1-script\"" /tmp/live.html | wc -l)" = 1; done
      - name: Certify live Chapter 6
        shell: bash
        run: |
          cat > .ch6-cert.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;if(!chrome)throw new Error('Chrome missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const dismiss=async p=>p.evaluate(()=>document.querySelectorAll('dialog[open]').forEach(d=>{if(d.id!=='ch6CourseDialog'&&typeof d.close==='function')d.close()}));
          const make=async()=>{
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const p=await ctx.newPage();p.setDefaultTimeout(15000);p.setDefaultNavigationTimeout(20000);
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto(root+'?ch6qa3='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body?.dataset?.ready==='true',null,{timeout:20000});
            await p.waitForFunction(()=>typeof window.GomokuCourseChapter6?.openSection==='function',null,{timeout:12000});
            await p.waitForTimeout(350);await dismiss(p);return{ctx,p,errors};
          };
          const toLearn=async p=>{
            await dismiss(p);
            const learn=p.getByRole('button',{name:/^learn$/i});
            if(await learn.count())await learn.first().click();else{const route=p.locator('[data-v92-route="improve"]');if(await route.count())await route.first().click();}
            await p.waitForTimeout(550);await p.waitForSelector('#ch6CourseCard',{state:'attached'});
            const stack=await p.evaluate(()=>{const cards=[1,2,3,4,5,6].map(n=>document.querySelector(`#ch${n}CourseCard`));const follows=(a,b)=>!!(a&&b&&(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING));return{counts:[1,2,3,4,5,6].map(n=>document.querySelectorAll(`#ch${n}CourseCard`).length),order:cards.every(Boolean)&&cards.slice(0,-1).every((c,i)=>follows(c,cards[i+1]))};});
            if(stack.counts.some(n=>n!==1)||!stack.order)throw new Error('Course stack '+JSON.stringify(stack));
          };
          const choose=async(p,name)=>p.locator('#ch6CourseDialog[open]').getByRole('button',{name,exact:true}).click();

          const A=await make();await toLearn(A.p);
          const api=await A.p.evaluate(()=>window.GomokuCourseChapter6.report());if(api.totalTasks!==48||api.totalLessons!==8)throw new Error('Report '+JSON.stringify(api));
          await A.p.evaluate(()=>window.GomokuCourseChapter6.openSection(0,0));await A.p.waitForSelector('#ch6CourseDialog[open] #ch6Feedback');
          const geo=await A.p.evaluate(()=>{const d=document.querySelector('#ch6CourseDialog'),b=document.querySelector('#ch6Reveal').getBoundingClientRect();return{iw:innerWidth,ih:innerHeight,sw:document.documentElement.scrollWidth,dw:d.scrollWidth,open:d.open,button:{top:b.top,bottom:b.bottom,left:b.left,right:b.right}}});
          if(!geo.open||geo.sw>geo.iw+2||geo.dw>geo.iw+2||geo.button.top<0||geo.button.bottom>geo.ih+1||geo.button.left<0||geo.button.right>geo.iw+1)throw new Error('Mobile geometry '+JSON.stringify(geo));
          await choose(A.p,'Five Black moves');if(!/Not this\./.test(await A.p.locator('#ch6Feedback').innerText()))throw new Error('First-miss coaching');
          if(!(await A.p.locator('#ch6Reveal').isDisabled()))throw new Error('Reveal early');
          await choose(A.p,'Five threats plus five replies');if(await A.p.locator('#ch6Reveal').isDisabled())throw new Error('Reveal unavailable');
          await A.p.locator('#ch6Reveal').click();
          const assisted=await A.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter6.v1')).tasks.r1);if(!assisted?.correct||!assisted.assisted||assisted.firstTry!==false)throw new Error('Assisted '+JSON.stringify(assisted));
          console.log('PASS mobile footer + staged coaching + assisted accounting');await A.ctx.close();

          const B=await make();await toLearn(B.p);await B.p.evaluate(()=>window.GomokuCourseChapter6.openSection(0,0));
          for(const answer of ['Five individual moves total',"Your immediate win, the opponent's immediate win, then forcing threats",'No — the alternative reply must also be calculated','When the opponent has a viable unaccounted-for reply']){
            await choose(B.p,answer);if(!/^Completed\./.test(await B.p.locator('#ch6Feedback').innerText()))throw new Error('Clean choice '+answer);if(answer!=='When the opponent has a viable unaccounted-for reply')await B.p.locator('#ch6NextTask').click();
          }
          let rep=await B.p.evaluate(()=>window.GomokuCourseChapter6.report());if(!rep.lessons[0].complete||rep.lessons[0].rate!==1)throw new Error('Lesson 1 score '+JSON.stringify(rep.lessons[0]));
          console.log('PASS clean first-try lesson');

          await B.p.evaluate(()=>window.GomokuCourseChapter6.openSection(1,0));await B.p.locator('#ch6Board [data-coord="D1"]').click();
          if(await B.p.locator('#ch6Board [data-coord="D1"] .black').count()!==1||await B.p.locator('#ch6Board [data-coord="D2"] .white').count()!==1)throw new Error('Forced reply rendering');
          await B.p.locator('#ch6Board [data-coord="C4"]').click();if(!/^Completed\./.test(await B.p.locator('#ch6Feedback').innerText()))throw new Error('Three-ply line');
          const r5=await B.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter6.v1')).tasks.r5);if(!r5?.correct||!r5.firstTry||r5.assisted)throw new Error('Sequence score '+JSON.stringify(r5));
          console.log('PASS three-ply forced line');

          await B.p.evaluate(()=>window.GomokuCourseChapter6.openSection(2,0));for(const c of ['B7','H7','D6'])await B.p.locator(`#ch6Board [data-coord="${c}"]`).click();
          if(!/^Completed\./.test(await B.p.locator('#ch6Feedback').innerText()))throw new Error('Five-ply line');console.log('PASS five-ply forced line');

          await B.p.evaluate(()=>window.GomokuCourseChapter6.openSection(6,4));await choose(B.p,'No — every Black move in the line must itself be legal');if(!/legality/i.test(await B.p.locator('#ch6Feedback').innerText()))throw new Error('Renju legality bridge');
          await B.p.evaluate(()=>window.GomokuCourseChapter6.openSection(7,0));if(!/1 \/ 12/.test(await B.p.locator('.ch6-task-count').innerText()))throw new Error('Checkpoint count');console.log('PASS VCT/Renju bridge + checkpoint');

          await B.p.reload({waitUntil:'domcontentloaded'});await B.p.waitForFunction(()=>document.body?.dataset?.ready==='true',null,{timeout:20000});await B.p.waitForFunction(()=>typeof window.GomokuCourseChapter6?.report==='function',null,{timeout:12000});
          rep=await B.p.evaluate(()=>window.GomokuCourseChapter6.report());if(!rep.lessons[0].complete||!rep.lessons[1].completed)throw new Error('Persistence '+JSON.stringify(rep));
          await dismiss(B.p);await toLearn(B.p);const counts=await B.p.evaluate(()=>Object.fromEntries([1,2,3,4,5,6].map(n=>['ch'+n,document.querySelectorAll(`#ch${n}CourseCard`).length])));if(Object.values(counts).some(n=>n!==1))throw new Error('Duplicates '+JSON.stringify(counts));
          if(B.errors.some(x=>/ch6|chapter 6/i.test(x)))throw new Error('Chapter 6 page errors '+JSON.stringify(B.errors));
          console.log('PASS persistence + rerender uniqueness');await B.ctx.close();await browser.close();console.log('CHAPTER6_CERTIFIED');
          JS
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node .ch6-cert.mjs
      - name: Remove certification workflow
        if: always()
        shell: bash
        run: |
          rm -f .ch6-cert.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/certify-ch6-course.yml
          git commit -m 'Remove Chapter 6 certification' || true
          git push || true
