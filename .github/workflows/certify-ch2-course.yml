name: Certify Chapter 2 Fours course

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  certify:
    if: github.event.head_commit.message == 'Certify Chapter 2 Fours course'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Wait for production build
        run: |
          ok=0
          for i in $(seq 1 45); do
            curl -fsSL "https://thiepn.dev/gomoku/?ch2ready=$(date +%s%N)" -o /tmp/live.html || true
            if grep -q 'course-ch2-v1-script' /tmp/live.html && grep -q 'gomoku.course.chapter2.v1' /tmp/live.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          test "$(grep -o 'id="course-ch1-v1-script"' /tmp/live.html | wc -l)" = 1
          test "$(grep -o 'id="course-ch2-v1-script"' /tmp/live.html | wc -l)" = 1
      - name: Certify live course
        run: |
          cat > /tmp/ch2-cert.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;if(!chrome)throw new Error('Chrome missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const make=async()=>{
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const p=await ctx.newPage();const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto(root+'?ch2qa='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000});await p.waitForTimeout(1000);
            const close=p.locator('button[aria-label*="Close" i]:visible');if(await close.count())await close.first().click();
            return{ctx,p,errors};
          };
          const toLearn=async p=>{
            const l=p.getByRole('button',{name:/^learn$/i});if(await l.count())await l.first().click();else await p.locator('[data-v92-route="improve"]').first().click();
            await p.waitForTimeout(650);
            const counts=await p.evaluate(()=>({ch1:document.querySelectorAll('#ch1CourseCard').length,ch2:document.querySelectorAll('#ch2CourseCard').length,order:(()=>{const a=document.querySelector('#ch1CourseCard'),b=document.querySelector('#ch2CourseCard');return !!(a&&b&&(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING))})()}));
            if(counts.ch1!==1||counts.ch2!==1||!counts.order)throw new Error('Course stack '+JSON.stringify(counts));
          };
          const clickChoice=async(p,name)=>p.locator('#ch2CourseDialog[open]').getByRole('button',{name,exact:true}).click();

          const A=await make();await toLearn(A.p);
          const api=await A.p.evaluate(()=>({open:typeof window.GomokuCourseChapter2?.open,section:typeof window.GomokuCourseChapter2?.openSection,report:window.GomokuCourseChapter2?.report?.()}));
          if(api.open!=='function'||api.section!=='function'||api.report?.totalTasks!==46||api.report?.totalLessons!==8)throw new Error('Chapter 2 API/report '+JSON.stringify(api));
          await A.p.locator('#ch1Start').click();await A.p.waitForSelector('#ch1CourseDialog[open] #ch1Board',{state:'visible',timeout:5000});await A.p.locator('#ch1Close').click();
          console.log('PASS Chapter 1 regression + 1/1 course stack');

          await A.p.locator('#ch2Start').click();await A.p.waitForSelector('#ch2CourseDialog[open] #ch2Board',{state:'visible',timeout:5000});
          const geo=await A.p.evaluate(()=>{const d=document.querySelector('#ch2CourseDialog');return{iw:innerWidth,sw:document.documentElement.scrollWidth,dw:d.scrollWidth,open:d.open}});
          if(!geo.open||geo.sw>geo.iw+2||geo.dw>geo.iw+2)throw new Error('Mobile Chapter 2 overflow '+JSON.stringify(geo));
          await clickChoice(A.p,'Closed four');
          if(!/Not this\./.test(await A.p.locator('#ch2CourseDialog[open] #ch2Feedback').innerText()))throw new Error('First-miss coaching missing');
          await clickChoice(A.p,'Broken four');
          if(await A.p.locator('#ch2CourseDialog[open] #ch2Reveal').isHidden())throw new Error('Reveal unavailable after second miss');
          await A.p.locator('#ch2CourseDialog[open] #ch2Reveal').click();
          const assisted=await A.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter2.v1')).tasks.r1);
          if(!assisted?.correct||!assisted.assisted||assisted.firstTry!==false)throw new Error('Assisted accounting '+JSON.stringify(assisted));
          console.log('PASS mobile surface + two-stage coaching + assisted accounting');await A.ctx.close();

          const B=await make();await toLearn(B.p);await B.p.locator('#ch2Start').click();await B.p.waitForSelector('#ch2CourseDialog[open] #ch2Board',{state:'visible',timeout:5000});
          for(const answer of ['Open four','Closed four','Broken four','Not a four']){
            await clickChoice(B.p,answer);
            if(!/^Completed\./.test(await B.p.locator('#ch2CourseDialog[open] #ch2Feedback').innerText()))throw new Error('Clean answer failed '+answer);
            await B.p.locator('#ch2CourseDialog[open] #ch2NextTask').click();
          }
          let rep=await B.p.evaluate(()=>window.GomokuCourseChapter2.report());
          if(!rep.lessons[0].complete||rep.lessons[0].rate!==1)throw new Error('Recognition lesson score '+JSON.stringify(rep.lessons[0]));
          console.log('PASS clean first-try recognition lesson');

          await B.p.evaluate(()=>window.GomokuCourseChapter2.openSection(1,4));await B.p.waitForTimeout(120);
          const candidates=await B.p.locator('#ch2CourseDialog[open] #ch2Board .ch2-cell:not(:disabled)').count();if(candidates!==2)throw new Error('Expected two move candidates, got '+candidates);
          await B.p.locator('#ch2CourseDialog[open] #ch2Board [data-coord="F5"]').click();
          if(!/^Completed\./.test(await B.p.locator('#ch2CourseDialog[open] #ch2Feedback').innerText()))throw new Error('Open-four candidate task failed');
          await B.p.evaluate(()=>window.GomokuCourseChapter2.openSection(6,1));await B.p.waitForTimeout(120);
          await clickChoice(B.p,'No — Black double-four is forbidden');
          if(!/forbidden/i.test(await B.p.locator('#ch2CourseDialog[open] #ch2Feedback').innerText()))throw new Error('Renju double-four distinction failed');
          await B.p.evaluate(()=>window.GomokuCourseChapter2.openSection(7,0));await B.p.waitForTimeout(120);
          if(!/1 \/ 12/.test(await B.p.locator('#ch2CourseDialog[open] .ch2-task-count').innerText()))throw new Error('Checkpoint is not 12 positions');
          console.log('PASS candidate exercise + Renju legality + 12-position checkpoint');

          await B.p.reload({waitUntil:'domcontentloaded'});await B.p.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000});await B.p.waitForTimeout(1000);
          rep=await B.p.evaluate(()=>window.GomokuCourseChapter2.report());if(!rep.lessons[0].complete)throw new Error('Chapter 2 progress did not persist');
          const c=B.p.locator('button[aria-label*="Close" i]:visible');if(await c.count())await c.first().click();await toLearn(B.p);
          const finalCounts=await B.p.evaluate(()=>({ch1:document.querySelectorAll('#ch1CourseCard').length,ch2:document.querySelectorAll('#ch2CourseCard').length}));if(finalCounts.ch1!==1||finalCounts.ch2!==1)throw new Error('Card duplication after reload '+JSON.stringify(finalCounts));
          if(B.errors.some(x=>/ch2|chapter 2|course/i.test(x)))throw new Error('Chapter 2 page errors '+JSON.stringify(B.errors));
          console.log('PASS persistence + rerender uniqueness');
          await B.ctx.close();await browser.close();console.log('CHAPTER2_CERTIFIED');
          JS
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node /tmp/ch2-cert.mjs
      - name: Remove certification
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/certify-ch2-course.yml
          git commit -m 'Remove Chapter 2 certification' || true
          git push || true
