name: Inspect private room realtime hooks

on:
  push:
    branches: [main]

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect private room realtime hooks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current private-room transport
        run: |
          grep -n "function ensureRoomStream\|function stopRoomStream\|function pollRoom\|function roomFetch\|function sendRoom\|function applyRoomState\|visibilitychange\|pageshow\|online\|offline" index.html | tail -n 120
          echo '=== ROOM TRANSPORT BLOCK ==='
          sed -n '3210,3265p' index.html
