name: Audit whole Gomoku course v2

on:
  push:
    paths: ['.github/workflows/audit-whole-course-v2.yml']

permissions:
  actions: read
  contents: write

jobs:
  audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Static course integrity audit
        shell: python
        run: |
          from pathlib import Path
          import re, json, sys
          s=Path('index.html').read_text(encoding='utf-8')
          hard=[]; warnings=[]
          for n in range(1,15):
            marker=f'id="course-ch{n}-v1-script"'
            if s.count(marker)!=1: hard.append(f'Chapter {n}: marker count {s.count(marker)}')
            for required in [f'ch{n}CourseCard',f'ch{n}CourseDialog',f'gomoku.course.chapter{n}.v1',f'GomokuCourseChapter{n}']:
              if required not in s: hard.append(f'Chapter {n}: missing {required}')
          prompts=re.findall(r'(?:prompt|title):["\']([^"\']{18,})["\']',s)
          from collections import Counter
          dups=[(p,c) for p,c in Counter(prompts).items() if c>2]
          if dups: warnings.append({'repeated_strings':dups[:20]})
          for bad in ['lorem ipsum','course-ch15-v1-script']:
            if bad.lower() in s.lower(): hard.append('Unexpected marker/text: '+bad)
          print('STATIC_WARNINGS',json.dumps(warnings,ensure_ascii=False))
          print('STATIC_HARD_ERRORS',json.dumps(hard,ensure_ascii=False))
          if hard: sys.exit(1)
      - name: Wait for exact Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for i in $(seq 1 180); do
            data=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" || true)
            state=$(printf '%s' "$data" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=j.workflow_runs?.find(x=>x.name==='pages build and deployment');process.stdout.write(r?.conclusion||r?.status||'missing')}catch{process.stdout.write('bad')}})")
            echo "Pages: $state"
            if [ "$state" = success ]; then ok=1; break; fi
            if [ "$state" = failure ] || [ "$state" = cancelled ]; then exit 1; fi
            sleep 2
          done
          test "$ok" = 1
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Cross-course live UI, API and curriculum audit
        shell: bash
        run: |
          cat > .course-audit-v2.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;if(!chrome)throw new Error('Chrome missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          async function run(viewport,label){
            const ctx=await browser.newContext({viewport,isMobile:viewport.width<600,hasTouch:viewport.width<600});
            await ctx.addInitScript(()=>{const o=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){if(this.id==='v112WelcomeDialog')return;return o.call(this)}});
            const p=await ctx.newPage();p.setDefaultTimeout(16000);p.setDefaultNavigationTimeout(30000);const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto(root+'?whole-course-audit-v2='+label+'-'+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body?.dataset?.ready==='true',null,{timeout:25000});
            await p.evaluate(()=>{document.querySelectorAll('dialog[open]').forEach(d=>d.close?.());document.querySelector('[data-v92-route="improve"]')?.click()});
            await p.waitForFunction(()=>document.querySelector('#ch14CourseCard')?.parentElement?.id==='v92ImproveHome',null,{timeout:12000});
            const stack=await p.evaluate(()=>{const cards=Array.from({length:14},(_,i)=>document.querySelector(`#ch${i+1}CourseCard`));const follows=(a,b)=>!!(a&&b&&(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING));return{counts:cards.map((_,i)=>document.querySelectorAll(`#ch${i+1}CourseCard`).length),parents:cards.map(c=>c?.parentElement?.id||null),order:cards.every(Boolean)&&cards.slice(0,-1).every((c,i)=>follows(c,cards[i+1]))}});
            if(stack.counts.some(x=>x!==1)||stack.parents.some(x=>x!=='v92ImproveHome')||!stack.order)throw new Error(label+' stack '+JSON.stringify(stack));
            let aggregate=0;const curriculum=[];
            for(let n=1;n<=14;n++){
              const info=await p.evaluate(n=>{const api=window[`GomokuCourseChapter${n}`],r=api?.report?.();return{api:!!api,keys:api?Object.keys(api):[],r}},n);
              if(!info.api||!info.r)throw new Error(`Chapter ${n}: missing API/report`);
              const groups=info.r.lessons||info.r.sections||[];
              const taskTotal=info.r.totalTasks ?? groups.reduce((a,x)=>a+(Number(x.total)||0),0);
              if(!groups.length||!(taskTotal>0))throw new Error(`Chapter ${n}: malformed report ${JSON.stringify(info.r)}`);
              aggregate+=taskTotal;curriculum.push({n,title:info.r.title||document?.title,lessons:groups.map(x=>x.title),taskTotal});
              console.log(`COURSE_CHAPTER ${n} title=${info.r.title||''} lessons=${groups.length} tasks=${taskTotal} :: ${groups.map(x=>x.title).join(' | ')}`);
              await p.evaluate(n=>{document.querySelectorAll('dialog[open]').forEach(d=>d.close?.());const api=window[`GomokuCourseChapter${n}`];if(typeof api.open==='function')api.open();else api.openSection?.(0,0);},n);
              await p.waitForSelector(`#ch${n}CourseDialog[open]`,{timeout:12000});
              const geo=await p.evaluate(n=>{const d=document.querySelector(`#ch${n}CourseDialog`),b=document.querySelector(`#ch${n}Board`),r=document.querySelector(`#ch${n}Reveal`);const dr=d?.getBoundingClientRect(),br=b?.getBoundingClientRect(),rr=r?.getBoundingClientRect();return{iw:innerWidth,page:document.documentElement.scrollWidth,dialog:dr?[dr.left,dr.right,dr.width,dr.height]:null,board:br?[br.left,br.right,br.width,br.height]:null,reveal:rr?[rr.left,rr.right,rr.width,rr.height]:null}},n);
              if(geo.page>geo.iw+3||!geo.dialog||geo.dialog[2]<=10||geo.dialog[3]<=10||geo.dialog[0]<-3||geo.dialog[1]>geo.iw+3)throw new Error(`Chapter ${n} ${label} dialog geometry ${JSON.stringify(geo)}`);
              if(geo.board&&geo.board[2]>geo.iw+3)throw new Error(`Chapter ${n} ${label} board overflow ${JSON.stringify(geo)}`);
              await p.evaluate(n=>document.querySelector(`#ch${n}CourseDialog`)?.close?.(),n);
            }
            if(aggregate<600)throw new Error('Course task total unexpectedly low '+aggregate);
            const courseErrors=errors.filter(x=>/course|chapter|ch\d+/i.test(x));if(courseErrors.length)throw new Error(label+' page errors '+JSON.stringify(courseErrors));
            console.log(`CURRICULUM_${label.toUpperCase()} aggregateTasks=${aggregate}`);
            if(label==='mobile')console.log('CURRICULUM_JSON '+JSON.stringify(curriculum));
            await ctx.close();
          }
          await run({width:390,height:844},'mobile');
          await run({width:1440,height:900},'desktop');
          await browser.close();console.log('WHOLE_COURSE_V2_CERTIFIED');
          JS
          node --check .course-audit-v2.mjs
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          timeout 300s env CHROME="$CHROME" node .course-audit-v2.mjs
      - name: Remove audit workflow
        if: always()
        shell: bash
        run: |
          rm -f .course-audit-v2.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-whole-course-v2.yml
          git commit -m 'Remove whole-course audit v2 workflow' || true
          git pull --rebase || true
          git push || true
