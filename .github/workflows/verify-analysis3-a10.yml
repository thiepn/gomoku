name: Analysis 3.0 A10 isolated preview and device emulation
on:
  push:
    branches:
      - phase/a10-https-preview-device-qualification
    paths:
      - 'analysis3/a10-*'
      - 'analysis3/test-a10-*'
      - '.github/workflows/verify-analysis3-a10.yml'
  pull_request:
    paths:
      - 'analysis3/a10-*'
      - 'analysis3/test-a10-*'
      - '.github/workflows/verify-analysis3-a10.yml'
permissions:
  contents: read
  actions: read
jobs:
  a10-immutable-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download exact A9 approved automation artifact (not an arbitrary branch build)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: analysis3-a9-immutable-candidate-evidence
          repository: thiepn/gomoku
          run-id: 37922288752
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .a10-input
      - name: Check executable and Python source
        run: |
          node --check analysis3/a10-preview-integrity.cjs
          node --check analysis3/test-a10.cjs
          python -m py_compile analysis3/a10-stage-preview.py analysis3/test-a10-preview-browser.py
      - name: Verify upstream completed source/run/asset hashes and stage exact eight assets
        run: python analysis3/a10-stage-preview.py .a10-input analysis10-test-output/preview-static
      - name: Run hostile host, redirect and artifact-tampering contracts
        run: node analysis3/test-a10.cjs
      - name: Run real Chromium on the byte-identical candidate (phone/tablet/desktop emulation)
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python analysis3/test-a10-preview-browser.py
      - name: Inspect final staging bytes and prevent unapproved content
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('analysis10-test-output/preview-static')
          report=json.loads(Path('analysis10-test-output/a10-verified-preview.json').read_text())
          paths=sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          assert paths==sorted(report['assets']),paths
          for p in paths:
              assert hashlib.sha256((root/p).read_bytes()).hexdigest()==report['assets'][p]
          print('PASS 8/8 A10 immutable preview assets; no production files or credentials')
          PY
      - name: Upload isolated preview shell and qualification evidence (not a deployment)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gomoku-a10-verified-isolated-preview
          path: |
            analysis10-test-output/
          retention-days: 14
          if-no-files-found: error
