name: Mobile multiplayer hardening QA v4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  qa:
    if: github.event.head_commit.message == 'Run mobile multiplayer hardening QA v4'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Run production mobile multiplayer QA
        run: |
          cat > .qa4.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://thiepn.dev/gomoku/';
          const source=await (await fetch(base)).text();
          const apiKey=source.match(/ROOM_API_KEY='([^']+)'/)?.[1];
          if(!apiKey)throw new Error('ROOM_API_KEY missing');
          const browser=await chromium.launch({headless:true});
          const failures=[];
          const check=(v,m)=>{if(v)console.log('PASS '+m);else{console.error('FAIL '+m);failures.push(m)}};
          async function boot(page){await page.goto(base,{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000}).catch(()=>{});await page.waitForTimeout(450);const c=page.locator('button[aria-label*="Close" i]:visible');if(await c.count())await c.first().click();else{const u=page.getByText(/use the current board/i);if(await u.count()&&await u.first().isVisible())await u.first().click()}await page.waitForTimeout(180)}
          async function privateRoom(page){const direct=page.getByRole('button',{name:/private room/i});if(await direct.count()&&await direct.first().isVisible())await direct.first().click();else{const menu=page.getByRole('button',{name:/menu|more/i}).first();if(await menu.count()&&await menu.isVisible())await menu.click();await page.waitForTimeout(120);const b=page.getByRole('button',{name:/private room/i});if(await b.count()&&await b.first().isVisible())await b.first().click();}await page.waitForTimeout(180);const d=page.locator('#workbenchDialog');check(await d.isVisible().catch(()=>false)&&/Private online room/i.test(await d.innerText().catch(()=>'')),'Menu → Private room opens the correct dialog');return d;}
          async function sess(p){return JSON.parse(await p.evaluate(()=>sessionStorage.getItem('gomoku.room.v4'))||'null')}
          async function state(s){const r=await fetch(s.base+'/api/rooms/'+s.id,{headers:{apikey:apiKey,Authorization:'Bearer '+s.token}});return {status:r.status,data:await r.json()}}

          for(const vp of [{width:360,height:800},{width:390,height:844},{width:412,height:915},{width:430,height:932},{width:844,height:390},{width:915,height:412}]){const ctx=await browser.newContext({viewport:vp,isMobile:true,hasTouch:true});const p=await ctx.newPage();await boot(p);const m=await p.evaluate(()=>{const b=document.querySelector('.board-shell')?.getBoundingClientRect(),pl=document.querySelector('#placeBtn')?.getBoundingClientRect();return{iw:innerWidth,ih:innerHeight,sw:document.documentElement.scrollWidth,b:b&&{w:b.width,h:b.height,l:b.left,r:b.right},ph:pl?.height||0}});check(m.sw<=m.iw+2,`${vp.width}x${vp.height} no horizontal overflow`);check(m.b&&m.b.l>=-1&&m.b.r<=m.iw+1,`${vp.width}x${vp.height} board stays inside viewport width`);check(m.ph>=44,`${vp.width}x${vp.height} Place target >=44px`);if(vp.width<vp.height)check(m.b.w>=vp.width*.88,`${vp.width}px portrait board >=88% width`);else check(m.b.h<=m.ih*1.55,`${vp.width}x${vp.height} landscape board remains usable without extreme scaling`);await ctx.close()}

          const hc=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true}),gc=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});const h=await hc.newPage(),g=await gc.newPage();await boot(h);await boot(g);
          let d=await privateRoom(h);await h.locator('#roomNickname').fill('QA Host');const create=d.getByRole('button',{name:/create room/i});check(await create.count()>0&&await create.first().isVisible(),'Create room is a visible mobile action');await create.first().click();await h.waitForFunction(()=>!!sessionStorage.getItem('gomoku.room.v4'),{timeout:8000});await h.waitForTimeout(900);const hs=await sess(h);check(!!hs?.id&&!!hs?.token,'Host session persists');console.log('QA_ROOM='+hs.id);check(await h.locator('#roomMatchHud').isVisible().catch(()=>false),'You vs Opponent HUD visible');check(await h.locator('#roomWaitingPanel').isVisible().catch(()=>false),'Waiting state visible before join');

          d=await privateRoom(g);await g.locator('#roomNickname').fill('QA Guest');await g.locator('#roomCode').fill(hs.id);const join=d.getByRole('button',{name:/join room/i});check(await join.count()>0&&await join.first().isVisible(),'Join room is a visible mobile action');await join.first().click();await g.waitForFunction(id=>{try{return JSON.parse(sessionStorage.getItem('gomoku.room.v4'))?.id===id}catch{return false}},hs.id,{timeout:8000});await h.waitForTimeout(1300);const gs=await sess(g);check(gs?.id===hs.id,'Guest joins same room');check(!(await h.locator('#roomWaitingPanel').isVisible().catch(()=>false)),'Waiting state clears after join');const ht=await h.locator('#roomMatchHud').innerText(),gt=await g.locator('#roomMatchHud').innerText();check(ht.includes('QA Host')&&ht.includes('QA Guest'),'Host HUD shows both players');check(gt.includes('QA Host')&&gt.includes('QA Guest'),'Guest HUD shows both players');await h.waitForFunction(()=>/online/i.test(document.querySelector('#roomMatchHud')?.innerText||''),{timeout:6000}).catch(()=>{});check(/online/i.test(await h.locator('#roomMatchHud').innerText()),'Presence reports opponent online');

          check(await h.locator('#roomHudChat').isVisible().catch(()=>false),'Chat button visible on mobile');await h.locator('#roomHudChat').click();check(await h.locator('#roomChatSheet').isVisible().catch(()=>false),'Chat opens as bottom sheet');await h.locator('#roomChatInput').fill('hello from mobile QA');await h.locator('#roomChatForm').getByRole('button',{name:/send/i}).click();await g.waitForTimeout(1200);await g.locator('#roomHudChat').click();await g.waitForFunction(()=>document.querySelector('#roomChatSheet')?.innerText.includes('hello from mobile QA'),{timeout:5000}).catch(()=>{});check((await g.locator('#roomChatSheet').innerText()).includes('hello from mobile QA'),'Chat pushes to opponent');await g.locator('#roomChatClose').click();await h.locator('#roomChatClose').click();

          await h.bringToFront();await h.evaluate(()=>document.querySelectorAll('.board-point')[112]?.click());await h.waitForTimeout(120);const place=h.locator('#placeBtn');check(await place.isVisible().catch(()=>false),'Place remains reachable online');await Promise.allSettled([place.click({timeout:3000}),place.click({timeout:3000})]);await h.waitForTimeout(1100);const st=await state(hs),moves=st.data?.game?.moves||st.data?.moves||[];check(st.status===200,'Authoritative state readable after rapid input');check(Array.isArray(moves)&&moves.length===1,`Rapid double Place produces one move (${moves.length})`);

          await g.bringToFront();await g.waitForTimeout(250);await h.bringToFront();await h.waitForTimeout(1000);check(/live|fallback|connecting|reconnecting/i.test(await h.locator('#roomConnectionPill').innerText()),'Foreground return retains/rebuilds connection');await hc.setOffline(true);await h.evaluate(()=>window.dispatchEvent(new Event('offline')));await h.waitForTimeout(220);check(/offline/i.test(await h.locator('#roomConnectionPill').innerText()),'Offline state visible immediately');await hc.setOffline(false);await h.evaluate(()=>window.dispatchEvent(new Event('online')));await h.waitForFunction(()=>/live|fallback sync/i.test(document.querySelector('#roomConnectionPill')?.innerText||''),{timeout:8000}).catch(()=>{});check(/live|fallback sync|connecting|reconnecting/i.test(await h.locator('#roomConnectionPill').innerText()),'Connection recovers after network restoration');

          const tc=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true}),t=await tc.newPage();await boot(t);d=await privateRoom(t);await t.locator('#roomNickname').fill('QA Third');await t.locator('#roomCode').fill(hs.id);await d.getByRole('button',{name:/join room/i}).first().click();await t.waitForTimeout(900);const txt=await d.innerText();check(/full|already has|two players|unavailable/i.test(txt),'Third player receives clear full-room error');await tc.close();

          await h.screenshot({path:'qa-host-room.png',fullPage:true});await g.screenshot({path:'qa-guest-chat.png',fullPage:true});await hc.close();await gc.close();await browser.close();if(failures.length){console.error('QA_FAILURES='+JSON.stringify(failures));process.exit(1)}console.log('MOBILE_HARDENING_QA4_PASS');
          JS
          node .qa4.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-hardening-qa4
          path: qa-*.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove temporary QA workflow
        if: always()
        run: |
          rm -f .qa4.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mobile-hardening-qa4.yml
          git commit -m 'Remove mobile multiplayer hardening QA v4' || true
          git push || true
