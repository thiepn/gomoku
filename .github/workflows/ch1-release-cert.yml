name: Chapter 1 release certification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  certify:
    if: github.event.head_commit.message == 'Run Chapter 1 release certification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Certify live course
        run: |
          cat > .cert.mjs <<'JS'
          import { chromium } from 'playwright';
          const root='https://thiepn.dev/gomoku/';
          const src=await (await fetch(root+'?ch1release='+Date.now(),{cache:'no-store'})).text();
          for(const x of ['course-ch1-v1-script','chapterLauncherClick','__gomokuCh1Owner','MutationObserver(enforceSingleCourseCard)']) if(!src.includes(x)) throw Error('missing live marker '+x);
          if((src.match(/id="course-ch1-v1-script"/g)||[]).length!==1) throw Error('course source duplicated');
          console.log('PASS source singular + clone-safe launcher');
          const browser=await chromium.launch({headless:true});
          async function make(){const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});const p=await ctx.newPage();await p.goto(root+'?qa='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000});await p.waitForTimeout(1000);const c=p.locator('button[aria-label*="Close" i]:visible');if(await c.count())await c.first().click();return{ctx,p}}
          async function toLearn(p){const l=p.getByRole('button',{name:/^learn$/i});if(await l.count())await l.click();else await p.locator('[data-v92-route="improve"]').first().click();await p.waitForTimeout(600);const count=await p.locator('#ch1CourseCard').count();if(count!==1)throw Error('course card count '+count)}
          const A=await make();await toLearn(A.p);await A.p.locator('#ch1Start').click();await A.p.waitForSelector('#ch1Board',{timeout:5000});
          const geom=await A.p.evaluate(()=>({iw:innerWidth,sw:document.documentElement.scrollWidth,dw:document.querySelector('#ch1CourseDialog').scrollWidth,open:document.querySelector('#ch1CourseDialog').open}));if(!geom.open||geom.sw>geom.iw+2||geom.dw>geom.iw+2)throw Error('mobile course geometry '+JSON.stringify(geom));
          console.log('PASS clone-safe launcher opens mobile course');
          await A.p.locator('#ch1Board [data-i="0"]').click();await A.p.locator('#ch1Board [data-i="8"]').click();if(await A.p.locator('#ch1Reveal').isHidden())throw Error('reveal unavailable after two misses');await A.p.locator('#ch1Reveal').click();const a=await A.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter1.v1')).tasks.d1);if(!a?.correct||!a.assisted||a.firstTry!==false)throw Error('assisted score '+JSON.stringify(a));console.log('PASS miss → hint → reveal accounting');await A.ctx.close();
          const B=await make();await toLearn(B.p);await B.p.locator('#ch1Start').click();await B.p.waitForSelector('#ch1Board',{timeout:5000});for(const i of [42,58,60,56]){await B.p.locator('#ch1Board [data-i="'+i+'"]').click();if(!/^Correct\./.test(await B.p.locator('#ch1Feedback').innerText()))throw Error('clean solve '+i);await B.p.locator('#ch1NextTask').click();}
          let r=await B.p.evaluate(()=>window.GomokuCourseChapter1.report());if(!r.lessons[0].complete||r.lessons[0].rate!==1)throw Error('lesson report '+JSON.stringify(r.lessons[0]));console.log('PASS clean first-try Lesson 1 completion');
          await B.p.reload({waitUntil:'domcontentloaded'});await B.p.waitForFunction(()=>document.body?.dataset?.ready==='true',{timeout:15000});await B.p.waitForTimeout(1000);r=await B.p.evaluate(()=>window.GomokuCourseChapter1.report());if(!r.lessons[0].complete)throw Error('course persistence failed');await toLearn(B.p);if(await B.p.locator('#ch1CourseCard').count()!==1)throw Error('course card duplicated after reload');console.log('PASS persistence + rerender/reload uniqueness');
          await B.p.locator('#ch1Start').click();await B.p.waitForSelector('#ch1Board',{timeout:5000});await B.p.getByRole('button',{name:/read live and blocked space/i}).click();if(await B.p.locator('#ch1Board .ch1-cell:not(:disabled)').count()!==2)throw Error('candidate lesson choice count');await B.p.locator('#ch1Board [data-i="41"]').click();if(!/^Correct\./.test(await B.p.locator('#ch1Feedback').innerText()))throw Error('candidate lesson failed');await B.p.getByRole('button',{name:/chapter checkpoint/i}).click();if(!/1 \/ 12/.test(await B.p.locator('.ch1-task-count').innerText()))throw Error('checkpoint size');console.log('PASS positional candidate lesson + 12-position checkpoint');
          await B.ctx.close();await browser.close();console.log('CHAPTER1_RELEASE_CERTIFIED');
          JS
          node .cert.mjs
      - name: Remove temporary certification
        if: always()
        run: |
          rm -f .cert.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ch1-release-cert.yml
          git commit -m 'Remove Chapter 1 release certification' || true
          git push || true
