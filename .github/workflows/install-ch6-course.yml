name: Install Chapter 6 Reading Sequences course

on:
  push:
    paths:
      - '.github/workflows/install-ch6-course.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Chapter 6 module
        shell: python
        run: |
          from pathlib import Path
          import base64, bz2, hashlib
          encoded = Path('.ch6-module.html').read_text(encoding='utf-8').strip()
          data = bz2.decompress(base64.b64decode(encoded))
          expected = '53d6193fee65fd7c0ef995251d1f799fb6cdaaa2d9e26ff71d0b4dd173a49589'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'Chapter 6 payload hash mismatch: {actual}')
          text = data.decode('utf-8')
          required = [
              'id="course-ch6-v1-script"',
              'function mountChapter6()',
              'window.GomokuCourseChapter6',
              'gomoku.course.chapter6.v1',
              'attributeFilter:["data-ready"]',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Chapter 6 module missing markers: {missing}')
          Path('/tmp/ch6-module.html').write_bytes(data)

      - name: Install Chapter 6 into app
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          module = Path('/tmp/ch6-module.html').read_text(encoding='utf-8')
          if s.count('id="course-ch5-v1-script"') != 1:
              raise SystemExit('Chapter 5 baseline marker missing or duplicated')
          count = s.count('id="course-ch6-v1-script"')
          if count > 1:
              raise SystemExit('Chapter 6 marker duplicated before install')
          if count == 0:
              idx = s.rfind('</body>')
              if idx < 0:
                  raise SystemExit('Closing body tag not found')
              s = s[:idx] + '\n' + module + '\n' + s[idx:]
              p.write_text(s, encoding='utf-8')
          final = p.read_text(encoding='utf-8')
          if final.count('id="course-ch6-v1-script"') != 1:
              raise SystemExit('Chapter 6 install did not produce exactly one module')
          for n in range(1, 7):
              marker = f'id="course-ch{n}-v1-script"'
              if final.count(marker) != 1:
                  raise SystemExit(f'Course marker check failed for Chapter {n}')

      - name: Commit installed course and clean installer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .ch6-module.html .github/workflows/install-ch6-course.yml
          git commit -m 'Implement Chapter 6 Reading Sequences course'
          git push
