name: Analysis 3.0 A19 independently original evidence and custody readiness
on:
  push:
    branches: [phase/a19-independent-evidence-custody]
  pull_request:
    paths:
      - 'analysis3/a19-*'
      - 'analysis3/test-a19-*'
      - 'analysis3/A19-*'
      - '.github/workflows/verify-analysis3-a19.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: analysis3-a19-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a19-readonly-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # P19 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # P19 pinned
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # P19 pinned
        with:
          python-version: '3.12'
      - name: Retrieve original A9 GitHub archive only, no hosted or production environment requests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # P19 pinned
        with:
          name: analysis3-a9-immutable-candidate-evidence
          repository: thiepn/gomoku
          run-id: 37922288752
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .a19-input
      - name: Verify original nested A9 ZIP and 8 source asset hashes
        run: python analysis3/a10-stage-preview.py .a19-input analysis19-test-output/preview-static
      - name: Run adversarial host byte, physical case, accessibility, replay and owner custody tests
        run: |
          node --check analysis3/a19-origin-custody.cjs
          node --check analysis3/a19-device-and-restore.cjs
          node --check analysis3/a19-release-custody.cjs
          node --check analysis3/test-a19-evidence.cjs
          node analysis3/test-a19-evidence.cjs
          node operations/p19-supply-chain-policy.mjs
      - name: Test desktop/mobile-emulated original custody desk using real local Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python analysis3/test-a19-browser.py
      - name: Assert 0 physical approvals, 0 public signer keys, real cutover OPEN, default NO-GO
        env:
          A19_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const p=require('./analysis3/a19-parent-evidence.json');
          const roots=require('./analysis3/a18-review-roots.json');
          const W=require('./analysis3/a19-release-custody.cjs');
          const r=W.status();
          assert.equal(p.realPhysicalDeviceCasesAccepted,0);
          assert.equal(p.realWitnessKeys,0);
          assert.equal(roots.issuerKeys.length,0);
          assert.equal(r.status,'NO_GO');
          assert.equal(r.actualA12Cutover,false);
          assert.equal(r.actualA13Telemetry,false);
          for(const k of ['canDeploy','canMerge','canTag','canModifyProductionData','canCertifyPhysical','canCloseRelease','canGrantOwnerAuthority'])assert.equal(r[k],false);
          fs.writeFileSync('analysis19-test-output/a19-ci-qualification.json',JSON.stringify({
            format:'GomokuA19SyntheticQualificationOnly',
            sourceHeadSha:process.env.A19_SOURCE_HEAD,
            testedCheckoutSha:process.env.GITHUB_SHA,
            originalA9RunId:37922288752,
            originalA9NestedZipSha256:p.a9NestedZipSha256,
            classification:'SYNTHETIC_NODE_AND_LOCAL_CHROMIUM',
            physicalAccepted:0,humanSignerKeys:0,hostedAuthorized:false,
            realPreviousStableRestore:false,actualA12Cutover:false,actualA13Postrelease:false,
            releaseAuthorized:false,decision:'NO_GO'
          },null,2)+'\n');
          console.log('PASS A19 NO_GO: original A9 bytes verified; zero human or physical approvals, no release.');
          NODE
      - name: Upload synthetic-only CI qualification record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # P19 pinned
        with:
          name: a19-synthetic-custody-qa
          path: analysis19-test-output/a19-ci-qualification.json
          if-no-files-found: warn
          retention-days: 14
