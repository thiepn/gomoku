name: Harden Chapter 1 initialization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Harden Chapter 1 initialization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Chapter 1 initialization idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('id="course-ch1-v1-style"')!=1 or s.count('id="course-ch1-v1-script"')!=1:
              raise SystemExit('Expected exactly one Chapter 1 source block')
          old='.ch1-skill span{display:block;height:4px;background:var(--hair);border-radius:999px;margin-top:7px;overflow:hidden}'
          new='.ch1-skill>span{display:block;height:4px;background:var(--hair);border-radius:999px;margin-top:7px;overflow:hidden}'
          if old not in s: raise SystemExit('Skill selector not found')
          s=s.replace(old,new,1)
          start="<script id=\"course-ch1-v1-script\">\n(()=>{'use strict';\n"
          hardened="<script id=\"course-ch1-v1-script\">\n(()=>{'use strict';\nif(window.__GomokuCourseChapter1Booted)return;window.__GomokuCourseChapter1Booted=true;\n"
          if s.count(start)!=1: raise SystemExit('Chapter script start mismatch')
          s=s.replace(start,hardened,1)
          mount="function mount(){\n if($('#ch1CourseCard'))return;"
          mount_hardened="function mount(){\n const existing=[...document.querySelectorAll('#ch1CourseCard')];for(let i=1;i<existing.length;i++)existing[i].remove();\n if($('#ch1CourseCard'))return;"
          if s.count(mount)!=1: raise SystemExit('Chapter mount marker mismatch')
          s=s.replace(mount,mount_hardened,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          required=['window.__GomokuCourseChapter1Booted','document.querySelectorAll(\'#ch1CourseCard\')','.ch1-skill>span{display:block;height:4px','window.GomokuCourseChapter1']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing hardening '+repr(missing))
          if s.count('id="course-ch1-v1-style"')!=1 or s.count('id="course-ch1-v1-script"')!=1: raise SystemExit('Chapter source block count changed')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(js);name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'script {i}: {r.stderr}')
          print('Chapter initialization hardening passed; scripts',len(scripts))
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-chapter1-duplicates.yml
          git commit -m 'Harden Chapter 1 course initialization'
          git push
