name: Analysis 3.0 A24 authorized-source operator field readiness
on:
  push:
    branches: [phase/a24-operator-field-acceptance]
  pull_request:
    paths:
      - 'analysis3/a24-*'
      - 'analysis3/test-a24-*'
      - 'analysis3/A24-*'
      - '.github/workflows/verify-analysis3-a24.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: analysis3-a24-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nondeploying-field-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # existing P19 immutable SHA
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # existing P19 immutable SHA
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # existing P19 immutable SHA
        with:
          python-version: '3.12'
      - name: Download only original A9 successful CI archive, NO hosted server or production
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # reviewed P19 immutable SHA
        with:
          name: analysis3-a9-immutable-candidate-evidence
          repository: thiepn/gomoku
          run-id: 37922288752
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .a24-input
      - name: Independently compare A9 nested archive and all eight original static asset bytes
        run: python analysis3/a10-stage-preview.py .a24-input analysis24-test-output/preview-static
      - name: Verify offline hosted-response original file, partial 18+7 evidence and synthetic rollback
        run: |
          node --check analysis3/a24-offline-intake.cjs
          node --check analysis3/a24-field-intake.cjs
          node --check analysis3/test-a24-operator.cjs
          node analysis3/test-a24-operator.cjs
          node operations/p19-supply-chain-policy.mjs
      - name: Run genuine localhost Chromium desktop/mobile-emulated file WebCrypto and 200-percent zoom checks
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python analysis3/test-a24-browser.py
      - name: Enforce genuine-world human/hardware/release NO_GO and authored exact head
        env:
          A24_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const real=require('./analysis3/a18-review-roots.json');
          const P=require('./analysis3/a23-parent-evidence.json');
          const r=require('./analysis3/a23-acceptance.cjs').status();
          assert.equal(P.realSignerRoots.length,0);
          assert.equal(P.realProviderRoots.length,0);
          assert.equal(P.physicalCasesAccepted,0);
          assert.equal(real.issuerKeys.length,0);
          assert.equal(r.status,'NO_GO');
          for(const k of ['canMerge','canDeploy','canTag','canModifyProductionData','canCertifyPhysical','canCloseRelease','canGrantOwnerAuthority'])assert.equal(r[k],false);
          fs.writeFileSync('analysis24-test-output/a24-qualification.json',JSON.stringify({
            format:'GomokuA24NondeployingOperatorReadinessOnly',version:24,
            authoredSourceHeadSha:process.env.A24_SOURCE_HEAD,testedCheckoutSha:process.env.GITHUB_SHA,
            qualifiedParentA23:'d36610bc49aa0cee03f3a649108fda98e99094ee',
            originalA9Sha:P.a9OriginalSha,originalA9Run:P.a9OriginalRun,
            testClassification:'GENUINE_A9_CI_BYTE_COMPARISON_PLUS_SYNTHETIC_FILE_AND_LOCAL_CHROMIUM',
            liveHostedHttpsRequests:0,realOwnerHostedApproval:false,realHumanSignerKeys:0,
            actualAndroidChromeAccepted:0,actualSamsungInternetAccepted:0,actualInstalledPwaAccepted:0,
            genuineAssistiveCasesAccepted:0,realSwUpdateOrRollback:false,
            actualPlayerStateRestore:false,actualA12Cutover:false,realA13TelemetryHours:0,
            realIndependentProviderGlobalLedger:false,realOwnerReleaseGranted:false,
            productionDataAccessed:false,releaseDecision:'NO_GO'
          },null,2)+'\n');
          console.log('PASS A24: real original A9 bytes verified, genuine external approval OPEN, release NO_GO');
          NODE
      - name: Retain non-authorizing A24 exact-head source test record only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed P19 immutable SHA
        with:
          name: a24-operator-readiness-no-authority
          path: analysis24-test-output/a24-qualification.json
          retention-days: 14
          if-no-files-found: warn
