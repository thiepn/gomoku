name: R2 runtime performance and startup qualification
on:
  pull_request:
    paths: ['r2/**','player2/**','online2/**','course2/**','learning/**','index.html','.github/workflows/verify-r2-performance.yml']
  push:
    branches: [main]
    paths: ['r2/**','player2/**','online2/**','course2/**','learning/**','index.html','.github/workflows/verify-r2-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r2-runtime:
    name: r2-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: R2 timer and embedding contract
        run: python r2/test-integration.py
      - name: Deterministic module rebuild
        run: |
          python learning/build.py
          python course2/build.py
          python online2/build.py
          python player2/build.py
          git diff --exit-code -- index.html sw.js
      - name: Core and integration preservation
        run: |
          node player2/test-core.cjs
          python player2/test-integration.py
          python learning/test-integration.py
          python course2/test-integration.py
          python online2/test-integration.py
          python library2/test-integration.py
      - name: Install browser
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Measure startup and interaction preservation
        env:
          R2_URL: http://127.0.0.1:8782/
        run: |
          python -m http.server 8782 --bind 127.0.0.1 >/tmp/r2-http.log 2>&1 &
          python r2/test-browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gomoku-r2-perf-qualification
          path: r2-test-output/
          retention-days: 14
