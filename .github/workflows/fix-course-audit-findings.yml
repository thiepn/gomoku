name: Fix Gomoku course audit findings

on:
  push:
    paths: ['.github/workflows/fix-course-audit-findings.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited course fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps=[]

          # 1) Chapter 1: prevent the 9x9 board from overflowing its grid track and covering controls.
          old='''@media(max-width:760px){\n #ch1CourseCard'''
          new='''.ch1-work{grid-template-columns:minmax(0,1fr);gap:13px}\n.ch1-board-wrap{min-width:0;width:100%}\n.ch1-board{--cell:auto;width:min(100%,398px);aspect-ratio:1;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));box-sizing:border-box}\n.ch1-cell{width:auto;height:auto;aspect-ratio:1}\n.ch1-task-copy{min-width:0}\n\n@media(max-width:760px){\n #ch1CourseCard'''
          reps.append(('Chapter 1 responsive board',old,new))

          # 2) Chapter 5: normalize report metadata while keeping backwards-compatible name.
          old='''return {totalTasks,totalLessons:lessons.length,solved:done,firstTry:first,assisted:assist,rate:done?first/done:0,lessons:lessons.map((l,i)=>({name:l.name,...sectionReport(i)})),skills};'''
          new='''return {title:"Defense",totalTasks,totalLessons:lessons.length,solved:done,firstTry:first,assisted:assist,rate:done?first/done:0,lessons:lessons.map((l,i)=>({title:l.name,name:l.name,...sectionReport(i)})),skills};'''
          reps.append(('Chapter 5 report titles',old,new))

          # 3) Chapter 5: clearly separate Renju-only legality from ordinary Gomoku defense.
          old='''"name":"Renju defensive resources","intro":"Under Renju, Black's forbidden moves change defensive geometry. White can use those illegal Black points as tactical resources, while Black must defend without stepping into a foul."'''
          new='''"name":"Renju variant preview: defensive resources","intro":"Variant preview — Renju only. These forbidden-move restrictions do not apply to ordinary Gomoku. Under Renju, Black's forbidden moves change defensive geometry: White can use illegal Black points as tactical resources, while Black must defend without stepping into a foul."'''
          reps.append(('Chapter 5 Renju lesson framing',old,new))
          old='''<p>Immediate blocks, multi-threat coverage, fork prevention, active defense, move order, and Renju defensive resources.</p>'''
          new='''<p>Immediate blocks, multi-threat coverage, fork prevention, active defense, move order, plus a clearly labeled Renju-variant preview.</p>'''
          reps.append(('Chapter 5 card framing',old,new))

          # 4) Chapter 11: make local-diagram vs official competition format explicit.
          old='''"intro":"The opening is not about forcing a win immediately. It is about placing early stones where they can participate in several future plans. Before committing to a local attack, value central influence, flexible connections, tactical safety, and the ability to respond to the opponent without wasting tempo."'''
          new='''"intro":"The opening is not about forcing a win immediately. It is about placing early stones where they can participate in several future plans. Before committing to a local attack, value central influence, flexible connections, tactical safety, and the ability to respond to the opponent without wasting tempo. The compact 9×9 boards in this course are local training diagrams; official RIF Gomoku is played on a 15×15 board and uses the Swap2 opening procedure."'''
          reps.append(('Chapter 11 official format intro',old,new))
          old='''<div class="ch11-card-sub">Build flexible early shapes, use central influence, respond intelligently to symmetry, avoid overcommitment, and know when development becomes a concrete middlegame plan.</div>'''
          new='''<div class="ch11-card-sub">Build flexible early shapes, use central influence, avoid overcommitment, and transition into a concrete plan. Course boards are compact local drills; official RIF Gomoku uses 15×15 and Swap2.</div>'''
          reps.append(('Chapter 11 card framing',old,new))
          old='''{"type":"choice","id":"o43","prompt":"Which opening move is usually more valuable when both are tactically safe?","options":["The one that keeps more useful future plans and responses available","The one that creates the densest local group","The one that is farthest from the opponent"],"answer":0,"explain":"Future utility is the central opening metric: development should preserve options rather than reduce them unnecessarily."}'''
          new='''{"type":"choice","id":"o43","prompt":"What is the official RIF competition format this course's local opening diagrams should ultimately transfer to?","options":["A 15×15 board with the Swap2 opening procedure","A 9×9 board with unrestricted first moves","A 19×19 board with Renju forbidden moves for both colors"],"answer":0,"explain":"The 9×9 positions here isolate opening decisions for practice. Official RIF Gomoku is played on a 15×15 board, and the international rules specify the Swap2 opening procedure."}'''
          reps.append(('Chapter 11 official-format checkpoint',old,new))

          for label,old,new in reps:
            c=s.count(old)
            if c!=1:
              raise SystemExit(f'{label}: expected exact replacement count 1, got {c}')
            s=s.replace(old,new)

          # Invariants: course remains 14 chapters / 655 tasks and no marker duplication.
          for n in range(1,15):
            marker=f'id="course-ch{n}-v1-script"'
            if s.count(marker)!=1: raise SystemExit(f'Chapter {n} marker count changed')
          for key in ['gomoku.course.chapter1.v1','gomoku.course.chapter5.v1','gomoku.course.chapter11.v1','course-ch14-v1-script']:
            if key not in s: raise SystemExit(f'missing invariant {key}')
          p.write_text(s,encoding='utf-8')
          print('Applied',len(reps),'audited fixes')
      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-course-audit-findings.yml
          git commit -m 'Fix whole-course audit findings'
          git push
