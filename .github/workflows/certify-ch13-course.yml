name: Final certify Chapter 13 Expert Calculation and Candidate Search

on:
  push:
    paths: ['.github/workflows/certify-ch13-course.yml']

permissions:
  actions: read
  contents: write

jobs:
  certify:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for this commit's Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for i in $(seq 1 150); do
            data=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" || true)
            state=$(printf '%s' "$data" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=j.workflow_runs?.find(x=>x.name==='pages build and deployment');process.stdout.write(r?.conclusion||r?.status||'missing')}catch{process.stdout.write('bad')}})")
            echo "Pages: $state"
            if [ "$state" = success ]; then ok=1; break; fi
            if [ "$state" = failure ] || [ "$state" = cancelled ]; then exit 1; fi
            sleep 2
          done
          test "$ok" = 1
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Confirm live Chapter 13 source
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 50); do
            curl -fsSL "https://thiepn.dev/gomoku/?ch13source=$(date +%s%N)" -o /tmp/live.html || true
            if grep -q 'id="course-ch13-v1-script"' /tmp/live.html \
              && grep -q 'function placeCard()' /tmp/live.html \
              && grep -q 'function settleCardPlacement(attempt=0)' /tmp/live.html \
              && grep -q 'function renderCalculationBoard(task)' /tmp/live.html \
              && grep -q 'gomoku.course.chapter13.v1' /tmp/live.html; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          for n in $(seq 1 13); do
            test "$(grep -o "id=\"course-ch${n}-v1-script\"" /tmp/live.html | wc -l)" = 1
          done
      - name: Certify live Chapter 13
        shell: bash
        run: |
          cat > .ch13-cert.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const root='https://thiepn.dev/gomoku/';
          const chrome=process.env.CHROME;
          if(!chrome) throw new Error('Chrome missing');
          const answers=[[{"id":"c1","type":"choice","answer":"Reduce the position to a small set of moves that deserve calculation without omitting urgent tactical moves"},{"id":"c2","type":"choice","answer":"Win now → stop immediate loss → strongest forcing moves → active defenses → positional moves"},{"id":"c3","type":"choice","answer":"It spends depth on obviously inferior branches and makes it easier to miss the important forcing lines"},{"id":"c4","type":"choice","answer":"After immediate tactical obligations are checked and the move meaningfully improves the position"},{"id":"c5","type":"choice","answer":"Stop adding moves once the urgent tactical classes and a few credible strategic alternatives are covered"}],[{"id":"c6","type":"board","answer":"F5"},{"id":"c7","type":"board","answer":"F4"},{"id":"c8","type":"board","answer":"F5"},{"id":"c9","type":"board","answer":"E5"},{"id":"c10","type":"board","answer":"F6"}],[{"id":"c11","type":"board","answer":"F5"},{"id":"c12","type":"board","answer":"D6"},{"id":"c13","type":"board","answer":"F6"},{"id":"c14","type":"board","answer":"F4"},{"id":"c15","type":"board","answer":"F7"},{"id":"c16","type":"board","answer":"F6"}],[{"id":"c17","type":"board","answer":"D5"},{"id":"c18","type":"board","answer":"E4"},{"id":"c19","type":"board","answer":"E4"},{"id":"c20","type":"board","answer":"C6"},{"id":"c21","type":"board","answer":"D6"},{"id":"c22","type":"board","answer":"E5"}],[{"id":"c23","type":"board","answer":"F5"},{"id":"c24","type":"board","answer":"F4"},{"id":"c25","type":"board","answer":"F5"},{"id":"c26","type":"board","answer":"E5"},{"id":"c27","type":"board","answer":"F7"}],[{"id":"c28","type":"board","answer":"F5"},{"id":"c29","type":"board","answer":"F5"},{"id":"c30","type":"board","answer":"F6"},{"id":"c31","type":"board","answer":"F4"},{"id":"c32","type":"board","answer":"G4"}],[{"id":"c33","type":"board","answer":"F5"},{"id":"c34","type":"board","answer":"D6"},{"id":"c35","type":"board","answer":"F4"},{"id":"c36","type":"board","answer":"F4"}],[{"id":"c37","type":"choice","answer":"Generate serious candidates → order forcing moves → search best defense → prune proven losers → compare worst cases → extend forcing lines → stop at a settled result"},{"id":"c38","type":"choice","answer":"Cooperative calculation in which your line only works because the opponent chooses a weak reply"},{"id":"c39","type":"choice","answer":"After a branch is shown to fail a tactical requirement, lose immediately, or be dominated by a stronger proven result"},{"id":"c40","type":"choice","answer":"By the result each can guarantee against the opponent's strongest defense"},{"id":"c41","type":"choice","answer":"When the line still contains immediate wins, compulsory blocks, or forcing threats"},{"id":"c42","type":"choice","answer":"A terminal result, a forced tactical conclusion, or a stable position where deeper search is unlikely to change the candidate ranking"},{"id":"c43","type":"choice","answer":"They can decide or constrain the game before positional alternatives become relevant"},{"id":"c44","type":"board","answer":"F5"},{"id":"c45","type":"board","answer":"F5"},{"id":"c46","type":"board","answer":"D5"},{"id":"c47","type":"board","answer":"F6"},{"id":"c48","type":"board","answer":"F4"}]];
          const flat=answers.flat();
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const make=async()=>{
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await ctx.addInitScript(()=>{const o=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){if(this.id==='v112WelcomeDialog')return;return o.call(this)}});
            const p=await ctx.newPage(); p.setDefaultTimeout(15000); p.setDefaultNavigationTimeout(25000); const errors=[]; p.on('pageerror',e=>errors.push(e.message));
            await p.goto(root+'?ch13cert='+Date.now(),{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.body?.dataset?.ready==='true'&&typeof window.GomokuCourseChapter13?.openSection==='function',null,{timeout:20000});
            await p.evaluate(()=>{document.querySelectorAll('dialog[open]:not(#ch13CourseDialog)').forEach(d=>d.close?.());document.querySelector('[data-v92-route="improve"]')?.click()});
            await p.waitForFunction(()=>document.querySelector('#ch13CourseCard')?.parentElement?.id==='v92ImproveHome'&&document.querySelector('#ch12CourseCard')?.nextElementSibling?.id==='ch13CourseCard',null,{timeout:10000});
            return {ctx,p,errors};
          };
          const open=async(p,l,t)=>{await p.evaluate(()=>document.querySelectorAll('dialog[open]:not(#ch13CourseDialog)').forEach(d=>d.close?.()));await p.evaluate(([l,t])=>window.GomokuCourseChapter13.openSection(l,t),[l,t]);await p.waitForSelector('#ch13CourseDialog[open]')};
          const assertStack=async p=>{const x=await p.evaluate(()=>{const cards=Array.from({length:13},(_,i)=>document.querySelector(`#ch${i+1}CourseCard`));const follows=(a,b)=>!!(a&&b&&(a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING));return{counts:cards.map((_,i)=>document.querySelectorAll(`#ch${i+1}CourseCard`).length),order:cards.every(Boolean)&&cards.slice(0,-1).every((c,i)=>follows(c,cards[i+1])),parents:cards.map(c=>c?.parentElement?.id||null)}});if(x.counts.some(n=>n!==1)||!x.order||x.parents.some(v=>v!=='v92ImproveHome'))throw new Error('Course stack '+JSON.stringify(x));};
          const assertMobile=async(p,label)=>{const g=await p.evaluate(()=>{const d=document.querySelector('#ch13CourseDialog'),f=d?.querySelector('.ch13-bottom'),r=document.querySelector('#ch13Reveal'),b=document.querySelector('#ch13Board');const fr=f?.getBoundingClientRect(),rr=r?.getBoundingClientRect(),br=b?.getBoundingClientRect();return{iw:innerWidth,ih:innerHeight,page:document.documentElement.scrollWidth,dialog:d?.scrollWidth,footer:fr?[fr.left,fr.top,fr.right,fr.bottom,fr.width,fr.height]:null,reveal:rr?[rr.left,rr.top,rr.right,rr.bottom,rr.width,rr.height]:null,board:br?[br.left,br.top,br.right,br.bottom,br.width,br.height]:null,rv:r?.checkVisibility?.()}});if(g.page>g.iw+2||g.dialog>g.iw+2||!g.footer||g.footer[4]<=1||g.footer[5]<=1||!g.reveal||g.reveal[4]<=1||g.reveal[5]<=1||!g.rv||g.reveal[0]<-1||g.reveal[2]>g.iw+1||g.reveal[1]<-1||g.reveal[3]>g.ih+1)throw new Error(label+' mobile geometry '+JSON.stringify(g));if(g.board&&g.board[4]>g.iw+2)throw new Error(label+' board overflow '+JSON.stringify(g));};

          const A=await make(); await assertStack(A.p); let report=await A.p.evaluate(()=>window.GomokuCourseChapter13.report()); if(report.totalTasks!==48||report.totalLessons!==8)throw new Error('Report '+JSON.stringify(report));
          await open(A.p,0,0); await assertMobile(A.p,'choice shell');
          await A.p.locator('#ch13CourseDialog[open]').getByRole('button',{name:'List every legal move so no branch is ever ignored',exact:true}).click();
          if(!/Not this\./.test(await A.p.locator('#ch13Feedback').innerText())||!(await A.p.locator('#ch13Reveal').isDisabled()))throw new Error('First miss coaching');
          await A.p.locator('#ch13CourseDialog[open]').getByRole('button',{name:'Choose the visually most central move before checking tactics',exact:true}).click();
          if(await A.p.locator('#ch13Reveal').isDisabled())throw new Error('Reveal unavailable after second miss');
          await A.p.locator('#ch13Reveal').click();
          const assisted=await A.p.evaluate(()=>JSON.parse(localStorage.getItem('gomoku.course.chapter13.v1')).tasks.c1);
          if(!assisted?.correct||!assisted.assisted||assisted.firstTry!==false)throw new Error('Assisted state '+JSON.stringify(assisted));
          if(A.errors.some(x=>/ch13|chapter 13/i.test(x)))throw new Error('Assisted page errors '+JSON.stringify(A.errors));
          console.log('PASS structure + mobile + staged coaching + assisted accounting'); await A.ctx.close();

          const B=await make(); await assertStack(B.p); await B.p.evaluate(()=>localStorage.removeItem('gomoku.course.chapter13.v1')); let count=0;
          for(let l=0;l<answers.length;l++)for(let t=0;t<answers[l].length;t++){
            const x=answers[l][t]; await open(B.p,l,t);
            if(x.type==='choice') await B.p.locator('#ch13CourseDialog[open]').getByRole('button',{name:x.answer,exact:true}).click();
            else {const cell=B.p.locator(`#ch13Board [data-coord="${x.answer}"]`);if(await cell.getAttribute('data-candidate')!=='1')throw new Error('Answer not candidate '+x.id);await cell.click();}
            if(!/^Completed\./.test(await B.p.locator('#ch13Feedback').innerText()))throw new Error('Task failed '+x.id);
            const rec=await B.p.evaluate(id=>JSON.parse(localStorage.getItem('gomoku.course.chapter13.v1')).tasks[id],x.id);
            if(!rec?.correct||!rec.firstTry||rec.assisted)throw new Error('Task score '+x.id+' '+JSON.stringify(rec));
            count++; if(x.id==='c6')await assertMobile(B.p,'board shell'); if(x.id==='c37'&&!/1 \/ 12/.test(await B.p.locator('.ch13-task-count').innerText()))throw new Error('Checkpoint count');
          }
          if(count!==48)throw new Error('Completion count '+count);
          report=await B.p.evaluate(()=>window.GomokuCourseChapter13.report()); if(report.completed!==48||report.lessons.some(x=>!x.complete||x.rate!==1))throw new Error('Perfect report '+JSON.stringify(report));
          const persisted=await B.p.evaluate(()=>({state:JSON.parse(localStorage.getItem('gomoku.course.chapter13.v1')),report:window.GomokuCourseChapter13.report(),markerCount:document.querySelectorAll('#course-ch13-v1-script').length,cardCount:document.querySelectorAll('#ch13CourseCard').length}));
          for(const x of flat)if(!persisted.state?.tasks?.[x.id]?.correct||!persisted.state.tasks[x.id].firstTry||persisted.state.tasks[x.id].assisted)throw new Error('Persisted state '+x.id);
          if(persisted.markerCount!==1||persisted.cardCount!==1)throw new Error('Chapter 13 duplication');
          if(B.errors.some(x=>/ch13|chapter 13/i.test(x)))throw new Error('Chapter 13 page errors '+JSON.stringify(B.errors));
          console.log('PASS all 48 tasks first try + perfect scoring + persisted localStorage state');
          console.log('PASS unique ordered Chapters 1-13');
          console.log('CHAPTER13_CERTIFIED');
          await B.ctx.close(); await browser.close();
          JS
          node --check .ch13-cert.mjs
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          timeout 180s env CHROME="$CHROME" node .ch13-cert.mjs
      - name: Remove certification workflow
        if: always()
        shell: bash
        run: |
          rm -f .ch13-cert.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/certify-ch13-course.yml
          git commit -m 'Remove Chapter 13 certification' || true
          git pull --rebase || true
          git push || true
